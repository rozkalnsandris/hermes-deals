title = "Hermes Deals secret scanning"
minVersion = "8.30.0"

[extend]
useDefault = true

[[rules]]
id = "cloudflare-access-client-secret"
description = "Cloudflare Access client secret assigned in source or configuration"
regex = '''(?i)(?:CF_ACCESS_CLIENT_SECRET)[\s:=\"']+([A-Za-z0-9_./+=-]{16,})'''
secretGroup = 1
keywords = ["cf_access_client_secret"]

[[rules]]
id = "database-url-password"
description = "Password embedded in a database connection URL"
regex = '''(?i)(?:postgres(?:ql)?|mysql|mariadb|redis)://[^:\s/@]+:([^@\s/]{8,})@'''
secretGroup = 1
keywords = ["postgres://", "postgresql://", "mysql://", "mariadb://", "redis://"]

[[rules]]
id = "password-assignment"
description = "Password assigned directly in configuration or source"
regex = '''(?i)(?:POSTGRES_PASSWORD|DB_PASSWORD|ADMIN_PASSWORD|PASSWORD|PASSWD)[ \t]*(?:=|:)[ \t]*[\"']?([A-Za-z0-9_./+=@#$%^&*!?-]{12,})'''
secretGroup = 1
keywords = ["password", "passwd", "postgres_password", "db_password", "admin_password"]

[allowlist]
description = "Only explicit non-secret placeholders; historical false positives are pinned by exact immutable finding identity in security/gitleaks-history-allowlist.json"
regexTarget = "match"
regexes = [
  '''CHANGE_ME''',
  '''replace-with-a-random-secret''',
  '''ci-placeholder-not-a-secret'''
]

[[allowlists]]
description = "Exact public actions/upload-artifact v4.6.2 commit used only in pinned Lidl/Gate-B workflow, focused-test and config history"
condition = "AND"
regexTarget = "match"
regexes = [
  '''ea165f8d65b6e75b5404[4]9e92b4886f43607fa02'''
]
paths = [
  '''^(\.gitleaks\.toml|\.github/workflows/(hermes-gate-b-plan-bridge|hermes-lidl-source-refresh-audit|lidl-gate-b-plan-rpi5)\.yml|backend/tests/test_lidl_self_hosted_workflow_action_pins\.py)$'''
]
