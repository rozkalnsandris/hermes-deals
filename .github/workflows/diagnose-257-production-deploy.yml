name: Diagnose #257 production deploy status

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: "Inspect exact #257 deploy"
    if: >-
      github.event.pull_request.head.ref == 'diag/257-production-deploy-status' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "Find CI and deploy bound to #257 merge SHA"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 5d40539c21ecba14d280b0917464061ab448f106
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-257-deploy-diagnostic",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None

          no_redirect = urllib.request.build_opener(NoRedirect)

          def get_job_log(job_id: int) -> str | None:
              api_url = f"https://api.github.com/repos/{repo}/actions/jobs/{job_id}/logs"
              request = urllib.request.Request(api_url, headers=headers)
              try:
                  with no_redirect.open(request, timeout=20) as response:
                      data = response.read()
              except urllib.error.HTTPError as exc:
                  if exc.code in {404, 409}:
                      return None
                  if exc.code not in {301, 302, 303, 307, 308}:
                      raise
                  location = exc.headers.get("Location")
                  if not location:
                      raise SystemExit("GitHub job-log redirect had no Location header")
                  signed_request = urllib.request.Request(
                      location,
                      headers={"User-Agent": "hermes-deals-257-deploy-diagnostic"},
                  )
                  with urllib.request.urlopen(signed_request, timeout=20) as response:
                      data = response.read()
              return data.decode("utf-8", errors="replace")

          encoded = urllib.parse.quote(target, safe="")
          ci_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs"
              f"?branch=main&head_sha={encoded}&event=push&per_page=100"
          )
          ci_runs = get_json(ci_url).get("workflow_runs", [])
          exact_ci = [
              row for row in ci_runs
              if row.get("head_sha") == target
              and row.get("head_branch") == "main"
              and row.get("event") == "push"
          ]
          if not exact_ci:
              raise SystemExit("no main push CI run found for #257 merge SHA")
          ci = max(exact_ci, key=lambda row: int(row["id"]))
          print(
              "TARGET_CI "
              f"run_id={ci['id']} status={ci.get('status')} "
              f"conclusion={ci.get('conclusion')}"
          )
          if ci.get("status") != "completed" or ci.get("conclusion") != "success":
              raise SystemExit("#257 main push CI is not successful")

          deploy_url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "deploy-main.yml/runs?event=workflow_run&per_page=100"
          )

          matched = None
          deadline = time.monotonic() + 210
          while time.monotonic() < deadline:
              deploy_runs = get_json(deploy_url).get("workflow_runs", [])
              for run in deploy_runs:
                  run_id = int(run["id"])
                  jobs = get_json(
                      f"https://api.github.com/repos/{repo}/actions/runs/"
                      f"{run_id}/jobs?filter=latest&per_page=100"
                  ).get("jobs", [])
                  deploy_jobs = [job for job in jobs if job.get("name") == "Deploy on RPi5"]
                  for job in deploy_jobs:
                      text = get_job_log(int(job["id"]))
                      if text is not None and target in text:
                          matched = (run, job)
                          break
                  if matched is not None:
                      break
              if matched is not None:
                  break
              time.sleep(5)

          if matched is None:
              raise SystemExit("deploy run bound to #257 TARGET_SHA was not found")

          run, job = matched
          run_id = int(run["id"])
          print(
              "TARGET_DEPLOY "
              f"run_id={run_id} status={run.get('status')} "
              f"conclusion={run.get('conclusion')} "
              f"job_id={job['id']} job_status={job.get('status')} "
              f"job_conclusion={job.get('conclusion')}"
          )

          while run.get("status") != "completed" and time.monotonic() < deadline:
              time.sleep(5)
              run = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              )
              print(
                  "TARGET_DEPLOY_WAIT "
                  f"status={run.get('status')} conclusion={run.get('conclusion')}"
              )

          if run.get("status") != "completed":
              raise SystemExit("#257 deploy did not complete within diagnostic window")
          if run.get("conclusion") != "success":
              raise SystemExit(
                  f"#257 deploy conclusion is {run.get('conclusion')}"
              )

          jobs = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/"
              f"{run_id}/jobs?filter=latest&per_page=100"
          ).get("jobs", [])
          summary = [
              {
                  "name": job.get("name"),
                  "status": job.get("status"),
                  "conclusion": job.get("conclusion"),
              }
              for job in jobs
          ]
          print("TARGET_DEPLOY_JOBS=" + json.dumps(summary, sort_keys=True))
          if any(row["conclusion"] != "success" for row in summary):
              raise SystemExit("not every #257 deploy job concluded successfully")

          artifacts = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          ).get("artifacts", [])
          print(
              "TARGET_DEPLOY_ARTIFACTS="
              + json.dumps(
                  [
                      {
                          "id": artifact.get("id"),
                          "name": artifact.get("name"),
                          "expired": artifact.get("expired"),
                      }
                      for artifact in artifacts
                  ],
                  sort_keys=True,
              )
          )
          print("RESULT=PASS")
          PY
