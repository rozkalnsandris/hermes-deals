name: Lidl Gate B read-only plan on RPi5

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR that registered the exact Gate B plan runtime
        required: true
        type: string
      gate_a_run_id:
        description: Retained Gate A workflow run ID
        required: true
        type: string
      gate_a_run_attempt:
        description: Retained Gate A workflow run attempt
        required: true
        default: "1"
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: hermes-deals-lidl-gate-b-plan
  cancel-in-progress: false

jobs:
  authorize:
    name: Resolve owner-authorized exact runtime
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      sha: ${{ steps.authorize.outputs.sha }}
      gate_a_run_id: ${{ steps.authorize.outputs.gate_a_run_id }}
      gate_a_run_attempt: ${{ steps.authorize.outputs.gate_a_run_attempt }}
      gate_a_run_key: ${{ steps.authorize.outputs.gate_a_run_key }}

    steps:
      - name: Authorize merged PR and exact Gate B blobs
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
          EXPECTED_PLAN_BLOB: "543cae6923eb461038109cdc6ee98e9b64782d83"
          EXPECTED_APPLY_BLOB: "b8e38b52be69aa6f0cdaa5dbb3f76ccb013c772f"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit(f"unexpected repository: {repo}")
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          sender = event.get("sender") or {}
          if sender.get("login") != os.environ["EXPECTED_OWNER_LOGIN"]:
              raise SystemExit("workflow actor login is not the allowlisted owner")
          if sender.get("id") != int(os.environ["EXPECTED_OWNER_ID"]):
              raise SystemExit("workflow actor numeric ID is not the allowlisted owner")

          inputs = event.get("inputs") or {}
          raw_pr = str(inputs.get("pr_number") or "").strip()
          run_id = str(inputs.get("gate_a_run_id") or "").strip()
          attempt = str(inputs.get("gate_a_run_attempt") or "").strip()
          if not raw_pr.isdigit() or int(raw_pr) <= 0:
              raise SystemExit("pr_number must be a positive integer")
          if not run_id.isdigit() or int(run_id) <= 0:
              raise SystemExit("gate_a_run_id must be a positive integer")
          if not attempt.isdigit() or int(attempt) <= 0:
              raise SystemExit("gate_a_run_attempt must be a positive integer")
          pr_number = int(raw_pr)

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-lidl-gate-b-plan-authorizer",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          pr = get_json(f"https://api.github.com/repos/{repo}/pulls/{pr_number}")
          if not pr.get("merged") or not pr.get("merged_at"):
              raise SystemExit("Gate B plan accepts only merged pull requests")
          base = pr.get("base") or {}
          base_repo = base.get("repo") or {}
          if base.get("ref") != "main" or base_repo.get("full_name") != repo:
              raise SystemExit("pull request was not merged into repository main")
          sha = str(pr.get("merge_commit_sha") or "")
          if len(sha) != 40 or any(char not in "0123456789abcdef" for char in sha):
              raise SystemExit("merged pull request SHA is invalid")
          comparison = get_json(f"https://api.github.com/repos/{repo}/compare/{sha}...main")
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("merged SHA is not reachable from current main")

          paths = {
              "tools/lidl_gate_b_freeze_plan.py": os.environ["EXPECTED_PLAN_BLOB"],
              "tools/lidl_gate_b_freeze_apply.py": os.environ["EXPECTED_APPLY_BLOB"],
          }
          for path, expected_blob in paths.items():
              encoded = urllib.parse.quote(path, safe="/")
              at_sha = get_json(f"https://api.github.com/repos/{repo}/contents/{encoded}?ref={sha}")
              at_main = get_json(f"https://api.github.com/repos/{repo}/contents/{encoded}?ref=main")
              if at_sha.get("sha") != expected_blob:
                  raise SystemExit(f"registered Gate B blob mismatch: {path}")
              if at_main.get("sha") != expected_blob:
                  raise SystemExit(f"current main Gate B blob drift: {path}")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"pr_number={pr_number}\n")
              handle.write(f"sha={sha}\n")
              handle.write(f"gate_a_run_id={run_id}\n")
              handle.write(f"gate_a_run_attempt={attempt}\n")
              handle.write(f"gate_a_run_key=lidl-gate-a-{run_id}-{attempt}\n")
          PY

  rpi5-plan:
    name: Run registered read-only Gate B plan on RPi5
    needs: authorize
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 30
    outputs:
      result: ${{ steps.inspect.outputs.result }}
      reason: ${{ steps.inspect.outputs.reason }}
      plan_fingerprint: ${{ steps.inspect.outputs.plan_fingerprint }}
      destination_name: ${{ steps.inspect.outputs.destination_name }}
      runner_rc: ${{ steps.dispatch.outputs.runner_rc }}

    steps:
      - name: Create private artifact directory
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/hermes-deals-lidl-gate-b-plan-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Run fixed root-owned dispatcher
        id: dispatch
        env:
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
          GATE_A_RUN_ID: ${{ needs.authorize.outputs.gate_a_run_id }}
          GATE_A_RUN_ATTEMPT: ${{ needs.authorize.outputs.gate_a_run_attempt }}
          ARTIFACT_DIR: ${{ steps.prepare.outputs.artifact_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-lidl-gate-b-plan-dispatch \
            "$REGISTERED_SHA" "$GATE_A_RUN_ID" "$GATE_A_RUN_ATTEMPT" "$ARTIFACT_DIR"
          runner_rc=$?
          set -e
          echo "runner_rc=$runner_rc" >> "$GITHUB_OUTPUT"
          if [[ "$runner_rc" -ne 0 && "$runner_rc" -ne 30 ]]; then
            echo "unexpected dispatcher exit code: $runner_rc" >&2
          fi

      - name: Inspect sanitized Gate B plan evidence
        id: inspect
        env:
          ARTIFACT_DIR: ${{ steps.prepare.outputs.artifact_dir }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_RUN_KEY: ${{ needs.authorize.outputs.gate_a_run_key }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["ARTIFACT_DIR"]) / "audit-evidence"
          manifest = json.loads((root / "dispatcher-evidence-manifest.json").read_text(encoding="utf-8"))
          summary = json.loads((root / "gate-b-plan-summary.json").read_text(encoding="utf-8"))
          for key, expected in {
              "audit": "lidl-gate-b-plan",
              "commit_sha": os.environ["EXPECTED_SHA"],
              "gate_a_run_key": os.environ["EXPECTED_RUN_KEY"],
              "sanitization_passed": True,
              "corpus_write_authorized": False,
              "parser_scan_authorized": False,
              "database_write_authorized": False,
              "review_write_authorized": False,
              "production_publish_authorized": False,
              "production_deploy_authorized": False,
              "systemd_change_authorized": False,
              "automatic_retry_authorized": False,
              "gate_c_d_authorized": False,
          }.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f"dispatcher manifest mismatch: {key}")
          state = str(summary.get("result") or "")
          if state not in {"READY_TO_FREEZE", "BLOCKED"}:
              raise SystemExit("unsupported Gate B plan result")
          runner_rc = int(os.environ["RUNNER_RC"])
          if state == "BLOCKED" and runner_rc != 30:
              raise SystemExit("BLOCKED result/exit mismatch")
          if state == "READY_TO_FREEZE" and runner_rc != 0:
              raise SystemExit("READY_TO_FREEZE result/exit mismatch")
          fingerprint = str(summary.get("plan_fingerprint") or "")
          if state == "READY_TO_FREEZE" and not re.fullmatch(r"[0-9a-f]{64}", fingerprint):
              raise SystemExit("plan fingerprint is invalid")
          if state == "BLOCKED" and fingerprint:
              raise SystemExit("BLOCKED result must not expose a fingerprint")
          destination = str(summary.get("destination_name") or "")
          if state == "READY_TO_FREEZE" and not destination:
              raise SystemExit("destination name is missing")
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"result={state}\n")
              handle.write(f"reason={str(summary.get('reason') or '').replace(chr(10), ' ')[:160]}\n")
              handle.write(f"plan_fingerprint={fingerprint}\n")
              handle.write(f"destination_name={destination}\n")
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidl-gate-b-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifact_dir }}/audit-evidence
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Enforce fail-closed plan result
        if: always()
        env:
          RESULT: ${{ steps.inspect.outputs.result }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RESULT" == "READY_TO_FREEZE" ]] || {
            echo "Gate B plan did not reach READY_TO_FREEZE." >&2
            exit 1
          }
          [[ "$RUNNER_RC" == "0" ]] || {
            echo "Gate B dispatcher failed with exit $RUNNER_RC." >&2
            exit 1
          }

  report:
    name: Report sanitized Gate B plan result
    if: always() && needs.authorize.result == 'success'
    needs:
      - authorize
      - rpi5-plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Comment result on merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
          GATE_A_RUN_KEY: ${{ needs.authorize.outputs.gate_a_run_key }}
          RESULT: ${{ needs.rpi5-plan.outputs.result }}
          REASON: ${{ needs.rpi5-plan.outputs.reason }}
          PLAN_FINGERPRINT: ${{ needs.rpi5-plan.outputs.plan_fingerprint }}
          DESTINATION_NAME: ${{ needs.rpi5-plan.outputs.destination_name }}
          RUNNER_RC: ${{ needs.rpi5-plan.outputs.runner_rc }}
          PLAN_JOB_RESULT: ${{ needs.rpi5-plan.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## Lidl Gate B read-only RPi5 plan result\n\n"
              f"- workflow job: `{os.environ['PLAN_JOB_RESULT']}`\n"
              f"- result: `{os.environ.get('RESULT') or 'UNAVAILABLE'}`\n"
              f"- reason: `{os.environ.get('REASON') or 'inspection did not complete'}`\n"
              f"- registered commit: `{os.environ['REGISTERED_SHA']}`\n"
              f"- retained Gate A run: `{os.environ['GATE_A_RUN_KEY']}`\n"
              f"- plan fingerprint: `{os.environ.get('PLAN_FINGERPRINT') or 'none'}`\n"
              f"- destination name: `{os.environ.get('DESTINATION_NAME') or 'none'}`\n"
              f"- dispatcher exit code: `{os.environ.get('RUNNER_RC') or 'unknown'}`\n"
              f"- workflow: {os.environ['RUN_URL']}\n\n"
              "Safety: read-only planning only. No corpus write, authorization file, parser scan, "
              "DB/Review write, publication, deploy, systemd change, retry or Gate C/D action was authorized."
          )
          payload = json.dumps({"body": body}).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments",
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "hermes-deals-lidl-gate-b-plan-reporter",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected comment status: {response.status}")
          PY
