name: Diagnostic production deploy history

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect deploy-main history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query recent deploy runs and artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit("unexpected repository")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-deploy-history-diagnostic",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          runs = get_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/deploy-main.yml/runs?per_page=20"
          ).get("workflow_runs", [])

          report = []
          for run in runs:
              run_id = int(run["id"])
              artifacts = get_json(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              ).get("artifacts", [])
              report.append(
                  {
                      "run_id": run_id,
                      "event": run.get("event"),
                      "status": run.get("status"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                      "created_at": run.get("created_at"),
                      "updated_at": run.get("updated_at"),
                      "artifacts": [
                          {
                              "id": int(artifact["id"]),
                              "name": artifact.get("name"),
                              "expired": bool(artifact.get("expired")),
                          }
                          for artifact in artifacts
                      ],
                  }
              )

          print("DEPLOY_HISTORY_JSON_BEGIN")
          print(json.dumps(report, indent=2, sort_keys=True))
          print("DEPLOY_HISTORY_JSON_END")
          PY
