name: Kaufland K0-K1 GitHub live source probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/kaufland-k0k1-github-live-probe.yml
      - backend/app/kaufland_source_discovery.py
      - tools/kaufland_source_discovery.py
      - backend/locks/ci-py311.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-deals-kaufland-k0k1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-source-probe:
    name: Read-only Kaufland store 1503 source probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/locks/ci-py311.txt

      - name: Install hash-locked dependencies
        working-directory: backend
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r locks/ci-py311.txt
          python -m pip check

      - name: Run sanitized read-only source discovery
        shell: bash
        run: |
          set -Eeuo pipefail
          output="${RUNNER_TEMP}/kaufland-k0k1-source-discovery.json"

          set +e
          python tools/kaufland_source_discovery.py >"$output"
          rc=$?
          set -e

          cat "$output"

          python3 - "$output" "$rc" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          rc = int(sys.argv[2])
          payload = json.loads(path.read_text(encoding="utf-8"))

          safety_flags = (
              "production_database_write",
              "review_write",
              "production_publish",
              "production_deploy",
              "corpus_write",
              "scheduler_change",
              "systemd_change",
          )
          for key in safety_flags:
              if payload.get(key) is not False:
                  raise SystemExit(f"unsafe or missing safety flag: {key}={payload.get(key)!r}")

          proven = payload.get("store_binding_proven")
          state = payload.get("source_state")
          code = payload.get("error_code")
          print(f"KAUFLAND_K0K1_STORE_BINDING_PROVEN={proven}")
          print(f"KAUFLAND_K0K1_SOURCE_STATE={state}")
          if code is not None:
              print(f"KAUFLAND_K0K1_ERROR_CODE={code}")

          if rc == 0:
              if proven is not True:
                  raise SystemExit("probe returned rc=0 without store_binding_proven=true")
              if state != "available":
                  raise SystemExit(f"probe returned rc=0 with unexpected source_state={state!r}")
          elif rc not in {20, 21}:
              raise SystemExit(f"unexpected probe exit code: {rc}")
          PY

          printf 'KAUFLAND_K0K1_RC=%s\n' "$rc"
          exit "$rc"
