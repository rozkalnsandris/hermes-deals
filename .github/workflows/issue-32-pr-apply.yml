name: Apply issue 32 fix from draft PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-32-ui-regressions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract and run audited patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/issue-32-apply.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n"
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-issue-32.sh').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          bash /tmp/apply-issue-32.sh

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused regression suite
        working-directory: backend
        run: |
          python -m unittest \
            tests.test_ui_issue_32_contract \
            tests.test_ui_latvian_dates_and_review_open \
            tests.test_ui_weekly_overview \
            tests.test_ui_static_assets
          python -m compileall -q app tests
          python -m pip check

      - name: Commit isolated implementation
        shell: bash
        run: |
          git diff --check
          rm -- \
            .github/workflows/issue-32-apply.yml \
            .github/workflows/issue-32-pr-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/app/ui/app.js \
            backend/app/ui/styles.css \
            backend/app/ui/review.html \
            backend/tests/test_ui_issue_32_contract.py \
            backend/tests/test_ui_static_assets.py \
            backend/tests/ui_contract.py \
            docs/UI_ISSUE_32_AUDIT.md \
            .github/workflows/issue-32-apply.yml \
            .github/workflows/issue-32-pr-apply.yml
          git diff --cached --check
          git commit -m "fix: harden UI dates calendars and mobile layouts"
          git push origin HEAD:${{ github.head_ref }}
