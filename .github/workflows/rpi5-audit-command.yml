name: RPi5 approved audit command

on:
  workflow_dispatch:
    inputs:
      audit:
        description: Approved audit name
        required: true
        type: choice
        options:
          - runner-smoke
          - b15m2-v08
      pr_number:
        description: Merged pull request number
        required: true
        type: string
  repository_dispatch:
    types:
      - rpi5-audit
  schedule:
    - cron: "2-57/5 * * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/rpi5-audit-command.yml

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: hermes-deals-rpi5-audit
  cancel-in-progress: false

jobs:
  ensure-labels:
    name: Ensure approved audit labels
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Create or reconcile audit labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          labels = (
              {
                  "name": "audit:runner-smoke",
                  "color": "1d76db",
                  "description": "Run the approved RPi5 runner smoke audit on this merged PR",
              },
              {
                  "name": "audit:b15m2-v08",
                  "color": "5319e7",
                  "description": "Run the registered B15M2 V08 audit on this merged PR",
              },
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "hermes-deals-rpi5-audit-label-bootstrap",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url: str, method: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read()
                  return response.status, json.loads(body) if body else None

          results = []
          for label in labels:
              encoded = urllib.parse.quote(label["name"], safe="")
              label_url = f"https://api.github.com/repos/{repo}/labels/{encoded}"
              try:
                  status, _ = request_json(label_url, "PATCH", label)
                  action = "reconciled"
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  status, _ = request_json(
                      f"https://api.github.com/repos/{repo}/labels",
                      "POST",
                      label,
                  )
                  action = "created"
              results.append((label["name"], action, status))

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("## RPi5 audit labels\n\n")
              for name, action, status in results:
                  handle.write(f"- `{name}`: {action} (HTTP {status})\n")
          PY

  authorize:
    name: Resolve and authorize audit request
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.authorize.outputs.should_run }}
      audit: ${{ steps.authorize.outputs.audit }}
      sha: ${{ steps.authorize.outputs.sha }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      trigger_kind: ${{ steps.authorize.outputs.trigger_kind }}
      trigger_label: ${{ steps.authorize.outputs.trigger_label }}
      trigger_actor: ${{ steps.authorize.outputs.trigger_actor }}

    steps:
      - name: Resolve trigger and validate merged PR
        id: authorize
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
          EXPECTED_DISPATCH_LOGIN: ${{ vars.HERMES_AUDIT_DISPATCH_LOGIN || 'rozkalnsandris' }}
          EXPECTED_DISPATCH_ID: ${{ vars.HERMES_AUDIT_DISPATCH_ID || '277435981' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.parse
          import urllib.request

          expected_repo = "rozkalnsandris/hermes-deals"
          owner_login = os.environ["EXPECTED_OWNER_LOGIN"]
          owner_id = int(os.environ["EXPECTED_OWNER_ID"])
          dispatch_login = os.environ["EXPECTED_DISPATCH_LOGIN"]
          dispatch_id = int(os.environ["EXPECTED_DISPATCH_ID"])
          approved_audits = {"runner-smoke", "b15m2-v08"}
          approved_labels = {
              "audit:runner-smoke": "runner-smoke",
              "audit:b15m2-v08": "b15m2-v08",
          }

          event_name = os.environ["EVENT_NAME"]
          workflow_ref = os.environ["WORKFLOW_REF"]
          if workflow_ref != "refs/heads/main":
              raise SystemExit(f"audit workflow must run from main, not {workflow_ref}")
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          repo = event["repository"]["full_name"]
          if repo != expected_repo:
              raise SystemExit(f"unexpected repository: {repo}")

          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-rpi5-audit-authorizer",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          def get_all(url: str):
              items = []
              next_url = url
              pages = 0
              while next_url:
                  pages += 1
                  if pages > 20:
                      raise SystemExit("GitHub pagination exceeded safety limit")
                  request = urllib.request.Request(next_url, headers=headers)
                  with urllib.request.urlopen(request, timeout=20) as response:
                      page = json.load(response)
                      if not isinstance(page, list):
                          raise SystemExit("expected a paginated GitHub list")
                      items.extend(page)
                      next_url = None
                      for part in response.headers.get("Link", "").split(","):
                          if 'rel="next"' in part:
                              next_url = part[part.index("<") + 1 : part.index(">")]
                              break
              return items

          def require_actor(sender, expected_login: str, expected_id: int, context: str):
              if sender.get("login") != expected_login:
                  raise SystemExit(f"{context} actor login is not allowlisted")
              if sender.get("id") != expected_id:
                  raise SystemExit(f"{context} actor numeric identity is not allowlisted")
              return sender["login"]

          def latest_label_actor(pr_number: int, label_name: str):
              events = get_all(
                  f"https://api.github.com/repos/{repo}/issues/{pr_number}/events"
                  "?per_page=100"
              )
              latest = None
              for item in events:
                  if item.get("event") not in {"labeled", "unlabeled"}:
                      continue
                  if (item.get("label") or {}).get("name") != label_name:
                      continue
                  latest = item
              if not latest or latest.get("event") != "labeled":
                  return None
              return latest.get("actor") or {}

          audit = ""
          pr_number = 0
          trigger_kind = event_name
          trigger_label = ""
          trigger_actor = ""
          if event_name == "workflow_dispatch":
              trigger_actor = require_actor(
                  event.get("sender") or {},
                  owner_login,
                  owner_id,
                  "workflow_dispatch",
              )
              audit = str((event.get("inputs") or {}).get("audit", "")).strip()
              raw_pr = str((event.get("inputs") or {}).get("pr_number", "")).strip()
              if not raw_pr.isdigit():
                  raise SystemExit("workflow_dispatch pr_number must be numeric")
              pr_number = int(raw_pr)

          elif event_name == "repository_dispatch":
              if event.get("action") != "rpi5-audit":
                  raise SystemExit("unexpected repository_dispatch event type")
              trigger_actor = require_actor(
                  event.get("sender") or {},
                  dispatch_login,
                  dispatch_id,
                  "repository_dispatch",
              )
              payload = event.get("client_payload") or {}
              audit = str(payload.get("audit", "")).strip()
              raw_pr = str(payload.get("pr_number", "")).strip()
              if not raw_pr.isdigit():
                  raise SystemExit("repository_dispatch pr_number must be numeric")
              pr_number = int(raw_pr)

          elif event_name == "schedule":
              trigger_kind = "schedule-poll"
              candidates = {}
              for label_name, label_audit in approved_labels.items():
                  encoded = urllib.parse.quote(label_name, safe="")
                  issues = get_all(
                      f"https://api.github.com/repos/{repo}/issues"
                      f"?state=all&labels={encoded}&sort=updated&direction=asc&per_page=100"
                  )
                  for issue in issues:
                      if "pull_request" not in issue:
                          continue
                      number = int(issue["number"])
                      current_approved = {
                          item.get("name")
                          for item in issue.get("labels", [])
                          if item.get("name") in approved_labels
                      }
                      if current_approved != {label_name}:
                          continue
                      actor = latest_label_actor(number, label_name)
                      if not actor:
                          continue
                      if actor.get("login") != owner_login or actor.get("id") != owner_id:
                          continue
                      candidates[number] = {
                          "audit": label_audit,
                          "label": label_name,
                          "actor": actor["login"],
                          "updated_at": issue.get("updated_at", ""),
                      }

              if not candidates:
                  output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
                  with output.open("a", encoding="utf-8") as handle:
                      handle.write("should_run=false\n")
                      handle.write("trigger_kind=schedule-poll\n")
                  summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
                  summary.write_text(
                      "## RPi5 audit poll\n\n"
                      "- No owner-applied approved audit label is pending.\n"
                      "- Production deployment: **not authorized**\n",
                      encoding="utf-8",
                  )
                  raise SystemExit(0)

              pr_number, selected = sorted(
                  candidates.items(),
                  key=lambda item: (item[1]["updated_at"], item[0]),
              )[0]
              audit = selected["audit"]
              trigger_label = selected["label"]
              trigger_actor = selected["actor"]

          else:
              raise SystemExit(f"unsupported event: {event_name}")

          if audit not in approved_audits:
              raise SystemExit("audit is not allowlisted")
          if pr_number <= 0:
              raise SystemExit("pull request number must be positive")

          pr = get_json(f"https://api.github.com/repos/{repo}/pulls/{pr_number}")
          if not pr.get("merged_at") or not pr.get("merged"):
              raise SystemExit("audits are accepted only for merged pull requests")
          if pr["base"]["ref"] != "main" or pr["base"]["repo"]["full_name"] != repo:
              raise SystemExit("pull request was not merged into this repository's main branch")

          requested_sha = pr.get("merge_commit_sha", "")
          if len(requested_sha) != 40:
              raise SystemExit("merged pull request does not expose a valid merge commit SHA")

          comparison = get_json(
              f"https://api.github.com/repos/{repo}/compare/{requested_sha}...main"
          )
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("merged commit is not reachable from current main")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("should_run=true\n")
              handle.write(f"audit={audit}\n")
              handle.write(f"sha={requested_sha}\n")
              handle.write(f"pr_number={pr_number}\n")
              handle.write(f"trigger_kind={trigger_kind}\n")
              handle.write(f"trigger_label={trigger_label}\n")
              handle.write(f"trigger_actor={trigger_actor}\n")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary.write_text(
              "## Authorized RPi5 audit\n\n"
              f"- Trigger: `{trigger_kind}`\n"
              f"- Trigger actor: `{trigger_actor}`\n"
              f"- Trigger label: `{trigger_label or 'not-applicable'}`\n"
              f"- Audit: `{audit}`\n"
              f"- Registered commit request: `{requested_sha}`\n"
              f"- Merged PR: `#{pr_number}`\n"
              "- Production deployment: **not authorized**\n",
              encoding="utf-8",
          )
          PY

  rpi5-audit:
    name: Run approved audit on RPi5
    needs:
      - authorize
    if: >-
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.should_run == 'true'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 60

    steps:
      - name: Run root-owned allowlisted dispatcher
        id: dispatch
        env:
          APPROVED_AUDIT: ${{ needs.authorize.outputs.audit }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export_dir="${RUNNER_TEMP}/hermes-deals-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$export_dir"
          echo "artifact_dir=$export_dir" >> "$GITHUB_OUTPUT"

          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-audit-dispatch \
            "$APPROVED_AUDIT" \
            "$APPROVED_SHA" \
            "$export_dir" \
            2>&1 | tee "$export_dir/runner-dispatch.log"
          dispatch_rc=${PIPESTATUS[0]}
          set -e

          printf '%s\n' "$dispatch_rc" > "$export_dir/runner-dispatch-exit-code.txt"
          printf 'audit=%s\ncommit_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$APPROVED_AUDIT" "$APPROVED_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$export_dir/runner-request.txt"
          exit "$dispatch_rc"

      - name: Upload sanitized audit evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.authorize.outputs.audit }}-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14

      - name: Record runner result
        if: always()
        env:
          APPROVED_AUDIT: ${{ needs.authorize.outputs.audit }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          {
            echo "## RPi5 audit runner"
            echo
            echo "- Audit: \`$APPROVED_AUDIT\`"
            echo "- Registered commit: \`$APPROVED_SHA\`"
            echo "- Runner: \`$RUNNER_NAME\`"
            echo "- Production deployment: **not authorized**"
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Report audit pipeline result to PR
    needs:
      - authorize
      - rpi5-audit
    if: >-
      always() &&
      needs.authorize.result == 'success' &&
      needs.authorize.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Post result comment and clear polling label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          TRIGGER_KIND: ${{ needs.authorize.outputs.trigger_kind }}
          TRIGGER_LABEL: ${{ needs.authorize.outputs.trigger_label }}
          TRIGGER_ACTOR: ${{ needs.authorize.outputs.trigger_actor }}
          AUDIT: ${{ needs.authorize.outputs.audit }}
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          RPI5_RESULT: ${{ needs.rpi5-audit.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr_number = int(os.environ["PR_NUMBER"])
          trigger_kind = os.environ["TRIGGER_KIND"]
          trigger_label = os.environ.get("TRIGGER_LABEL", "").strip()
          trigger_actor = os.environ["TRIGGER_ACTOR"]
          audit = os.environ["AUDIT"]
          commit_sha = os.environ["REGISTERED_SHA"]
          authorize_result = os.environ["AUTHORIZE_RESULT"]
          rpi5_result = os.environ["RPI5_RESULT"]
          run_id = os.environ["RUN_ID"]
          run_attempt = os.environ["RUN_ATTEMPT"]
          server_url = os.environ["SERVER_URL"]
          actions_url = f"{server_url}/{repo}/actions/runs/{run_id}/attempts/{run_attempt}"
          artifact_name = f"{audit}-{commit_sha}-run-{run_id}"

          body = (
              f"<!-- hermes-deals-rpi5-audit-result:{run_id}:{run_attempt} -->\n"
              "## RPi5 audit pipeline result\n\n"
              f"- Trigger: `{trigger_kind}`\n"
              f"- Trigger actor: `{trigger_actor}`\n"
              f"- Trigger label: `{trigger_label or 'not-applicable'}`\n"
              f"- Authorization job: **{authorize_result}**\n"
              f"- RPi5 job: **{rpi5_result}**\n"
              f"- Audit: `{audit}`\n"
              f"- Registered commit: `{commit_sha}`\n"
              f"- Workflow run ID: `{run_id}`\n"
              f"- Run attempt: `{run_attempt}`\n"
              f"- Artifact: `{artifact_name}`\n"
              f"- Actions run: {actions_url}\n"
              "- Production deployment: **not authorized**\n"
          )

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "hermes-deals-rpi5-audit-reporter",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          payload = json.dumps({"body": body}).encode("utf-8")
          comment_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=payload,
              method="POST",
              headers=headers,
          )
          with urllib.request.urlopen(comment_request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected comment response: {response.status}")

          if trigger_label:
              encoded_label = urllib.parse.quote(trigger_label, safe="")
              remove_request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/issues/{pr_number}/labels/{encoded_label}",
                  method="DELETE",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(remove_request, timeout=20) as response:
                      if response.status != 200:
                          raise SystemExit(
                              f"unexpected label removal response: {response.status}"
                          )
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          PY
