name: Hermes Lidl R3 promotion status

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  status:
    if: >-
      github.event.issue.number == 361 &&
      !github.event.issue.pull_request &&
      github.actor == 'rozkalnsandris' &&
      github.event.comment.body == '/hermes-lidl-r3-status command=5227503666'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Report exact R3 promotion workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL_PREFIX: https://github.com/${{ github.repository }}/actions/runs/
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['REPOSITORY']
          if repo != 'rozkalnsandris/hermes-deals':
              raise SystemExit('unexpected repository')
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          sender = event.get('sender') or {}
          if sender.get('login') != 'rozkalnsandris' or sender.get('id') != 277435981:
              raise SystemExit('status command sender is not allowlisted owner')
          issue = event.get('issue') or {}
          if issue.get('number') != 361 or issue.get('pull_request') is not None:
              raise SystemExit('status command accepted only on issue #361')
          comment = event.get('comment') or {}
          if str(comment.get('body') or '').strip() != '/hermes-lidl-r3-status command=5227503666':
              raise SystemExit('unexpected status command')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'hermes-lidl-r3-status',
          }
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)
          def post(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode('utf-8'),
                  method='POST',
                  headers={**headers, 'Content-Type': 'application/json'},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 201:
                      raise SystemExit(f'unexpected comment status: {response.status}')

          command = get(f'https://api.github.com/repos/{repo}/issues/comments/5227503666')
          command_user = command.get('user') or {}
          exact_command = '/hermes-lidl-source-refresh-r3-promote pr=410 fingerprint=8aaf1f96a119e51c980a45da80031d5abd2db65d4cdc3516bd5368fd0537c7f9 auth=5227260615'
          if command_user.get('login') != 'rozkalnsandris' or command_user.get('id') != 277435981:
              raise SystemExit('promotion command owner mismatch')
          if str(command.get('body') or '').strip() != exact_command:
              raise SystemExit('promotion command body drift')
          command_created = str(command.get('created_at') or '')
          command_dt = datetime.fromisoformat(command_created.replace('Z', '+00:00'))

          params = urllib.parse.urlencode({'event': 'issue_comment', 'per_page': 50})
          runs_payload = get(
              f'https://api.github.com/repos/{repo}/actions/workflows/hermes-lidl-source-refresh-r3-promotion.yml/runs?{params}'
          )
          candidates = []
          for run in runs_payload.get('workflow_runs') or []:
              if run.get('event') != 'issue_comment':
                  continue
              created = datetime.fromisoformat(str(run.get('created_at')).replace('Z', '+00:00'))
              if created < command_dt:
                  continue
              if run.get('head_branch') != 'main':
                  continue
              candidates.append(run)
          if len(candidates) != 1:
              raise SystemExit(f'expected exactly one R3 promotion run after command, got {len(candidates)}')
          run = candidates[0]
          run_id = int(run['id'])
          jobs_payload = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')
          artifacts_payload = get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
          jobs = [
              {
                  'name': str(job.get('name') or ''),
                  'status': str(job.get('status') or ''),
                  'conclusion': job.get('conclusion'),
                  'id': int(job['id']),
              }
              for job in (jobs_payload.get('jobs') or [])
          ]
          artifacts = [
              {
                  'id': int(a['id']),
                  'name': str(a.get('name') or ''),
                  'digest': a.get('digest'),
                  'expired': bool(a.get('expired')),
              }
              for a in (artifacts_payload.get('artifacts') or [])
          ]
          lines = [
              '## Lidl R3 promotion workflow status',
              '',
              '- status probe: read-only; no rerun/retry/promotion command issued',
              '- promotion command comment: `5227503666`',
              f"- workflow run: `{run_id}`",
              f"- status / conclusion: `{run.get('status')}` / `{run.get('conclusion')}`",
              f"- run attempt: `{run.get('run_attempt')}`",
              f"- head SHA: `{run.get('head_sha')}`",
              f"- created / updated: `{run.get('created_at')}` / `{run.get('updated_at')}`",
              f"- workflow: {os.environ['RUN_URL_PREFIX']}{run_id}",
              '',
              'Jobs:',
          ]
          if jobs:
              lines.extend(
                  f"- `{job['name']}` — `{job['status']}` / `{job['conclusion']}` (job `{job['id']}`)"
                  for job in jobs
              )
          else:
              lines.append('- none returned')
          lines.append('')
          lines.append('Artifacts:')
          if artifacts:
              lines.extend(
                  f"- `{a['name']}` — id `{a['id']}`, digest `{a['digest']}`, expired `{str(a['expired']).lower()}`"
                  for a in artifacts
              )
          else:
              lines.append('- none')
          lines.extend([
              '',
              'Safety: this status bridge has `actions: read` only for Actions data and cannot rerun jobs. It performs no RPi5, corpus, parser, DB, Review, publication, deploy, systemd, retry, Gate C/D or B15M2 V08 action.',
          ])
          post(f'https://api.github.com/repos/{repo}/issues/361/comments', {'body': '\n'.join(lines)})
          PY
