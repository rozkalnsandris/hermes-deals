name: Owner-gated ALDI registration refresh

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA approved for ALDI producer and visual-card-v2 registration refresh
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-aldi-registration-refresh
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact current main registration target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}

    steps:
      - name: Validate owner, exact current main and CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
          REQUESTED_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit("unexpected repository")
          if os.environ["WORKFLOW_REF"] != "refs/heads/main":
              raise SystemExit("workflow must execute from main")

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          sender = event.get("sender") or {}
          if (
              sender.get("login") != os.environ["EXPECTED_OWNER_LOGIN"]
              or sender.get("id") != int(os.environ["EXPECTED_OWNER_ID"])
          ):
              raise SystemExit("workflow_dispatch actor is not allowlisted owner")

          requested_sha = os.environ["REQUESTED_SHA"].strip()
          if re.fullmatch(r"[0-9a-f]{40}", requested_sha) is None:
              raise SystemExit("expected_main_sha must be one exact 40-character lowercase SHA")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "hermes-deals-aldi-registration-refresh-authorizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          main = get(f"https://api.github.com/repos/{repo}/branches/main")
          current_main = str((main.get("commit") or {}).get("sha") or "")
          if current_main != requested_sha:
              raise SystemExit("requested SHA is not exact current main")

          query = urllib.parse.urlencode(
              {"head_sha": requested_sha, "event": "push", "status": "completed", "per_page": 20}
          )
          runs = get(
              f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{query}"
          ).get("workflow_runs") or []
          matches = [
              run for run in runs
              if run.get("head_sha") == requested_sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
              and run.get("name") == "Hermes Deals CI checks"
          ]
          if not matches:
              raise SystemExit("exact current main has no successful push CI run")
          ci_run_id = max(int(run["id"]) for run in matches)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"sha={requested_sha}\n")
              handle.write(f"ci_run_id={ci_run_id}\n")
          PY

  refresh-rpi5:
    name: Refresh fixed ALDI root registrations
    needs: authorize
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 15
    permissions: {}
    outputs:
      bridge_status: ${{ steps.inspect.outputs.bridge_status }}
      reason_code: ${{ steps.inspect.outputs.reason_code }}
      producer_registered_main_sha: ${{ steps.inspect.outputs.producer_registered_main_sha }}
      visual_registered_main_sha: ${{ steps.inspect.outputs.visual_registered_main_sha }}
      runner_rc: ${{ steps.dispatch.outputs.runner_rc }}

    steps:
      - name: Run fixed root-owned ALDI registration dispatcher
        id: dispatch
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/aldi-registration-refresh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "$artifact_dir" ]]
          install -d -m 0700 "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-aldi-registration-refresh-dispatch \
            "$APPROVED_SHA" \
            "$artifact_dir"
          runner_rc=$?
          set -e
          echo "runner_rc=$runner_rc" >> "$GITHUB_OUTPUT"

      - name: Inspect sanitized registration receipt
        id: inspect
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.dispatch.outputs.artifact_dir }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: python
        run: |
          import json
          import os
          import pathlib
          import re

          artifact_dir = pathlib.Path(os.environ.get("ARTIFACT_DIR") or ".")
          summary_path = artifact_dir / "aldi-registration-refresh-summary.json"
          runner_rc_raw = os.environ.get("RUNNER_RC") or "1"
          runner_rc = int(runner_rc_raw) if re.fullmatch(r"-?[0-9]+", runner_rc_raw) else 1
          bridge_status = "BLOCKED"
          reason_code = "SANITIZED_SUMMARY_MISSING"
          producer_sha = "unavailable"
          visual_sha = "unavailable"

          if summary_path.is_file() and not summary_path.is_symlink():
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              expected_fields = {
                  "bridge_schema_version", "bridge_contract_version", "bridge_execution_status",
                  "reason_code", "registered_bridge_sha", "target_sha",
                  "producer_installer_attempted", "producer_installer_rc",
                  "visual_installer_attempted", "visual_installer_rc",
                  "root_registration_mutation_started",
                  "producer_registered_main_sha_before", "visual_registered_main_sha_before",
                  "producer_registered_main_sha_after", "visual_registered_main_sha_after",
                  "runner_service_active", "runner_has_docker_group",
                  "network_source_read_performed", "weekly_shadow_prepare_performed",
                  "visual_diagnostic_performed", "request_created", "request_accepted",
                  "production_database_write_performed", "review_write_performed",
                  "publication_write_performed", "scheduler_change_performed",
                  "systemd_change_performed", "container_mutation_performed",
                  "canary_performed", "production_deploy_performed",
                  "rollback_performed", "cleanup_performed",
              }
              if set(payload) != expected_fields:
                  raise SystemExit("registration summary field set mismatch")
              if payload["bridge_schema_version"] != 1:
                  raise SystemExit("registration summary schema mismatch")
              if payload["bridge_contract_version"] != "hermes-deals-aldi-registration-refresh-v1":
                  raise SystemExit("registration summary contract mismatch")
              if payload["target_sha"] != os.environ["EXPECTED_SHA"]:
                  raise SystemExit("registration target mismatch")
              if not re.fullmatch(r"[0-9a-f]{40}", payload["registered_bridge_sha"]):
                  raise SystemExit("registered bridge SHA invalid")

              false_fields = {
                  "network_source_read_performed", "weekly_shadow_prepare_performed",
                  "visual_diagnostic_performed", "request_created", "request_accepted",
                  "production_database_write_performed", "review_write_performed",
                  "publication_write_performed", "scheduler_change_performed",
                  "systemd_change_performed", "container_mutation_performed",
                  "canary_performed", "production_deploy_performed",
                  "rollback_performed", "cleanup_performed",
              }
              if any(payload[field] is not False for field in false_fields):
                  raise SystemExit("registration receipt contains forbidden mutation")

              bridge_status = str(payload["bridge_execution_status"])
              reason = payload["reason_code"]
              reason_code = "none" if reason is None else str(reason)
              producer_sha = str(payload["producer_registered_main_sha_after"] or "unavailable")
              visual_sha = str(payload["visual_registered_main_sha_after"] or "unavailable")
              if bridge_status not in {"PASS", "BLOCKED"}:
                  raise SystemExit("unsupported registration bridge status")
              if not re.fullmatch(r"(?:none|[A-Z0-9_]{1,96})", reason_code):
                  raise SystemExit("unbounded registration reason code")

              if runner_rc == 0:
                  if bridge_status != "PASS" or reason is not None:
                      raise SystemExit("dispatcher success/status mismatch")
                  if payload["root_registration_mutation_started"] is not True:
                      raise SystemExit("successful refresh did not attest registration mutation")
                  if payload["producer_installer_attempted"] is not True or payload["producer_installer_rc"] != 0:
                      raise SystemExit("producer installer success attestation missing")
                  if payload["visual_installer_attempted"] is not True or payload["visual_installer_rc"] != 0:
                      raise SystemExit("visual installer success attestation missing")
                  if producer_sha != os.environ["EXPECTED_SHA"] or visual_sha != os.environ["EXPECTED_SHA"]:
                      raise SystemExit("successful refresh did not bind both registrations to target")
                  if payload["runner_service_active"] is not True:
                      raise SystemExit("runner service not active after refresh")
                  if payload["runner_has_docker_group"] is not False:
                      raise SystemExit("runner Docker-group boundary violated")
              elif bridge_status != "BLOCKED":
                  raise SystemExit("dispatcher failure/status mismatch")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"bridge_status={bridge_status}\n")
              out.write(f"reason_code={reason_code}\n")
              out.write(f"producer_registered_main_sha={producer_sha}\n")
              out.write(f"visual_registered_main_sha={visual_sha}\n")

      - name: Upload sanitized registration evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aldi-registration-refresh-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}/aldi-registration-refresh-summary.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Record registration safety boundary
        if: always()
        env:
          BRIDGE_STATUS: ${{ steps.inspect.outputs.bridge_status }}
          REASON_CODE: ${{ steps.inspect.outputs.reason_code }}
          PRODUCER_SHA: ${{ steps.inspect.outputs.producer_registered_main_sha }}
          VISUAL_SHA: ${{ steps.inspect.outputs.visual_registered_main_sha }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
        shell: bash
        run: |
          {
            echo '## ALDI registration refresh'
            echo "- Approved target: \`${APPROVED_SHA}\`"
            echo "- Exact-main CI run: \`${CI_RUN_ID}\`"
            echo "- Bridge execution: \`${BRIDGE_STATUS:-UNAVAILABLE}\`"
            echo "- Reason code: \`${REASON_CODE:-none}\`"
            echo "- Producer registration: \`${PRODUCER_SHA:-unavailable}\`"
            echo "- Visual-card-v2 registration: \`${VISUAL_SHA:-unavailable}\`"
            echo "- Dispatcher exit: \`${RUNNER_RC:-unknown}\`"
            echo '- Live ALDI source/prepare/diagnostic: **not performed / not authorized**'
            echo '- DB/Review/publication/canary/scheduler/deploy: **not performed / not authorized**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce registration execution
        if: always()
        env:
          BRIDGE_STATUS: ${{ steps.inspect.outputs.bridge_status }}
          PRODUCER_SHA: ${{ steps.inspect.outputs.producer_registered_main_sha }}
          VISUAL_SHA: ${{ steps.inspect.outputs.visual_registered_main_sha }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_RC" == "0" ]] || {
            echo "ALDI registration dispatcher failed closed with exit ${RUNNER_RC:-unknown}." >&2
            exit 1
          }
          [[ "$BRIDGE_STATUS" == "PASS" ]] || {
            echo 'ALDI registration bridge did not produce a validated PASS receipt.' >&2
            exit 1
          }
          [[ "$PRODUCER_SHA" == "$APPROVED_SHA" && "$VISUAL_SHA" == "$APPROVED_SHA" ]] || {
            echo 'ALDI registration SHA verification failed.' >&2
            exit 1
          }
