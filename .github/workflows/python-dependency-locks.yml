name: Python dependency hash locks

on:
  pull_request:
    branches:
      - main
    paths:
      - backend/requirements.in
      - backend/requirements-ci.in
      - backend/locks/**
      - scripts/compile-python-locks.sh
      - .github/workflows/python-dependency-locks.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-deals-python-locks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-locks:
    name: Verify Python ${{ matrix.python }} locks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.11"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up exact Python line
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.in
            backend/requirements-ci.in

      - name: Regenerate wheel-only hash locks
        shell: bash
        run: |
          bash scripts/compile-python-locks.sh "${{ matrix.python }}"

      - name: Require committed locks to be reproducible
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${{ matrix.python }}" in
            3.11)
              git diff --exit-code -- \
                backend/locks/runtime-py311.txt \
                backend/locks/ci-py311.txt
              ;;
            3.13)
              git diff --exit-code -- backend/locks/runtime-py313.txt
              ;;
            *)
              echo 'unexpected Python matrix value' >&2
              exit 64
              ;;
          esac

      - name: Upload regenerated lock evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: verified-python-locks-py${{ matrix.python }}-${{ github.sha }}
          path: backend/locks/*.txt
          if-no-files-found: error
          retention-days: 7

  migrate-ci-install:
    name: One-shot owner-bound CI hash-lock migration
    needs:
      - verify-locks
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 605 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'infra/577-python-hash-locks' &&
      github.actor == 'rozkalnsandris' &&
      github.actor_id == 277435981
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout exact owner PR branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: infra/577-python-hash-locks
          fetch-depth: 1
          persist-credentials: true

      - name: Replace exactly two legacy CI install contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          cache_old = 'cache-dependency-path: backend/requirements.txt'
          cache_new = 'cache-dependency-path: backend/locks/ci-py311.txt'
          if text.count(cache_old) != 2:
              raise SystemExit('expected exactly two legacy cache dependency paths')

          name_old = '- name: Install dependencies'
          name_new = '- name: Install hash-locked dependencies'
          if text.count(name_old) != 2:
              raise SystemExit('expected exactly two legacy install step names')

          old_install = '\n'.join((
              '          python -m pip install --upgrade pip',
              '          python -m pip install -r requirements.txt',
              '          python -m pip install pytest==8.4.1',
              '          python -m pip check',
          ))
          new_install = '\n'.join((
              '          python -m pip install \\',
              '            --disable-pip-version-check \\',
              '            --require-hashes \\',
              '            --only-binary=:all: \\',
              '            -r locks/ci-py311.txt',
              '          python -m pip check',
          ))
          if text.count(old_install) != 2:
              raise SystemExit('expected exactly two legacy pip install blocks')

          text = text.replace(cache_old, cache_new)
          text = text.replace(name_old, name_new)
          text = text.replace(old_install, new_install)
          path.write_text(text, encoding='utf-8')
          PY

          test "$(git diff --name-only | sort)" = '.github/workflows/ci.yml'
          grep -Fq 'cache-dependency-path: backend/locks/ci-py311.txt' .github/workflows/ci.yml
          test "$(grep -Fc -- '--require-hashes' .github/workflows/ci.yml)" -eq 2
          test "$(grep -Fc -- '--only-binary=:all:' .github/workflows/ci.yml)" -eq 2
          ! grep -Fq 'python -m pip install --upgrade pip' .github/workflows/ci.yml
          ! grep -Fq 'python -m pip install -r requirements.txt' .github/workflows/ci.yml
          ! grep -Fq 'python -m pip install pytest==8.4.1' .github/workflows/ci.yml

      - name: Commit only the reviewed CI migration
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git diff --name-only | sort)" = '.github/workflows/ci.yml'
          git add .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: install backend dependencies from hash lock'
          git push origin HEAD:infra/577-python-hash-locks
          echo 'CI_HASH_LOCK_MIGRATION=PASS'
