name: Diagnose current deals production stages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-deals-production-explain:
    name: RPi5 current-deals production EXPLAIN read-only
    if: >-
      github.event.pull_request.head.ref == 'diag/233-production-stage-timing' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-release
    timeout-minutes: 5

    steps:
      - name: Run exact winner query EXPLAIN ANALYZE in read-only transaction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import subprocess

          docker_prefix = None
          for candidate in (["docker"], ["sudo", "-n", "docker"]):
              probe = subprocess.run(
                  candidate + ["ps", "-q"],
                  capture_output=True,
                  text=True,
              )
              if probe.returncode == 0:
                  docker_prefix = candidate
                  break
          if docker_prefix is None:
              raise SystemExit("runner has no permitted read-only Docker access")
          print(
              "RPI5_DOCKER_ACCESS "
              f"mode={'sudo-n' if docker_prefix[0] == 'sudo' else 'direct'}"
          )

          def docker(*args: str, input_text: str | None = None):
              return subprocess.run(
                  docker_prefix + list(args),
                  input=input_text,
                  capture_output=True,
                  text=True,
              )

          web = docker(
              "ps",
              "-q",
              "--filter",
              "label=com.docker.compose.service=web",
          )
          if web.returncode != 0:
              raise SystemExit("cannot list web containers")
          production_project = None
          for container_id in web.stdout.splitlines():
              inspect = docker("inspect", container_id)
              if inspect.returncode != 0:
                  continue
              payload = json.loads(inspect.stdout)[0]
              bindings = payload.get("HostConfig", {}).get("PortBindings", {})
              if any(
                  str(item.get("HostPort")) == "9128"
                  for item in (bindings.get("80/tcp") or [])
              ):
                  production_project = (
                      payload.get("Config", {})
                      .get("Labels", {})
                      .get("com.docker.compose.project")
                  )
                  break
          if not production_project:
              raise SystemExit("production compose project for port 9128 not found")

          api = docker(
              "ps",
              "-q",
              "--filter",
              f"label=com.docker.compose.project={production_project}",
              "--filter",
              "label=com.docker.compose.service=api",
          )
          api_ids = [item for item in api.stdout.splitlines() if item]
          if api.returncode != 0 or len(api_ids) != 1:
              raise SystemExit("exact production api container not found")
          api_id = api_ids[0]
          print("RPI5_EXPLAIN_TARGET api_container_found=true")

          script = r'''
          from __future__ import annotations

          from datetime import datetime
          import json
          from zoneinfo import ZoneInfo

          from app.current_deals_sql_loader import _winner_metadata_query
          from app.db import engine

          effective_date = datetime.now(ZoneInfo("Europe/Berlin")).date()
          statement = _winner_metadata_query(effective_date)
          compiled = statement.compile(
              dialect=engine.dialect,
              compile_kwargs={"literal_binds": True},
          )
          explain_sql = "EXPLAIN (ANALYZE, BUFFERS, FORMAT JSON) " + str(compiled)

          with engine.connect() as connection:
              transaction = connection.begin()
              try:
                  connection.exec_driver_sql("SET TRANSACTION READ ONLY")
                  connection.exec_driver_sql("SET LOCAL statement_timeout = '5s'")
                  connection.exec_driver_sql("SET LOCAL lock_timeout = '1s'")
                  read_only = connection.exec_driver_sql(
                      "SHOW transaction_read_only"
                  ).scalar_one()
                  payload = connection.exec_driver_sql(explain_sql).scalar_one()
              finally:
                  transaction.rollback()

          if isinstance(payload, str):
              payload = json.loads(payload)
          document = payload[0] if isinstance(payload, list) else payload
          plan = document["Plan"]
          print(
              "RPI5_EXPLAIN_SUMMARY "
              f"transaction_read_only={read_only} "
              f"planning_ms={float(document.get('Planning Time', 0.0)):.3f} "
              f"execution_ms={float(document.get('Execution Time', 0.0)):.3f} "
              f"root={str(plan.get('Node Type', '')).replace(' ', '_')} "
              f"rows={plan.get('Actual Rows')}"
          )

          def walk(node, depth=0):
              fields = [
                  f"depth={depth}",
                  f"node={str(node.get('Node Type', '')).replace(' ', '_')}",
                  f"total_ms={float(node.get('Actual Total Time', 0.0)):.3f}",
                  f"rows={node.get('Actual Rows', 0)}",
                  f"loops={node.get('Actual Loops', 0)}",
                  f"hit={node.get('Shared Hit Blocks', 0)}",
                  f"read={node.get('Shared Read Blocks', 0)}",
                  f"temp_read={node.get('Temp Read Blocks', 0)}",
                  f"temp_written={node.get('Temp Written Blocks', 0)}",
              ]
              if node.get("Sort Method"):
                  fields.extend(
                      [
                          f"sort={str(node.get('Sort Method')).replace(' ', '_')}",
                          f"sort_kb={node.get('Sort Space Used', 0)}",
                          f"sort_space={str(node.get('Sort Space Type', '')).replace(' ', '_')}",
                      ]
                  )
              if node.get("Index Name"):
                  fields.append(f"index={node.get('Index Name')}")
              print("RPI5_EXPLAIN_NODE " + " ".join(fields))
              for child in node.get("Plans") or []:
                  walk(child, depth + 1)

          walk(plan)
          assert str(read_only).lower() in {"on", "true"}
          assert float(document.get("Execution Time", 999999.0)) < 5000.0
          '''

          completed = docker("exec", "-i", api_id, "python", "-", input_text=script)
          if completed.stdout:
              print(completed.stdout, end="")
          if completed.stderr:
              print(completed.stderr, end="")
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)
          PY
