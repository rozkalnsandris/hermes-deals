name: Diagnose current deals production stages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-deals-production-http:
    name: RPi5 current-deals production HTTP read-only
    if: >-
      github.event.pull_request.head.ref == 'diag/233-production-stage-timing' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-release
    timeout-minutes: 5

    steps:
      - name: Measure deployed current-deals stage timings over local HTTP
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import time
          import urllib.error
          import urllib.request

          URL = "http://127.0.0.1:9128/api/v1/deals/current?limit=12"
          REQUIRED = {
              "current-deals-sql",
              "current-deals-cache",
              "current-deals-rank",
              "current-deals-filter",
              "current-deals-canonical",
              "current-deals-model",
          }
          METRIC_RE = re.compile(
              r"(?P<name>[A-Za-z0-9_-]+);dur=(?P<dur>[0-9]+(?:\.[0-9]+)?)"
              r"(?:;desc=(?P<desc>[A-Za-z0-9_-]+))?"
          )

          def fetch() -> tuple[float, str, int]:
              request = urllib.request.Request(
                  URL,
                  headers={"User-Agent": "hermes-deals-read-only-stage-diagnostic"},
                  method="GET",
              )
              started = time.perf_counter()
              with urllib.request.urlopen(request, timeout=15) as response:
                  body = response.read()
                  elapsed_ms = (time.perf_counter() - started) * 1000
                  if response.status != 200:
                      raise SystemExit(f"unexpected HTTP status: {response.status}")
                  timing = response.headers.get("Server-Timing", "")
              return elapsed_ms, timing, len(body)

          deadline = time.monotonic() + 180
          first = None
          last_error = None
          while time.monotonic() < deadline:
              try:
                  elapsed_ms, header, body_bytes = fetch()
                  names = {match.group("name") for match in METRIC_RE.finditer(header)}
                  if REQUIRED.issubset(names):
                      first = (elapsed_ms, header, body_bytes)
                      break
                  last_error = f"stage metrics not deployed yet: {sorted(REQUIRED - names)}"
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  last_error = f"local HTTP unavailable: {type(exc).__name__}"
              time.sleep(5)

          if first is None:
              raise SystemExit(last_error or "timing metrics did not become available")

          def parse(header: str) -> dict[str, tuple[float, str | None]]:
              parsed = {}
              for match in METRIC_RE.finditer(header):
                  parsed[match.group("name")] = (
                      float(match.group("dur")),
                      match.group("desc"),
                  )
              return parsed

          first_elapsed, first_header, first_bytes = first
          first_metrics = parse(first_header)
          print(
              "RPI5_HTTP_STAGE_FIRST "
              f"wall_ms={first_elapsed:.1f} body_bytes={first_bytes} "
              f"total_ms={first_metrics['current-deals-sql'][0]:.1f} "
              f"cache={first_metrics['current-deals-cache'][1]} "
              f"cache_ms={first_metrics['current-deals-cache'][0]:.1f} "
              f"rank_ms={first_metrics['current-deals-rank'][0]:.1f} "
              f"filter_ms={first_metrics['current-deals-filter'][0]:.1f} "
              f"canonical_ms={first_metrics['current-deals-canonical'][0]:.1f} "
              f"model_ms={first_metrics['current-deals-model'][0]:.1f}"
          )

          warm_elapsed, warm_header, warm_bytes = fetch()
          warm_metrics = parse(warm_header)
          missing = REQUIRED - set(warm_metrics)
          if missing:
              raise SystemExit(f"warm request lost stage metrics: {sorted(missing)}")
          print(
              "RPI5_HTTP_STAGE_WARM "
              f"wall_ms={warm_elapsed:.1f} body_bytes={warm_bytes} "
              f"total_ms={warm_metrics['current-deals-sql'][0]:.1f} "
              f"cache={warm_metrics['current-deals-cache'][1]} "
              f"cache_ms={warm_metrics['current-deals-cache'][0]:.1f} "
              f"rank_ms={warm_metrics['current-deals-rank'][0]:.1f} "
              f"filter_ms={warm_metrics['current-deals-filter'][0]:.1f} "
              f"canonical_ms={warm_metrics['current-deals-canonical'][0]:.1f} "
              f"model_ms={warm_metrics['current-deals-model'][0]:.1f}"
          )

          if warm_metrics["current-deals-cache"][1] != "hit":
              raise SystemExit("second identical request did not report cache hit")
          PY
