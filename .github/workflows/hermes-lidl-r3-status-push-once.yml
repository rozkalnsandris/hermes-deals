name: Hermes Lidl R3 status push once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hermes-lidl-r3-status-push-once.yml

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Inspect exact R3 promotion command run without retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime

          repo=os.environ['REPOSITORY']
          if repo!='rozkalnsandris/hermes-deals': raise SystemExit('unexpected repository')
          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'hermes-lidl-r3-status-push-once'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r: return json.load(r)
          def post(body):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/361/comments',data=json.dumps({'body':body}).encode(),method='POST',headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=201: raise SystemExit(f'comment status {r.status}')

          command=get(f'https://api.github.com/repos/{repo}/issues/comments/5227503666')
          user=command.get('user') or {}
          exact='/hermes-lidl-source-refresh-r3-promote pr=410 fingerprint=8aaf1f96a119e51c980a45da80031d5abd2db65d4cdc3516bd5368fd0537c7f9 auth=5227260615'
          if user.get('login')!='rozkalnsandris' or user.get('id')!=277435981 or str(command.get('body') or '').strip()!=exact:
              raise SystemExit('promotion command binding mismatch')
          command_dt=datetime.fromisoformat(str(command['created_at']).replace('Z','+00:00'))

          params=urllib.parse.urlencode({'event':'issue_comment','per_page':100})
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/hermes-lidl-source-refresh-r3-promotion.yml/runs?{params}').get('workflow_runs') or []
          authorized=[]
          inspected=0
          for run in runs:
              created=datetime.fromisoformat(str(run['created_at']).replace('Z','+00:00'))
              if created < command_dt or run.get('head_branch')!='main': continue
              inspected += 1
              rid=int(run['id'])
              jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs') or []
              auth=[j for j in jobs if j.get('name')=='authorize']
              if len(auth)==1 and auth[0].get('conclusion')=='success': authorized.append((run,jobs))

          lines=['## Lidl R3 promotion deterministic status probe','', '- probe source: trusted `push` of this diagnostic workflow only', '- promotion command: `5227503666`', f'- candidate issue_comment runs inspected: `{inspected}`', f'- authorize-success runs: `{len(authorized)}`', '- promotion retry issued: `false`', '']
          if len(authorized)==1:
              run,jobs=authorized[0]; rid=int(run['id'])
              arts=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100').get('artifacts') or []
              lines += [f'- workflow run: `{rid}`', f"- status / conclusion: `{run.get('status')}` / `{run.get('conclusion')}`", f"- attempt: `{run.get('run_attempt')}`", f"- head SHA: `{run.get('head_sha')}`", f'- workflow: https://github.com/{repo}/actions/runs/{rid}', '', 'Jobs:']
              for j in jobs: lines.append(f"- `{j.get('name')}` — `{j.get('status')}` / `{j.get('conclusion')}` (job `{j.get('id')}`)")
              lines += ['', 'Artifacts:']
              if arts:
                  for a in arts: lines.append(f"- `{a.get('name')}` — id `{a.get('id')}`, digest `{a.get('digest')}`, expired `{str(bool(a.get('expired'))).lower()}`")
              else: lines.append('- none')
          elif len(authorized)==0:
              lines += ['- authoritative observation: `NO_AUTHORIZE_SUCCESS_RUN_FOUND`', '- implication: the recorded promotion command did not reach a successfully authorized promotion workflow run; no retry is performed by this probe.']
          else:
              lines += ['- authoritative observation: `AMBIGUOUS_MULTIPLE_AUTHORIZE_SUCCESS_RUNS`', '- implication: do not retry; inspect matching runs individually.']
          lines += ['', 'Safety: Actions metadata read-only. No RPi5/corpus/parser/DB/Review/publication/deploy/systemd/retry/Gate C-D/B15M2 V08 action.']
          post('\n'.join(lines))
          PY
