name: Hermes Lidl R3 promotion status v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  status:
    if: >-
      github.event.issue.number == 361 &&
      github.event.issue.pull_request == null &&
      github.actor == 'rozkalnsandris' &&
      github.event.comment.body == '/hermes-lidl-r3-status-v2 command=5227503666'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Find exact authorized R3 promotion run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime
          from pathlib import Path

          repo=os.environ['REPOSITORY']
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          sender=event.get('sender') or {}
          if repo!='rozkalnsandris/hermes-deals' or sender.get('login')!='rozkalnsandris' or sender.get('id')!=277435981:
              raise SystemExit('owner/repository mismatch')
          comment=event.get('comment') or {}
          if str(comment.get('body') or '').strip()!='/hermes-lidl-r3-status-v2 command=5227503666':
              raise SystemExit('unexpected status command')

          headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'X-GitHub-Api-Version':'2022-11-28','User-Agent':'hermes-lidl-r3-status-v2'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as r: return json.load(r)
          def post(body):
              data=json.dumps({'body':body}).encode()
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/issues/361/comments',data=data,method='POST',headers={**headers,'Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  if r.status!=201: raise SystemExit(f'comment status {r.status}')

          command=get(f'https://api.github.com/repos/{repo}/issues/comments/5227503666')
          user=command.get('user') or {}
          exact='/hermes-lidl-source-refresh-r3-promote pr=410 fingerprint=8aaf1f96a119e51c980a45da80031d5abd2db65d4cdc3516bd5368fd0537c7f9 auth=5227260615'
          if user.get('login')!='rozkalnsandris' or user.get('id')!=277435981 or str(command.get('body') or '').strip()!=exact:
              raise SystemExit('promotion command binding mismatch')
          command_dt=datetime.fromisoformat(str(command['created_at']).replace('Z','+00:00'))

          params=urllib.parse.urlencode({'event':'issue_comment','per_page':100})
          runs=get(f'https://api.github.com/repos/{repo}/actions/workflows/hermes-lidl-source-refresh-r3-promotion.yml/runs?{params}').get('workflow_runs') or []
          matches=[]
          for run in runs:
              created=datetime.fromisoformat(str(run['created_at']).replace('Z','+00:00'))
              if created < command_dt or run.get('head_branch')!='main':
                  continue
              rid=int(run['id'])
              jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100').get('jobs') or []
              authorize=[j for j in jobs if j.get('name')=='authorize']
              if len(authorize)==1 and authorize[0].get('conclusion')=='success':
                  matches.append((run,jobs))
          if len(matches)!=1:
              raise SystemExit(f'expected one authorize-success promotion run, got {len(matches)}')
          run,jobs=matches[0]; rid=int(run['id'])
          artifacts=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/artifacts?per_page=100').get('artifacts') or []
          lines=['## Lidl R3 promotion workflow status v2','', '- probe is read-only; promotion was not retried', '- promotion command: `5227503666`', f'- workflow run: `{rid}`', f"- status / conclusion: `{run.get('status')}` / `{run.get('conclusion')}`", f"- attempt: `{run.get('run_attempt')}`", f"- head SHA: `{run.get('head_sha')}`", f'- workflow: https://github.com/{repo}/actions/runs/{rid}', '', 'Jobs:']
          for j in jobs: lines.append(f"- `{j.get('name')}` — `{j.get('status')}` / `{j.get('conclusion')}` (job `{j.get('id')}`)")
          lines+=['','Artifacts:']
          if artifacts:
              for a in artifacts: lines.append(f"- `{a.get('name')}` — id `{a.get('id')}`, digest `{a.get('digest')}`, expired `{str(bool(a.get('expired'))).lower()}`")
          else: lines.append('- none')
          lines+=['','Safety: Actions data read-only; no rerun/retry, RPi5, corpus, parser, DB, Review, publication, deploy, systemd, Gate C/D or B15M2 V08 action.']
          post('\n'.join(lines))
          PY
