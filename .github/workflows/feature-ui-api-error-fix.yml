name: Apply issue 46 UI error fix

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: write

concurrency:
  group: issue-46-ui-error-fix
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: >-
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ui-temporary-api-errors'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5
        with:
          ref: fix/ui-temporary-api-errors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply exact UI patch
        run: python tools/apply_issue_46_ui_error_fix.py

      - name: Check JavaScript syntax
        run: node --check backend/app/ui/app.js

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Run focused regression
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest -q tests/test_ui_api_error_handling.py

      - name: Compile Python sources
        working-directory: backend
        run: python -m compileall -q app tests alembic

      - name: Run complete suite
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: python -m pytest -q

      - name: Verify diff and commit generated fix
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/app/ui/app.js backend/tests/test_ui_api_error_handling.py
          git diff --cached --check
          git commit -m "fix: localize temporary API failures"
          git push origin HEAD:fix/ui-temporary-api-errors
