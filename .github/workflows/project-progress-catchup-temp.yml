name: Temporary project progress catch-up

on:
  push:
    branches:
      - chore/project-progress-catchup-20260809

permissions:
  contents: write
  issues: read

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout catch-up branch
        uses: actions/checkout@v5
        with:
          ref: chore/project-progress-catchup-20260809
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate current V2 progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/update_project_progress.py

      - name: Commit generated catch-up
        run: |
          git diff --check -- README.md docs/project-progress-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/project-progress-latest.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "docs: catch up project progress"
          git push origin HEAD:chore/project-progress-catchup-20260809
