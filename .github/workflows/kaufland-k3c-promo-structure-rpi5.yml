name: Kaufland K3C promo structure RPi5 diagnostic

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged K3C bridge registration pull request number
        required: true
        type: string
      execution_sha:
        description: Exact clean RPi5 main checkout SHA to execute
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: hermes-deals-kaufland-k3c-promo-structure-rpi5
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize reviewed bridge and bounded execution checkout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      registration_sha: ${{ steps.gate.outputs.registration_sha }}
      execution_sha: ${{ steps.gate.outputs.execution_sha }}
      current_main_sha: ${{ steps.gate.outputs.current_main_sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      registration_ci_mode: ${{ steps.gate.outputs.registration_ci_mode }}
      execution_ci_mode: ${{ steps.gate.outputs.execution_ci_mode }}

    steps:
      - name: Validate owner, bridge revision, execution checkout and current-main witness
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
          REQUESTED_PR: ${{ inputs.pr_number }}
          REQUESTED_EXECUTION_SHA: ${{ inputs.execution_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit("unexpected repository")
          if os.environ["WORKFLOW_REF"] != "refs/heads/main":
              raise SystemExit("workflow must execute from main")

          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          if event.get("event_name") not in {None, "workflow_dispatch"}:
              raise SystemExit("unexpected event metadata")
          sender = event.get("sender") or {}
          if (
              sender.get("login") != os.environ["EXPECTED_OWNER_LOGIN"]
              or sender.get("id") != int(os.environ["EXPECTED_OWNER_ID"])
          ):
              raise SystemExit("workflow_dispatch actor is not allowlisted owner")

          raw_pr = os.environ["REQUESTED_PR"].strip()
          if not raw_pr.isdigit() or int(raw_pr) <= 0:
              raise SystemExit("pr_number must be a positive integer")
          pr_number = int(raw_pr)

          execution_sha = os.environ["REQUESTED_EXECUTION_SHA"].strip()
          if not re.fullmatch(r"[0-9a-f]{40}", execution_sha):
              raise SystemExit("execution_sha must be an exact lowercase 40-hex commit")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "hermes-deals-kaufland-k3c-authorizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          def workflow_runs(sha: str, event_name: str):
              query = urllib.parse.urlencode(
                  {"head_sha": sha, "event": event_name, "status": "completed", "per_page": 20}
              )
              return get(
                  f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{query}"
              ).get("workflow_runs") or []

          def successful_ci(runs, *, sha: str, event_name: str, require_main: bool) -> bool:
              return any(
                  run.get("head_sha") == sha
                  and run.get("event") == event_name
                  and run.get("conclusion") == "success"
                  and run.get("name") == "Hermes Deals CI checks"
                  and (not require_main or run.get("head_branch") == "main")
                  for run in runs
              )

          def content_blob(path: str, sha: str) -> str:
              quoted = urllib.parse.quote(path, safe="/")
              payload = get(f"https://api.github.com/repos/{repo}/contents/{quoted}?ref={sha}")
              blob = str(payload.get("sha") or "")
              if not re.fullmatch(r"[0-9a-f]{40}", blob):
                  raise SystemExit(f"invalid blob identity for {path} at {sha}")
              return blob

          def require_ancestor(base: str, head: str, message: str) -> None:
              comparison = get(f"https://api.github.com/repos/{repo}/compare/{base}...{head}")
              if comparison.get("status") not in {"ahead", "identical"}:
                  raise SystemExit(message)

          pr = get(f"https://api.github.com/repos/{repo}/pulls/{pr_number}")
          if not pr.get("merged") or not pr.get("merged_at"):
              raise SystemExit("bridge execution requires a merged pull request")
          if pr["base"]["ref"] != "main" or pr["base"]["repo"]["full_name"] != repo:
              raise SystemExit("bridge registration PR was not merged into repository main")
          if (pr.get("head", {}).get("repo") or {}).get("full_name") != repo:
              raise SystemExit("bridge registration requires a same-repository PR head")

          registration_sha = str(pr.get("merge_commit_sha") or "")
          head_sha = str((pr.get("head") or {}).get("sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", registration_sha):
              raise SystemExit("bridge registration PR does not expose a valid merge SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("bridge registration PR does not expose a valid head SHA")

          registration_commit = get(
              f"https://api.github.com/repos/{repo}/git/commits/{registration_sha}"
          )
          parents = registration_commit.get("parents") or []
          if len(parents) != 1:
              raise SystemExit("bridge registration SHA must be a single-parent reviewed merge")
          registration_parent = str((parents[0] or {}).get("sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", registration_parent):
              raise SystemExit("bridge registration parent SHA is invalid")

          workflow_path = ".github/workflows/kaufland-k3c-promo-structure-rpi5.yml"
          installer_path = "tools/runner/install-kaufland-k3c-promo-structure-rpi5-bridge.sh"
          workflow_changed = content_blob(workflow_path, registration_sha) != content_blob(
              workflow_path, registration_parent
          )
          installer_changed = content_blob(installer_path, registration_sha) != content_blob(
              installer_path, registration_parent
          )
          if not (workflow_changed or installer_changed):
              raise SystemExit("selected PR did not introduce or update the K3C bridge control plane")

          main_branch = get(f"https://api.github.com/repos/{repo}/branches/main")
          current_main_sha = str((main_branch.get("commit") or {}).get("sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", current_main_sha):
              raise SystemExit("current main does not expose a valid SHA")

          require_ancestor(
              registration_sha,
              execution_sha,
              "requested execution checkout is not a registration descendant",
          )
          require_ancestor(
              execution_sha,
              current_main_sha,
              "requested execution checkout is not reachable from current main",
          )

          merge_runs = workflow_runs(registration_sha, "push")
          merge_ci_ok = successful_ci(
              merge_runs, sha=registration_sha, event_name="push", require_main=True
          )
          registration_ci_mode = "merge_push_ci"
          if not merge_ci_ok:
              head_runs = workflow_runs(head_sha, "pull_request")
              head_ci_ok = successful_ci(
                  head_runs, sha=head_sha, event_name="pull_request", require_main=False
              )
              if not head_ci_ok:
                  raise SystemExit("neither registration merge SHA nor exact PR head has successful CI")
              head_commit = get(f"https://api.github.com/repos/{repo}/git/commits/{head_sha}")
              registration_tree = str((registration_commit.get("tree") or {}).get("sha") or "")
              head_tree = str((head_commit.get("tree") or {}).get("sha") or "")
              if not re.fullmatch(r"[0-9a-f]{40}", registration_tree) or registration_tree != head_tree:
                  raise SystemExit("tested PR head tree differs from squash merge tree")
              registration_ci_mode = "tree_equivalent_pr_head_ci"

          if execution_sha == registration_sha:
              execution_ci_mode = "registration_ci_reuse"
          else:
              execution_runs = workflow_runs(execution_sha, "push")
              if not successful_ci(
                  execution_runs, sha=execution_sha, event_name="push", require_main=True
              ):
                  raise SystemExit("exact execution checkout does not have successful main push CI")
              execution_ci_mode = "exact_execution_push_ci"

          critical_paths = (
              workflow_path,
              installer_path,
              "tools/runner/kaufland_k3c_promo_structure_bridge_validator.py",
              "backend/app/kaufland_k3c_promo_structure_diagnostic.py",
              "backend/app/kaufland_real_k2_v2_derivation.py",
              "backend/app/kaufland_evidence_freeze.py",
              "backend/app/kaufland_source_card_contract.py",
              "backend/app/kaufland_source_discovery.py",
              "tools/runner/build-kaufland-k3c-python-runtime.sh",
              "tools/runner/kaufland_k3c_python_runtime_contract.py",
              "backend/locks/manifest.json",
              "scripts/verify-python-lock-environment.py",
              "backend/locks/runtime-py311.txt",
              "backend/locks/runtime-py313.txt",
          )
          for path in critical_paths:
              registration_blob = content_blob(path, registration_sha)
              if registration_blob != content_blob(path, execution_sha):
                  raise SystemExit(f"trusted K3C source drift at execution checkout: {path}")
              if registration_blob != content_blob(path, current_main_sha):
                  raise SystemExit(f"trusted K3C source drift on current main: {path}")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"registration_sha={registration_sha}\n")
              handle.write(f"execution_sha={execution_sha}\n")
              handle.write(f"current_main_sha={current_main_sha}\n")
              handle.write(f"pr_number={pr_number}\n")
              handle.write(f"registration_ci_mode={registration_ci_mode}\n")
              handle.write(f"execution_ci_mode={execution_ci_mode}\n")
          PY

  rpi5-diagnostic:
    name: Run fixed read-only Kaufland diagnostic on RPi5
    needs: authorize
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 30
    permissions: {}
    outputs:
      bridge_status: ${{ steps.inspect.outputs.bridge_status }}
      diagnostic_status: ${{ steps.inspect.outputs.diagnostic_status }}
      reason_code: ${{ steps.inspect.outputs.reason_code }}
      runner_rc: ${{ steps.dispatch.outputs.runner_rc }}

    steps:
      - name: Run fixed root-owned dispatcher
        id: dispatch
        env:
          REGISTRATION_SHA: ${{ needs.authorize.outputs.registration_sha }}
          EXECUTION_SHA: ${{ needs.authorize.outputs.execution_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export_dir="${RUNNER_TEMP}/hermes-deals-kaufland-k3c-promo-structure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$export_dir"
          echo "artifact_dir=$export_dir" >> "$GITHUB_OUTPUT"

          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-kaufland-k3c-promo-structure-dispatch \
            "$REGISTRATION_SHA" \
            "$EXECUTION_SHA" \
            "$export_dir"
          runner_rc=$?
          set -e
          echo "runner_rc=$runner_rc" >> "$GITHUB_OUTPUT"

      - name: Inspect sanitized bridge receipt
        id: inspect
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.dispatch.outputs.artifact_dir }}
          REGISTRATION_SHA: ${{ needs.authorize.outputs.registration_sha }}
          EXECUTION_SHA: ${{ needs.authorize.outputs.execution_sha }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          artifact_dir = pathlib.Path(os.environ.get("ARTIFACT_DIR") or ".")
          summary_path = artifact_dir / "kaufland-k3c-promo-structure-summary.json"
          runner_rc_raw = os.environ.get("RUNNER_RC") or "1"
          runner_rc = int(runner_rc_raw) if re.fullmatch(r"-?[0-9]+", runner_rc_raw) else 1

          bridge_status = "BLOCKED"
          diagnostic_status = "UNAVAILABLE"
          reason_code = "SANITIZED_SUMMARY_MISSING"
          if summary_path.is_file() and not summary_path.is_symlink():
              payload = json.loads(summary_path.read_text(encoding="utf-8"))
              if payload.get("bridge_schema_version") != 2:
                  raise SystemExit("bridge summary schema mismatch")
              if payload.get("bridge_contract_version") != "kaufland-k3c-promo-structure-rpi5-bridge-v2":
                  raise SystemExit("bridge summary contract mismatch")
              if payload.get("registered_commit_sha") != os.environ["REGISTRATION_SHA"]:
                  raise SystemExit("bridge summary registration mismatch")
              if payload.get("execution_checkout_sha") != os.environ["EXECUTION_SHA"]:
                  raise SystemExit("bridge summary execution mismatch")
              if payload.get("evidence_only") is not True:
                  raise SystemExit("bridge summary is not evidence-only")
              if payload.get("promo_role_promoted") is not False:
                  raise SystemExit("bridge summary unexpectedly promoted promo role")
              if payload.get("production_deploy_authorized") is not False:
                  raise SystemExit("bridge summary authorizes production deploy")
              if payload.get("host_mutation_authorized") is not False:
                  raise SystemExit("bridge summary authorizes host mutation")

              bridge_status = str(payload.get("bridge_execution_status") or "BLOCKED")
              diagnostic_status = str(payload.get("diagnostic_status") or "UNAVAILABLE")
              reason = payload.get("reason_code")
              reason_code = "none" if reason is None else str(reason)
              if bridge_status not in {"PASS", "BLOCKED"}:
                  raise SystemExit("unsupported bridge execution status")
              if diagnostic_status not in {"PASS", "BLOCKED", "UNAVAILABLE"}:
                  raise SystemExit("unsupported diagnostic status")
              if not re.fullmatch(r"(?:none|[A-Z0-9_]{1,96})", reason_code):
                  raise SystemExit("unbounded reason code")
              if runner_rc == 0:
                  if bridge_status != "PASS" or diagnostic_status not in {"PASS", "BLOCKED"}:
                      raise SystemExit("dispatcher success/status mismatch")
              elif bridge_status != "BLOCKED":
                  raise SystemExit("dispatcher failure/status mismatch")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"bridge_status={bridge_status}\n")
              handle.write(f"diagnostic_status={diagnostic_status}\n")
              handle.write(f"reason_code={reason_code}\n")
          PY

      - name: Upload sanitized structural evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kaufland-k3c-promo-structure-${{ needs.authorize.outputs.registration_sha }}-${{ needs.authorize.outputs.execution_sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 9

      - name: Record read-only safety boundary
        if: always()
        env:
          REGISTRATION_SHA: ${{ needs.authorize.outputs.registration_sha }}
          EXECUTION_SHA: ${{ needs.authorize.outputs.execution_sha }}
          CURRENT_MAIN_SHA: ${{ needs.authorize.outputs.current_main_sha }}
          BRIDGE_STATUS: ${{ steps.inspect.outputs.bridge_status }}
          DIAGNOSTIC_STATUS: ${{ steps.inspect.outputs.diagnostic_status }}
          REASON_CODE: ${{ steps.inspect.outputs.reason_code }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          {
            echo '## Kaufland K3C promo-structure RPi5 diagnostic'
            echo "- Registered bridge revision: \`${REGISTRATION_SHA}\`"
            echo "- Exact execution checkout: \`${EXECUTION_SHA}\`"
            echo "- Current-main witness: \`${CURRENT_MAIN_SHA}\`"
            echo "- Bridge execution: \`${BRIDGE_STATUS:-UNAVAILABLE}\`"
            echo "- Diagnostic status: \`${DIAGNOSTIC_STATUS:-UNAVAILABLE}\`"
            echo "- Reason code: \`${REASON_CODE:-none}\`"
            echo "- Dispatcher exit: \`${RUNNER_RC:-unknown}\`"
            echo '- Evidence-only: **true**'
            echo '- Public promo promoted: **false**'
            echo '- Production DB/Review/publication writes: **not authorized**'
            echo '- Production deploy: **not authorized**'
            echo '- Host mutation by diagnostic: **not authorized**'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce bridge execution
        if: always()
        env:
          BRIDGE_STATUS: ${{ steps.inspect.outputs.bridge_status }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_RC" == "0" ]] || {
            echo "Kaufland K3C bridge failed closed with dispatcher exit ${RUNNER_RC:-unknown}." >&2
            exit 1
          }
          [[ "$BRIDGE_STATUS" == "PASS" ]] || {
            echo "Kaufland K3C bridge did not produce a validated receipt." >&2
            exit 1
          }
