name: Owner-gated Lidl dedicated source sync

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact current main SHA approved for the dedicated Lidl audit checkout
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hermes-lidl-source-sync
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact current main sync target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      ci_run_id: ${{ steps.gate.outputs.ci_run_id }}
    steps:
      - name: Validate owner, exact current main and CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
          REQUESTED_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          repo = os.environ['REPOSITORY']
          if repo != 'rozkalnsandris/hermes-deals': raise SystemExit('unexpected repository')
          if os.environ['WORKFLOW_REF'] != 'refs/heads/main': raise SystemExit('workflow must execute from main')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          sender = event.get('sender') or {}
          if sender.get('login') != os.environ['EXPECTED_OWNER_LOGIN'] or sender.get('id') != int(os.environ['EXPECTED_OWNER_ID']):
              raise SystemExit('workflow_dispatch actor is not allowlisted owner')
          requested = os.environ['REQUESTED_SHA'].strip()
          if re.fullmatch(r'[0-9a-f]{40}', requested) is None: raise SystemExit('expected_main_sha must be one exact lowercase SHA')
          headers = {'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'hermes-lidl-source-sync','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as r: return json.load(r)
          main = get(f'https://api.github.com/repos/{repo}/branches/main')
          if str((main.get('commit') or {}).get('sha') or '') != requested: raise SystemExit('requested SHA is not exact current main')
          q = urllib.parse.urlencode({'head_sha':requested,'event':'push','status':'completed','per_page':20})
          runs = get(f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{q}').get('workflow_runs') or []
          matches = [r for r in runs if r.get('head_sha') == requested and r.get('head_branch') == 'main' and r.get('event') == 'push' and r.get('conclusion') == 'success' and r.get('name') == 'Hermes Deals CI checks']
          if not matches: raise SystemExit('exact current main has no successful push CI run')
          out = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a') as h:
              h.write(f'sha={requested}\nci_run_id={max(int(r["id"]) for r in matches)}\n')
          PY

  sync-rpi5:
    name: Fast-forward fixed Lidl dedicated checkout
    needs: authorize
    runs-on: [self-hosted, Linux, ARM64, hermes-deals-audit]
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Run fixed root-owned Lidl source-sync dispatcher
        id: dispatch
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_dir="${RUNNER_TEMP}/lidl-source-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ ! -e "$artifact_dir" ]]
          install -d -m 0700 "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-lidl-source-sync-dispatch "$APPROVED_SHA" "$artifact_dir"
          rc=$?
          set -e
          echo "runner_rc=$rc" >> "$GITHUB_OUTPUT"
      - name: Inspect sanitized source-sync receipt
        id: inspect
        if: always()
        env:
          ARTIFACT_DIR: ${{ steps.dispatch.outputs.artifact_dir }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.sha }}
          RUNNER_RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: python
        run: |
          import json, os, pathlib, re
          p = pathlib.Path(os.environ.get('ARTIFACT_DIR') or '.') / 'lidl-source-sync-summary.json'
          rc_raw = os.environ.get('RUNNER_RC') or '1'; rc = int(rc_raw) if re.fullmatch(r'-?[0-9]+', rc_raw) else 1
          status='BLOCKED'; reason='SANITIZED_SUMMARY_MISSING'
          if p.is_file() and not p.is_symlink():
              x=json.loads(p.read_text())
              fields={'bridge_schema_version','bridge_contract_version','bridge_execution_status','reason_code','registered_bridge_sha','source_checkout_path','head_before','target_sha','remote_main_sha','head_after','host_mutation_started','network_fetch_attempted','source_checkout_head_changed','production_deploy_performed','database_write_performed','review_write_performed','publication_write_performed','retained_evidence_read_performed','retained_evidence_write_performed','diagnostic_execution_performed','scheduler_change_performed','systemd_change_performed','cloudflare_mutation_performed','container_mutation_performed','package_install_performed'}
              if set(x) != fields: raise SystemExit('source-sync summary field set mismatch')
              if x['bridge_schema_version'] != 1 or x['bridge_contract_version'] != 'hermes-deals-lidl-source-sync-v1': raise SystemExit('source-sync summary contract mismatch')
              if x['source_checkout_path'] != '/home/andris/hermes-deals-audit-source-lidl' or x['target_sha'] != os.environ['EXPECTED_SHA']: raise SystemExit('source-sync target/path mismatch')
              unsafe={'production_deploy_performed','database_write_performed','review_write_performed','publication_write_performed','retained_evidence_read_performed','retained_evidence_write_performed','diagnostic_execution_performed','scheduler_change_performed','systemd_change_performed','cloudflare_mutation_performed','container_mutation_performed','package_install_performed'}
              if any(x[f] is not False for f in unsafe): raise SystemExit('source-sync receipt contains forbidden mutation')
              status=str(x['bridge_execution_status']); reason='none' if x['reason_code'] is None else str(x['reason_code'])
              if status not in {'PASS','BLOCKED'} or re.fullmatch(r'(?:none|[A-Z0-9_]{1,96})',reason) is None: raise SystemExit('invalid receipt status/reason')
              if rc == 0:
                  if status != 'PASS' or x['reason_code'] is not None or x['head_after'] != x['target_sha'] or x['host_mutation_started'] is not True or x['network_fetch_attempted'] is not True: raise SystemExit('dispatcher success attestation mismatch')
              elif status != 'BLOCKED': raise SystemExit('dispatcher failure/status mismatch')
          with open(os.environ['GITHUB_OUTPUT'],'a') as h: h.write(f'bridge_status={status}\nreason_code={reason}\n')
      - name: Upload sanitized source-sync evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lidl-source-sync-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}/lidl-source-sync-summary.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce source-sync execution
        if: always()
        env:
          STATUS: ${{ steps.inspect.outputs.bridge_status }}
          RC: ${{ steps.dispatch.outputs.runner_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RC" == 0 && "$STATUS" == PASS ]]
