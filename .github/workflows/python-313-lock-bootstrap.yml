name: Python 3.13 lock bootstrap

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  compile:
    name: Compile canonical Python 3.13 locks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact pull request source
        uses: actions/checkout@v5

      - name: Set up canonical Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.14"

      - name: Compile repository locks
        run: |
          bash scripts/compile-python-locks.sh 3.13

      - name: Require existing runtime lock to be reproducible
        run: |
          git diff --exit-code -- backend/locks/runtime-py313.txt

      - name: Record generated CI lock identity
        run: |
          test -s backend/locks/ci-py313.txt
          sha256sum backend/locks/ci-py313.txt

      - name: Upload generated CI lock
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-313-ci-lock
          path: backend/locks/ci-py313.txt
          if-no-files-found: error
          retention-days: 1
