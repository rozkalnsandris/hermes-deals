name: Issue 32 browser viewport audit

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  browser-audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-32-ui-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install runtime and browser
        run: |
          python -m pip install -r backend/requirements.txt
          mkdir -p /tmp/issue32-browser
          cd /tmp/issue32-browser
          npm init -y >/dev/null
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start isolated UI server
        env:
          DATABASE_URL: "sqlite+pysqlite:////tmp/issue32-browser.db"
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 >/tmp/issue32-uvicorn.log 2>&1 &
          echo $! >/tmp/issue32-uvicorn.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/ui >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/issue32-uvicorn.log
          exit 1

      - name: Audit narrow viewport behavior
        working-directory: /tmp/issue32-browser
        run: |
          cat > audit.cjs <<'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const widths = [320, 360, 390, 430, 768];
          const surfaces = [
            { path: '/ui', name: 'family', controls: ['#asOfPickerButton', '#weeklyDateButton', '#toggleFilters'] },
            { path: '/ui/review', name: 'review', controls: ['#reload', '#reviewSearch', '#status'] },
          ];

          function syntheticFamilyMarkup() {
            const longName = 'Ļoti garš produkta nosaukums ar īpaši garu_nepārtrauktu_identifikatoru_1234567890_ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            return `
              <article class="card reference-product-card">
                <div class="media"><div class="media-placeholder">H</div></div>
                <div class="card-main"><h2 class="product-name">${longName}</h2><div class="brand-name">Ļoti garš zīmola nosaukums</div><span class="package">12 × 1 250 ml īpaši garš iepakojuma apraksts</span></div>
                <div class="price-block"><div class="price">123,45 €</div><div class="price-note">retailer cena</div></div>
                <div class="actions"><button class="btn">Detaļas</button><button class="btn primary">Sarakstam +</button></div>
              </article>
              <article class="weekly-store-card">
                <button class="weekly-product" type="button">
                  <span class="weekly-product-media"><span class="weekly-product-placeholder">Nav attēla</span></span>
                  <span class="weekly-product-copy"><span class="weekly-product-brand">TESTA VEIKALS</span><span class="weekly-product-name">${longName}</span><span class="weekly-product-tags"><span class="weekly-product-tag start">Sākas šajā dienā</span><span class="weekly-product-tag">05.08.2026–08.08.2026</span></span></span>
                  <span class="weekly-product-price">123,45 €</span>
                </button>
              </article>`;
          }

          async function assertNoPageOverflow(page, label) {
            const metrics = await page.evaluate(() => ({
              innerWidth: window.innerWidth,
              documentScrollWidth: document.documentElement.scrollWidth,
              bodyScrollWidth: document.body.scrollWidth,
            }));
            const actual = Math.max(metrics.documentScrollWidth, metrics.bodyScrollWidth);
            if (actual > metrics.innerWidth + 1) {
              throw new Error(`${label}: horizontal overflow ${actual}px > ${metrics.innerWidth}px`);
            }
          }

          async function assertControlsInViewport(page, selectors, label) {
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              if (!(await locator.count()) || !(await locator.isVisible())) continue;
              const box = await locator.boundingBox();
              if (!box) throw new Error(`${label}: ${selector} has no bounding box`);
              const width = await page.evaluate(() => window.innerWidth);
              if (box.x < -1 || box.x + box.width > width + 1) {
                throw new Error(`${label}: ${selector} leaves viewport (${box.x}..${box.x + box.width}, width ${width})`);
              }
              await locator.focus();
              const focused = await locator.evaluate(node => node === document.activeElement);
              if (!focused) throw new Error(`${label}: ${selector} is not keyboard-focusable`);
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const results = [];
            try {
              for (const width of widths) {
                for (const surface of surfaces) {
                  const page = await browser.newPage({ viewport: { width, height: 900 }, deviceScaleFactor: 1 });
                  await page.goto(`http://127.0.0.1:8765${surface.path}`, { waitUntil: 'domcontentloaded' });
                  await page.waitForTimeout(500);
                  const label = `${surface.name}@${width}`;
                  await assertNoPageOverflow(page, `${label}:initial`);
                  await assertControlsInViewport(page, surface.controls, label);

                  if (surface.name === 'family') {
                    await page.evaluate(markup => {
                      const host = document.querySelector('#grid') || document.querySelector('#deals') || document.body;
                      host.insertAdjacentHTML('afterbegin', markup);
                    }, syntheticFamilyMarkup());
                  } else {
                    await page.evaluate(() => {
                      const detail = document.querySelector('#detail');
                      if (!detail) return;
                      detail.innerHTML = `
                        <div class="source">Ļoti_garš_nepārtraukts_avota_teksts_1234567890_ABCDEFGHIJKLMNOPQRSTUVWXYZ</div>
                        <div class="grid"><div><label>Produkts</label><input value="Ļoti garš testa produkta nosaukums"></div><div><label>Datums</label><div class="date-entry"><input value="05.08.2026"><button class="date-picker-button">📅</button></div></div></div>
                        <div class="actions sticky-actions"><button>Saglabāt labojumus</button><button class="primary">Apstiprināt un publicēt</button><button class="danger">Noraidīt</button></div>`;
                    });
                  }

                  await assertNoPageOverflow(page, `${label}:dense`);
                  if (width === 320 || width === 390) {
                    const target = `/tmp/issue32-browser/${surface.name}-${width}.png`;
                    await page.screenshot({ path: target, fullPage: true });
                  }
                  results.push({ surface: surface.name, width, status: 'pass' });
                  await page.close();
                }
              }
              fs.writeFileSync('/tmp/issue32-browser/results.json', JSON.stringify(results, null, 2));
              console.log(JSON.stringify(results));
            } finally {
              await browser.close();
            }
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
          node audit.cjs

      - name: Upload browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-32-browser-audit
          path: |
            /tmp/issue32-browser/results.json
            /tmp/issue32-browser/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary browser workflow
        run: |
          rm -- .github/workflows/issue-32-browser-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/issue-32-browser-audit.yml
          git diff --cached --check
          git commit -m "chore: remove issue 32 browser audit workflow"
          git push origin HEAD:${{ github.head_ref }}

      - name: Stop isolated UI server
        if: always()
        run: |
          if test -f /tmp/issue32-uvicorn.pid; then
            kill "$(cat /tmp/issue32-uvicorn.pid)" 2>/dev/null || true
          fi
