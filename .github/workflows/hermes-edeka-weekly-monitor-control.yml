name: Hermes EDEKA weekly monitor control

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: hermes-deals-edeka-weekly-monitor-control
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact owner EDEKA monitor command
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 26 &&
      github.actor == 'rozkalnsandris' &&
      github.event.sender.id == 277435981 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/hermes-edeka monitor ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      operation: ${{ steps.authorize.outputs.operation }}
      pr_number: ${{ steps.authorize.outputs.pr_number }}
      bridge_sha: ${{ steps.authorize.outputs.bridge_sha }}
      registered_sha: ${{ steps.authorize.outputs.registered_sha }}
      registration_fingerprint: ${{ steps.authorize.outputs.registration_fingerprint }}
      source_refetch_authorized: ${{ steps.authorize.outputs.source_refetch_authorized }}
      bounded_retry_authorized: ${{ steps.authorize.outputs.bounded_retry_authorized }}
      issue_number: ${{ steps.authorize.outputs.issue_number }}
      comment_id: ${{ steps.authorize.outputs.comment_id }}
      trigger_actor: ${{ steps.authorize.outputs.trigger_actor }}
    steps:
      - name: Checkout reviewed default-branch authorization code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate exact owner command and bridge identity
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python tools/github_edeka_weekly_monitor_control.py

  control:
    name: Apply one registered EDEKA monitor control operation on RPi5
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Create private sanitized control evidence directory
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$RUNNER_TEMP" == "/home/github-runner/_work/_temp" ]]
          artifact_dir="${RUNNER_TEMP}/hermes-deals-edeka-monitor-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$artifact_dir"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"

      - name: Run only the fixed root-owned EDEKA monitor dispatcher
        id: dispatch
        env:
          OPERATION: ${{ needs.authorize.outputs.operation }}
          REGISTERED_SHA: ${{ needs.authorize.outputs.registered_sha }}
          REGISTRATION_FINGERPRINT: ${{ needs.authorize.outputs.registration_fingerprint }}
          SOURCE_REFETCH_AUTHORIZED: ${{ needs.authorize.outputs.source_refetch_authorized }}
          BOUNDED_RETRY_AUTHORIZED: ${{ needs.authorize.outputs.bounded_retry_authorized }}
          ARTIFACT_DIR: ${{ steps.prepare.outputs.artifact_dir }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$OPERATION" =~ ^(activate|disable|rollback)$ ]]
          [[ "$REGISTERED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REGISTRATION_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          args=("$OPERATION" "$REGISTERED_SHA" "$REGISTRATION_FINGERPRINT")
          if [[ "$OPERATION" == "activate" ]]; then
            [[ "$SOURCE_REFETCH_AUTHORIZED" == "true" ]]
            [[ "$BOUNDED_RETRY_AUTHORIZED" == "true" ]]
            args+=("source-refetch-authorized" "bounded-retries-authorized")
          else
            [[ "$SOURCE_REFETCH_AUTHORIZED" == "false" ]]
            [[ "$BOUNDED_RETRY_AUTHORIZED" == "false" ]]
          fi
          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-edeka-weekly-monitor-control \
            "${args[@]}" >"$ARTIFACT_DIR/dispatcher-result.json" 2>/dev/null
          dispatcher_rc=$?
          set -e
          echo "dispatcher_rc=$dispatcher_rc" >> "$GITHUB_OUTPUT"

      - name: Inspect and sanitize EDEKA monitor control result
        id: inspect
        if: always() && steps.prepare.outputs.artifact_dir != ''
        env:
          ARTIFACT_DIR: ${{ steps.prepare.outputs.artifact_dir }}
          EXPECTED_OPERATION: ${{ needs.authorize.outputs.operation }}
          EXPECTED_SHA: ${{ needs.authorize.outputs.registered_sha }}
          EXPECTED_REGISTRATION: ${{ needs.authorize.outputs.registration_fingerprint }}
          EXPECTED_REFETCH: ${{ needs.authorize.outputs.source_refetch_authorized }}
          EXPECTED_RETRIES: ${{ needs.authorize.outputs.bounded_retry_authorized }}
          DISPATCHER_RC: ${{ steps.dispatch.outputs.dispatcher_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          root = Path(os.environ["ARTIFACT_DIR"])
          operation = os.environ["EXPECTED_OPERATION"]
          commit = os.environ["EXPECTED_SHA"]
          registration = os.environ["EXPECTED_REGISTRATION"]
          expected_refetch = os.environ["EXPECTED_REFETCH"] == "true"
          expected_retries = os.environ["EXPECTED_RETRIES"] == "true"
          rc = int(os.environ.get("DISPATCHER_RC") or "255")
          if operation not in {"activate", "disable", "rollback"}:
              raise SystemExit("invalid authorized operation")
          if re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("invalid authorized SHA")
          if re.fullmatch(r"[0-9a-f]{64}", registration) is None:
              raise SystemExit("invalid authorized registration fingerprint")
          if (operation == "activate") != expected_refetch or (operation == "activate") != expected_retries:
              raise SystemExit("authority matrix mismatch")

          bridge = {
              "schema_version": 1,
              "control": "edeka-weekly-monitor-control",
              "operation": operation,
              "registered_commit": commit,
              "registration_fingerprint": registration,
              "dispatcher_rc": rc,
              "raw_stderr_exported": False,
              "source_refetch_authorized": expected_refetch,
              "bounded_retry_authorized": expected_retries,
              "production_database_write_authorized": False,
              "review_write_authorized": False,
              "publication_write_authorized": False,
              "deployment_authorized": False,
          }
          raw_path = root / "dispatcher-result.json"
          if rc == 0:
              if not raw_path.is_file() or raw_path.is_symlink() or raw_path.stat().st_size > 64 * 1024:
                  raise SystemExit("successful dispatcher result missing or unsafe")
              raw = json.loads(raw_path.read_text(encoding="utf-8"))
              required = {
                  "schema_version": 1,
                  "control": "edeka-weekly-monitor-control",
                  "issue_number": 26,
                  "bridge_pr": 673,
                  "operation": operation,
                  "result": "PASS",
                  "registered_commit": commit,
                  "registration_fingerprint": registration,
                  "source_refetch_authorized": expected_refetch,
                  "bounded_retry_authorized": expected_retries,
                  "source_refetch_performed_by_control": False,
                  "rollback_preserves_shadow_evidence_root": True,
                  "rollback_preserves_monitor_evidence_root": True,
                  "rollback_preserves_cache_root": True,
                  "production_database_write_authorized": False,
                  "review_write_authorized": False,
                  "publication_write_authorized": False,
                  "deployment_authorized": False,
              }
              for key, value in required.items():
                  if raw.get(key) != value:
                      raise SystemExit(f"dispatcher result mismatch: {key}")
              bridge.update({
                  "result": "PASS",
                  "systemd_change_performed": bool(raw.get("systemd_change_performed", False)),
                  "root_host_mutation_performed": bool(raw.get("root_host_mutation_performed", False)),
                  "daemon_reload_performed": bool(raw.get("daemon_reload_performed", False)),
                  "timer_enable_performed": bool(raw.get("timer_enable_performed", False)),
                  "timer_start_performed": bool(raw.get("timer_start_performed", False)),
                  "timer_disable_performed": bool(raw.get("timer_disable_performed", False)),
                  "timer_stop_performed": bool(raw.get("timer_stop_performed", False)),
                  "service_stop_performed": bool(raw.get("service_stop_performed", False)),
                  "timer_may_trigger_refetch": bool(raw.get("timer_may_trigger_refetch", False)),
                  "activation_state": str(raw.get("activation_state") or ""),
              })
              if operation == "rollback":
                  bridge["removed_unit_count"] = int(raw.get("removed_unit_count", 0))
                  bridge["registration_config_removed"] = bool(raw.get("registration_config_removed", False))
          else:
              bridge["result"] = "CONTROL_EXECUTION_BLOCKED"
              bridge["systemd_change_outcome"] = "failed_or_fail_closed"

          raw_path.unlink(missing_ok=True)
          out = root / "bridge-result.json"
          out.write_text(json.dumps(bridge, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload only sanitized EDEKA monitor control evidence
        if: always() && steps.prepare.outputs.artifact_dir != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hermes-edeka-weekly-monitor-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.prepare.outputs.artifact_dir }}/bridge-result.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful registered EDEKA monitor control operation
        if: always()
        env:
          DISPATCHER_RC: ${{ steps.dispatch.outputs.dispatcher_rc }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${DISPATCHER_RC:-255}" == "0" ]]
