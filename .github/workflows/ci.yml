name: Hermes Deals CI checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-deals-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend-lock-bootstrap:
    name: Frontend W3 lock/bootstrap
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pinned Node
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc

      - name: Generate exact dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts

      - name: Install from generated lock
        run: |
          npm ci --ignore-scripts

      - name: Verify deterministic W3 build contract
        run: |
          npm run build:check
          first_sha="$(sha256sum dist/app.js | awk '{print $1}')"
          rm -rf dist
          npm run build:check
          second_sha="$(sha256sum dist/app.js | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
          echo "HERMES_UI_W3_DETERMINISTIC_SHA256=$second_sha"

      - name: Stage generated lock artifact
        run: |
          install -d -m 0755 "$RUNNER_TEMP/hermes-ui-lock"
          cp package-lock.json "$RUNNER_TEMP/hermes-ui-lock/package-lock.json"
          test -s "$RUNNER_TEMP/hermes-ui-lock/package-lock.json"

      - name: Upload generated lock artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-ui-w3-package-lock
          path: ${{ runner.temp }}/hermes-ui-lock/package-lock.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests alembic

      - name: Run complete test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -q

  postgres-current-deals:
    name: PostgreSQL 18 current-deals contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+psycopg://hermes:hermes@localhost:5432/hermes_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Apply database migrations
        run: |
          python -m alembic upgrade head

      - name: Run PostgreSQL current-deals contracts
        run: |
          python -m pytest -q -s \
            tests/test_current_deals_sql_postgresql_contract.py \
            tests/test_current_deals_sql_postgresql_runtime.py \
            tests/test_current_deals_postgresql_materialization_benchmark.py
