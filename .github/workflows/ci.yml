name: Hermes Deals CI checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-deals-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    name: FAST-LANE classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          if os.environ['EVENT_NAME'] != 'pull_request':
              docs_only = False
          else:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              if not base or not head:
                  raise SystemExit('missing pull request base/head SHA')
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMR', base, head],
                  text=True,
              ).splitlines()
              if not changed:
                  raise SystemExit('empty pull request diff')

              def is_docs(path: str) -> bool:
                  p = pathlib.PurePosixPath(path)
                  return p.suffix.lower() in {'.md', '.txt'} or p.parts[:1] == ('docs',)

              docs_only = all(is_docs(path) for path in changed)

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"docs_only={'true' if docs_only else 'false'}\n")
          print(f'FAST_LANE_DOCS_ONLY={str(docs_only).lower()}')
          PY

  frontend-build:
    name: Frontend W3 deterministic build
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pinned Node
        uses: actions/setup-node@v6
        with:
          node-version-file: backend/frontend/.nvmrc
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json

      - name: Install exact frontend dependencies
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Run frontend module parity tests
        run: |
          npm test

      - name: Verify deterministic W3 build contract
        run: |
          npm run build:check
          first_sha="$(sha256sum dist/app.js | awk '{print $1}')"
          rm -rf dist
          npm run build:check
          second_sha="$(sha256sum dist/app.js | awk '{print $1}')"
          test "$first_sha" = "$second_sha"
          echo "HERMES_UI_W3_DETERMINISTIC_SHA256=$second_sha"

      - name: Verify lockfile is immutable
        run: |
          git diff --exit-code -- package-lock.json package.json

  release-image:
    name: W3 immutable release image
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build exact backend context
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag hermes-deals:w3-ci \
            backend

      - name: Verify final image is Node-free and self-contained
        run: |
          docker run --rm --entrypoint /bin/sh hermes-deals:w3-ci -eu -c '
            test ! -e /usr/local/bin/node
            test ! -e /usr/local/bin/npm
            test ! -d /ui
            grep -Fq "w3-behavior-preserving-bootstrap-v1" /app/app/ui/app.js
            grep -Fq "normalized_unique_deals_by_id_v1" /app/app/ui/app.js
            grep -Fq "data-hermes-production-bundle=\"styles.css\"" /app/app/ui/index.html
            grep -Fq "data-hermes-production-bundle=\"app.js\"" /app/app/ui/index.html
            grep -Fq "w3-behavior-preserving-bootstrap-v1" /app/app/ui/index.html
            ! grep -Fq "<link rel=\"stylesheet\" href=\"/ui/styles.css\">" /app/app/ui/index.html
            ! grep -Fq "<script src=\"/ui/weekly-payload-bridge.js\"></script>" /app/app/ui/index.html
            ! grep -Fq "<script src=\"/ui/app.js\"></script>" /app/app/ui/index.html
            test -s /app/app/ui/index.html
            test -s /app/app/ui/app.js
          '

      - name: Execute final W3 UI in headless Chrome
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser"

          network="hermes-w3-browser-${GITHUB_RUN_ID}"
          db="hermes-w3-db-${GITHUB_RUN_ID}"
          api="hermes-w3-api-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm -f "$api" "$db" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          cleanup

          docker network create "$network" >/dev/null
          docker run --detach --name "$db" --network "$network" \
            --env POSTGRES_USER=hermes \
            --env POSTGRES_PASSWORD=hermes \
            --env POSTGRES_DB=hermes_test \
            postgres:18.4 >/dev/null

          for attempt in $(seq 1 40); do
            if docker exec "$db" pg_isready -U hermes -d hermes_test >/dev/null 2>&1; then
              break
            fi
            test "$attempt" -lt 40
            sleep 1
          done

          docker run --detach --name "$api" --network "$network" \
            --publish 127.0.0.1:18080:8000 \
            --env DATABASE_URL="postgresql+psycopg://hermes:hermes@${db}:5432/hermes_test" \
            --entrypoint /bin/sh \
            hermes-deals:w3-ci -eu -c \
            'python -m alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1' >/dev/null

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null 2>&1; then
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' "$api" 2>/dev/null | grep -qx true; then
              docker logs "$api"
              exit 1
            fi
            test "$attempt" -lt 60
            sleep 1
          done

          "$browser" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=5000 \
            --dump-dom \
            http://127.0.0.1:18080/ui > /tmp/hermes-w3-ui.dom.html

          grep -Fq 'data-hermes-ui-script="HERMES_UI_SCRIPT_OPEN:"' /tmp/hermes-w3-ui.dom.html
          grep -Fq 'data-hermes-ui-bootstrap="w3-behavior-preserving-bootstrap-v1"' /tmp/hermes-w3-ui.dom.html
          grep -Fq 'Raw deal nav automātiski tas pats produkts citā veikalā. Canonical salīdzināšana notiek tikai pēc apstiprinātas identity saites.' /tmp/hermes-w3-ui.dom.html
          grep -Fq 'Nav papildu filtru.' /tmp/hermes-w3-ui.dom.html
          echo "HERMES_UI_W3_BROWSER_SMOKE=PASS"

  backend-tests:
    name: Backend tests
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan complete Git history for credentials
        working-directory: ${{ github.workspace }}
        run: |
          bash scripts/run-gitleaks.sh "$GITHUB_WORKSPACE"

      - name: Audit public-repository workflow safety
        working-directory: ${{ github.workspace }}
        run: |
          python3 scripts/audit-public-workflow-safety.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/locks/ci-py311.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r locks/ci-py311.txt
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests alembic

      - name: Run complete test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -q

  postgres-current-deals:
    name: PostgreSQL 18 current-deals contract
    needs: classify
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+psycopg://hermes:hermes@localhost:5432/hermes_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/locks/ci-py311.txt

      - name: Install hash-locked dependencies
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r locks/ci-py311.txt
          python -m pip check

      - name: Apply database migrations
        run: |
          python -m alembic upgrade head

      - name: Run PostgreSQL current-deals contracts
        run: |
          python -m pytest -q -s \
            tests/test_current_deals_sql_postgresql_contract.py \
            tests/test_current_deals_sql_postgresql_runtime.py \
            tests/test_current_deals_postgresql_materialization_benchmark.py \
            tests/test_lidl_v631_c3_readonly_preflight.py

  fast-lane-merge-gate:
    name: FAST-LANE Merge Gate
    needs: [classify, frontend-build, release-image, backend-tests, postgres-current-deals]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required validation results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          FRONTEND_RESULT: ${{ needs.frontend-build.result }}
          RELEASE_RESULT: ${{ needs.release-image.result }}
          BACKEND_RESULT: ${{ needs.backend-tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres-current-deals.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$FRONTEND_RESULT" == skipped ]]
            [[ "$RELEASE_RESULT" == skipped ]]
            [[ "$BACKEND_RESULT" == skipped ]]
            [[ "$POSTGRES_RESULT" == skipped ]]
          else
            [[ "$FRONTEND_RESULT" == success ]]
            [[ "$RELEASE_RESULT" == success ]]
            [[ "$BACKEND_RESULT" == success ]]
            [[ "$POSTGRES_RESULT" == success ]]
          fi
          echo "FAST_LANE_MERGE_GATE=PASS"
