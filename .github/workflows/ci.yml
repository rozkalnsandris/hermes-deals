name: Hermes Deals CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-deals-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests alembic

      - name: Run complete test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -q

  postgres-current-deals:
    name: PostgreSQL 18 current-deals contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: hermes
          POSTGRES_PASSWORD: hermes
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermes -d hermes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql+psycopg://hermes:hermes@localhost:5432/hermes_test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Apply database migrations
        run: |
          python -m alembic upgrade head

      - name: Run PostgreSQL current-deals contracts
        run: |
          python -m pytest -q -s \
            tests/test_current_deals_sql_postgresql_contract.py \
            tests/test_current_deals_sql_postgresql_runtime.py \
            tests/test_current_deals_sql_postgresql_scale.py

  rpi5-current-deals-readonly:
    name: RPi5 production current-deals read-only
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 225 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-release
    timeout-minutes: 5

    steps:
      - name: Measure local production endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime
          import json
          import re
          from time import perf_counter
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          base = "http://127.0.0.1:9128"
          as_of = datetime.now(ZoneInfo("Europe/Berlin")).date().isoformat()
          expected_engine = "sql-ranked-requested-view"

          def fetch(path: str):
              request = Request(
                  base + path,
                  headers={
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "hermes-deals-rpi5-readonly-diagnostic/1",
                  },
              )
              started = perf_counter()
              with urlopen(request, timeout=10) as response:
                  body = response.read()
                  wall_ms = (perf_counter() - started) * 1000
                  return response.status, response.headers, body, wall_ms

          health_status, _, health_body, health_wall_ms = fetch("/api/health")
          health = json.loads(health_body)
          print(
              "RPI5_HEALTH "
              f"status={health_status} "
              f"wall_ms={health_wall_ms:.2f} "
              f"service={health.get('service')} "
              f"version={health.get('version')}"
          )

          measurements = []
          for sort in (
              "name",
              "price_asc",
              "price_desc",
              "newest",
              "discount_desc",
          ):
              query = urlencode(
                  {
                      "as_of": as_of,
                      "view": "current",
                      "sort": sort,
                      "offset": 0,
                      "limit": 12,
                  }
              )
              status, headers, body, wall_ms = fetch(
                  f"/api/v1/deals/current?{query}"
              )
              payload = json.loads(body)
              timing = headers.get("Server-Timing", "")
              match = re.search(
                  r"current-deals-sql;dur=([0-9.]+)",
                  timing,
              )
              row = {
                  "sort": sort,
                  "status": status,
                  "wall_ms": wall_ms,
                  "server_ms": float(match.group(1)) if match else None,
                  "engine": headers.get(
                      "X-Hermes-Current-Deals-Engine",
                      "",
                  ),
                  "available": payload.get("available_count"),
                  "returned": payload.get("count"),
              }
              measurements.append(row)
              print(
                  "RPI5_CURRENT_DEALS "
                  f"sort={sort} "
                  f"status={status} "
                  f"wall_ms={wall_ms:.2f} "
                  f"server_ms={row['server_ms']} "
                  f"engine={row['engine'] or '(missing)'} "
                  f"available={row['available']} "
                  f"returned={row['returned']}"
              )

          query = urlencode(
              {
                  "as_of": as_of,
                  "view": "current",
                  "sort": "name",
                  "offset": 0,
                  "limit": 12,
              }
          )
          status, headers, body, warm_wall_ms = fetch(
              f"/api/v1/deals/current?{query}"
          )
          warm_payload = json.loads(body)
          warm_timing = headers.get("Server-Timing", "")
          warm_match = re.search(
              r"current-deals-sql;dur=([0-9.]+)",
              warm_timing,
          )
          warm_server_ms = (
              float(warm_match.group(1)) if warm_match else None
          )
          warm_engine = headers.get(
              "X-Hermes-Current-Deals-Engine",
              "",
          )
          print(
              "RPI5_CURRENT_DEALS_WARM "
              f"status={status} "
              f"wall_ms={warm_wall_ms:.2f} "
              f"server_ms={warm_server_ms} "
              f"engine={warm_engine or '(missing)'} "
              f"available={warm_payload.get('available_count')} "
              f"returned={warm_payload.get('count')}"
          )

          assert health_status == 200
          assert health.get("status") == "ok"
          assert all(row["status"] == 200 for row in measurements)
          assert {row["engine"] for row in measurements} == {expected_engine}
          assert warm_engine == expected_engine
          assert all(row["server_ms"] is not None for row in measurements)
          assert max(row["wall_ms"] for row in measurements) < 1000.0
          assert status == 200
          assert warm_server_ms is not None
          assert warm_wall_ms < 250.0
          PY
