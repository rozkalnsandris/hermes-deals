name: Hermes Deals CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: hermes-deals-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests alembic

      - name: Run complete test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -q

  apply-branding-once:
    name: Apply branding once
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/branding-deals-217' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout branding branch
        uses: actions/checkout@v5
        with:
          ref: chore/branding-deals-217
          fetch-depth: 0
      - name: Apply and commit Deals branding
        run: |
          set -Eeuo pipefail
          python tools/apply_deals_branding_once.py
          rm -f tools/apply_deals_branding_once.py
          rm -f .github/workflows/apply-branding-once.yml
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate Deals project branding (#217) [branding-applied]"
          git push origin HEAD:chore/branding-deals-217
