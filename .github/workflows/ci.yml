name: Hermes Deals CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: hermes-deals-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  issue-46-bootstrap:
    name: Issue 46 bootstrap
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'rozkalnsandris' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/ui-temporary-api-errors'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v5
        with:
          ref: fix/ui-temporary-api-errors
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply exact UI patch once
        run: |
          if test -f backend/tests/test_ui_api_error_handling.py; then
            echo "issue_46_patch_already_present=true"
          else
            python tools/apply_issue_46_ui_error_fix.py
          fi

      - name: Check JavaScript syntax
        run: node --check backend/app/ui/app.js

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Run focused regression when present
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          if test -f tests/test_ui_api_error_handling.py; then
            python -m pytest -q tests/test_ui_api_error_handling.py
          fi

      - name: Commit generated UI fix when needed
        run: |
          if git diff --quiet -- backend/app/ui/app.js backend/tests/test_ui_api_error_handling.py; then
            echo "issue_46_commit_needed=false"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- backend/app/ui/app.js backend/tests/test_ui_api_error_handling.py
          git diff --cached --check
          git commit -m "fix: localize temporary API failures"
          git push origin HEAD:fix/ui-temporary-api-errors

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Compile Python sources
        run: |
          python -m compileall -q app tests alembic

      - name: Run complete test suite
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m pytest -q
