name: Sync issue 32 candidate with current main

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  sync-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/issue-32-ui-regressions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest==8.4.1
          python -m pip check

      - name: Run complete backend suite
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: |
          python -m compileall -q app tests alembic
          python -m pytest -q

      - name: Remove temporary workflow and publish merge
        run: |
          rm -- .github/workflows/issue-32-sync-main.yml
          git add -- .github/workflows/issue-32-sync-main.yml
          git diff --cached --check
          git commit --amend --no-edit
          git push origin HEAD:${{ github.head_ref }}
