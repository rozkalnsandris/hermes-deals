name: ALDI A3.0 source discovery RPi5

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged pull request that registered the ALDI source-discovery audit
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: hermes-deals-aldi-a30-source-discovery
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize owner and merged PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.auth.outputs.pr_number }}
      sha: ${{ steps.auth.outputs.sha }}
      actor: ${{ steps.auth.outputs.actor }}
    steps:
      - name: Verify exact owner-authorized merged PR
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          PR_INPUT: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit(f"unexpected repository: {repo}")
          if os.environ["ACTOR"] != "rozkalnsandris" or os.environ["ACTOR_ID"] != "277435981":
              raise SystemExit("workflow actor is not the allowlisted owner")
          raw = os.environ["PR_INPUT"].strip()
          if not raw.isdigit():
              raise SystemExit("pr_number must be numeric")
          number = int(raw)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-aldi-a30-source-authorizer",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          pr = get(f"https://api.github.com/repos/{repo}/pulls/{number}")
          if not pr.get("merged") or not pr.get("merged_at"):
              raise SystemExit("audit accepts only merged pull requests")
          if pr["base"]["ref"] != "main" or pr["base"]["repo"]["full_name"] != repo:
              raise SystemExit("pull request was not merged into repository main")
          sha = str(pr.get("merge_commit_sha") or "")
          if len(sha) != 40:
              raise SystemExit("merged pull request SHA is invalid")
          comparison = get(f"https://api.github.com/repos/{repo}/compare/{sha}...main")
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("merged SHA is not reachable from current main")
          tree = get(f"https://api.github.com/repos/{repo}/git/trees/{sha}?recursive=1")
          paths = {item.get("path") for item in tree.get("tree", []) if item.get("type") == "blob"}
          required = {
              "tools/aldi_a30_source_discovery.py",
              "tools/run-hermes-deals-aldi-a30-source-discovery-v04.sh",
              "tools/runner/aldi-a30-source-discovery-dispatcher.sh",
              "tools/runner/install-aldi-a30-source-discovery-dispatcher.sh",
              ".github/workflows/aldi-a30-source-discovery-rpi5.yml",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"registered audit files are missing: {missing}")
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"pr_number={number}\nsha={sha}\nactor={os.environ['ACTOR']}\n")
          PY

  rpi5-audit:
    name: Discover official ALDI current and preview sources
    needs: authorize
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 30
    steps:
      - name: Run fixed root-owned dispatcher
        id: dispatch
        env:
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export_dir="${RUNNER_TEMP}/hermes-deals-aldi-a30-source-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$export_dir"
          echo "artifact_dir=$export_dir" >> "$GITHUB_OUTPUT"
          set +e
          sudo --non-interactive /usr/local/sbin/hermes-deals-aldi-a30-source-discovery-dispatch \
            "$REGISTERED_SHA" "$export_dir" \
            2>&1 | tee "$export_dir/runner-dispatch.log"
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > "$export_dir/runner-dispatch-exit-code.txt"
          printf 'audit=aldi-a30-source-discovery\ncommit_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$REGISTERED_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$export_dir/runner-request.txt"
          exit "$rc"

      - name: Upload sanitized evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@v6
        with:
          name: aldi-a30-source-discovery-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 30

  report:
    name: Report result to registered PR
    needs:
      - authorize
      - rpi5-audit
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment audit result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
          TRIGGER_ACTOR: ${{ needs.authorize.outputs.actor }}
          RPI5_RESULT: ${{ needs.rpi5-audit.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          number = int(os.environ["PR_NUMBER"])
          body = (
              f"<!-- aldi-a30-source-discovery:{os.environ['RUN_ID']}:{os.environ['RUN_ATTEMPT']} -->\n"
              "## ALDI A3.0 source discovery audit\n\n"
              f"- Trigger actor: `{os.environ['TRIGGER_ACTOR']}`\n"
              f"- RPi5 result: **{os.environ['RPI5_RESULT']}**\n"
              f"- Registered commit: `{os.environ['REGISTERED_SHA']}`\n"
              f"- Workflow run: {os.environ['SERVER_URL']}/{repo}/actions/runs/{os.environ['RUN_ID']}/attempts/{os.environ['RUN_ATTEMPT']}\n"
              f"- Artifact: `aldi-a30-source-discovery-{os.environ['REGISTERED_SHA']}-run-{os.environ['RUN_ID']}`\n"
              "- Full page acquisition: **false**\n"
              "- Rollover comparison: **false**\n"
              "- Production database write: **false**\n"
              "- Production deployment: **not authorized**\n"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "hermes-deals-aldi-a30-source-reporter",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected comment response: {response.status}")
          PY
