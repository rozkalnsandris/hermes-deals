name: Netto hz33 full-page parent-unit audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/netto-parent-unit-hz33-audit.yml
      - tools/netto_full_page_parent_unit_audit.py
  pull_request_target:
    types:
      - labeled

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: hermes-deals-netto-hz33-parent-unit-audit
  cancel-in-progress: false

jobs:
  ensure-label:
    name: Ensure parent-unit audit label
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or reconcile owner-gated label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          label = {
              "name": "audit:netto-parent-unit-v1",
              "color": "5319e7",
              "description": "Run the frozen hz33 full-page parent-unit research audit",
          }
          repo, token = os.environ["REPOSITORY"], os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "hermes-deals-netto-parent-unit-label",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          encoded = urllib.parse.quote(label["name"], safe="")
          payload = json.dumps(label).encode()
          try:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/labels/{encoded}",
                  data=payload, method="PATCH", headers=headers,
              )
              urllib.request.urlopen(request, timeout=20).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/labels",
                  data=payload, method="POST", headers=headers,
              )
              urllib.request.urlopen(request, timeout=20).close()
          PY

  authorize:
    name: Authorize merged-PR parent-unit audit
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'audit:netto-parent-unit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      pr_number: ${{ steps.auth.outputs.pr_number }}
      actor: ${{ steps.auth.outputs.actor }}
    steps:
      - name: Validate owner, merged PR and main ancestry
        id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: "277435981"
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals" or os.environ["WORKFLOW_REF"] != "refs/heads/main":
              raise SystemExit("unexpected repository/workflow ref")
          event = json.loads(pathlib.Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          sender = event.get("sender") or {}
          if sender.get("login") != os.environ["EXPECTED_OWNER_LOGIN"] or sender.get("id") != int(os.environ["EXPECTED_OWNER_ID"]):
              raise SystemExit("parent-unit audit actor is not repository owner")
          number = int((event.get("pull_request") or {}).get("number") or 0)
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "hermes-deals-netto-parent-unit-authorizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  return json.load(response)
          pr = get(f"https://api.github.com/repos/{repo}/pulls/{number}")
          if not pr.get("merged") or not pr.get("merged_at"):
              raise SystemExit("parent-unit audit accepts only merged pull requests")
          if pr["base"]["ref"] != "main" or pr["base"]["repo"]["full_name"] != repo:
              raise SystemExit("pull request was not merged into repository main")
          sha = str(pr.get("merge_commit_sha") or "")
          if len(sha) != 40:
              raise SystemExit("merged pull request SHA is invalid")
          comparison = get(f"https://api.github.com/repos/{repo}/compare/{sha}...main")
          if comparison.get("status") not in {"ahead", "identical"}:
              raise SystemExit("parent-unit audit implementation is not reachable from current main")
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"sha={sha}\npr_number={number}\nactor={sender['login']}\n")
          PY

  audit:
    name: Run exact hz33 parent-unit baseline
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      audit_sha256: ${{ steps.run.outputs.audit_sha256 }}
      candidate_freeze_sha256: ${{ steps.run.outputs.candidate_freeze_sha256 }}
      assigned_group_count: ${{ steps.run.outputs.assigned_group_count }}
      assigned_parent_count: ${{ steps.run.outputs.assigned_parent_count }}
      parent_precision: ${{ steps.run.outputs.parent_precision }}
      multi_parent_precision: ${{ steps.run.outputs.multi_parent_precision }}
      decision: ${{ steps.run.outputs.decision }}
      artifact_name: ${{ steps.run.outputs.artifact_name }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    env:
      UPSTREAM_RUN_ID: "31324156565"
      UPSTREAM_ARTIFACT: netto-heldout-github-c0701d76bfa6412cbf89b4bf9816a68ccb3c2ab8-run-31324156565
      UPSTREAM_ARTIFACT_DIGEST: sha256:cc289165aaac8796b33391917edb03df1085a841b82d17fc08aa93efa1d66ec4
      UPSTREAM_ARTIFACT_BYTES: "37892979"
      EXPECTED_SOURCE_EVIDENCE_SHA256: 49e22d29b16eacf0d316f20105de2c25e3d9b3c2ae231d0bd24d0d18036f5fd4
      EXPECTED_PREDICTIONS_SHA256: 70c3c8abace632f6be298abb5d02b398b3e8b91e8d53565b21eface536ed7b94
      EXPECTED_CAPTURE_SUMS_SHA256: 9711f54387a02c1e3d18fa979acca599166b860c3d823fa1b66c318e580c1f9d
      EXPECTED_FREEZE_FILE_SHA256: 977479c653424a0daea187045828141e8224b059a5d13f2bd1c772837deb3bf3
      EXPECTED_FREEZE_RECEIPT_FILE_SHA256: 7b4265208ce6c4c8fb2539e952b5fc1b17e25ad1d5c781b3ac22f0c0267a47fe
      EXPECTED_LOGICAL_FREEZE_SHA256: 38bb9445ad5f2c3cc0159bd4332a4138f1d81cab03591de0542825b3f88db087
    steps:
      - name: Checkout exact reviewed audit merge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify exact pre-truth capture ZIP
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          zip_path="${RUNNER_TEMP}/netto-parent-unit-upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"
          ZIP_PATH="$zip_path" python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.parse, urllib.request
          repo = os.environ["REPOSITORY"]
          run_id = os.environ["UPSTREAM_RUN_ID"]
          name = os.environ["UPSTREAM_ARTIFACT"]
          expected_digest = os.environ["UPSTREAM_ARTIFACT_DIGEST"]
          expected_bytes = int(os.environ["UPSTREAM_ARTIFACT_BYTES"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "hermes-deals-netto-parent-unit-upstream",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          encoded = urllib.parse.quote(name, safe="")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?name={encoded}", headers=headers,
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              artifacts = (json.load(response).get("artifacts") or [])
          if len(artifacts) != 1:
              raise SystemExit(f"expected exactly one upstream artifact, found {len(artifacts)}")
          artifact = artifacts[0]
          if artifact.get("name") != name or artifact.get("expired") is not False:
              raise SystemExit("upstream artifact identity/expiry mismatch")
          if artifact.get("digest") != expected_digest or int(artifact.get("size_in_bytes") or 0) != expected_bytes:
              raise SystemExit("upstream artifact digest/size mismatch")
          if str((artifact.get("workflow_run") or {}).get("id")) != run_id:
              raise SystemExit("upstream workflow run mismatch")

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          archive_request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip", headers=headers,
          )
          opener = urllib.request.build_opener(NoRedirect)
          try:
              opener.open(archive_request, timeout=20)
              raise SystemExit("artifact endpoint unexpectedly did not redirect")
          except urllib.error.HTTPError as error:
              if error.code not in {301, 302, 303, 307, 308}:
                  raise
              location = error.headers.get("Location")
          if not location:
              raise SystemExit("artifact redirect is missing")
          path = pathlib.Path(os.environ["ZIP_PATH"])
          digest = hashlib.sha256(); size = 0
          with urllib.request.urlopen(location, timeout=120) as response, path.open("xb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk); digest.update(chunk); size += len(chunk)
          if f"sha256:{digest.hexdigest()}" != expected_digest or size != expected_bytes:
              path.unlink(missing_ok=True)
              raise SystemExit("downloaded artifact digest/size mismatch")
          print(f"UPSTREAM_ARTIFACT_ID={artifact['id']}")
          PY

      - name: Extract only frozen parent-audit inputs
        id: safe
        env:
          ZIP_PATH: ${{ steps.upstream.outputs.zip_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          safe_root="${RUNNER_TEMP}/netto-parent-unit-safe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "root=$safe_root" >> "$GITHUB_OUTPUT"
          SAFE_ROOT="$safe_root" python3 - <<'PY'
          import os, pathlib, shutil, stat, zipfile
          source = pathlib.Path(os.environ["ZIP_PATH"])
          destination = pathlib.Path(os.environ["SAFE_ROOT"])
          destination.mkdir(mode=0o700)
          allowed = {
              "SHA256SUMS",
              "capture/SHA256SUMS",
              "capture/freeze-manifest.json",
              "capture/freeze-receipt.json",
              "capture/source-evidence.json",
              "capture/predictions.json",
          }
          with zipfile.ZipFile(source) as archive:
              infos = archive.infolist()
              if len(infos) != 15:
                  raise SystemExit(f"unexpected upstream archive member count: {len(infos)}")
              if len({info.filename for info in infos}) != len(infos):
                  raise SystemExit("duplicate upstream archive member name")
              names = {info.filename for info in infos}
              if not allowed.issubset(names):
                  raise SystemExit("required parent-audit inputs are missing")
              for info in infos:
                  pure = pathlib.PurePosixPath(info.filename)
                  mode = (info.external_attr >> 16) & 0xFFFF
                  if (
                      info.is_dir() or info.filename.startswith("/") or "\\" in info.filename
                      or any(part in {"", ".", ".."} for part in pure.parts)
                      or stat.S_ISLNK(mode) or stat.S_ISCHR(mode) or stat.S_ISBLK(mode)
                      or stat.S_ISFIFO(mode) or stat.S_ISSOCK(mode)
                  ):
                      raise SystemExit(f"unsafe upstream archive member: {info.filename}")
              for name in sorted(allowed):
                  target = destination.joinpath(*pathlib.PurePosixPath(name).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(name) as src, target.open("xb") as dst:
                      shutil.copyfileobj(src, dst)
          source.unlink()
          PY

      - name: Verify frozen input SHA chain
        env:
          SAFE_ROOT: ${{ steps.safe.outputs.root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["SAFE_ROOT"])
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          expected = {
              "capture/SHA256SUMS": os.environ["EXPECTED_CAPTURE_SUMS_SHA256"],
              "capture/freeze-manifest.json": os.environ["EXPECTED_FREEZE_FILE_SHA256"],
              "capture/freeze-receipt.json": os.environ["EXPECTED_FREEZE_RECEIPT_FILE_SHA256"],
              "capture/source-evidence.json": os.environ["EXPECTED_SOURCE_EVIDENCE_SHA256"],
              "capture/predictions.json": os.environ["EXPECTED_PREDICTIONS_SHA256"],
          }
          for rel, digest in expected.items():
              if sha(root / rel) != digest:
                  raise SystemExit(f"frozen parent-audit input SHA mismatch: {rel}")
          root_sums = {}
          for line in (root / "SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, rel = line.split(None, 1)
              root_sums[rel.removeprefix("./")] = digest
          for rel, digest in expected.items():
              if root_sums.get(rel) != digest:
                  raise SystemExit(f"root SHA256SUMS mismatch: {rel}")
          capture_sums = {}
          for line in (root / "capture/SHA256SUMS").read_text(encoding="utf-8").splitlines():
              digest, rel = line.split(None, 1)
              capture_sums[rel] = digest
          for name, digest in {
              "source-evidence.json": os.environ["EXPECTED_SOURCE_EVIDENCE_SHA256"],
              "predictions.json": os.environ["EXPECTED_PREDICTIONS_SHA256"],
              "freeze-manifest.json": os.environ["EXPECTED_FREEZE_FILE_SHA256"],
              "freeze-receipt.json": os.environ["EXPECTED_FREEZE_RECEIPT_FILE_SHA256"],
          }.items():
              if capture_sums.get(name) != digest:
                  raise SystemExit(f"capture SHA256SUMS mismatch: {name}")
          manifest = json.loads((root / "capture/freeze-manifest.json").read_text(encoding="utf-8"))
          receipt = json.loads((root / "capture/freeze-receipt.json").read_text(encoding="utf-8"))
          if manifest.get("source_sha256") != "e38bfa550ce64aae0d2cefcec307ca4126c8753374a64d76cc2684a98b788bcb":
              raise SystemExit("freeze source identity mismatch")
          if manifest.get("predictions_sha256") != os.environ["EXPECTED_PREDICTIONS_SHA256"]:
              raise SystemExit("freeze prediction identity mismatch")
          if manifest.get("truth_sha256") is not None or manifest.get("adjudication_sha256") is not None:
              raise SystemExit("pre-truth freeze unexpectedly contains truth/adjudication")
          if receipt.get("freeze_manifest_sha256") != os.environ["EXPECTED_LOGICAL_FREEZE_SHA256"]:
              raise SystemExit("logical freeze identity mismatch")
          PY

      - name: Run deterministic parent-unit baseline audit
        id: run
        env:
          SAFE_ROOT: ${{ steps.safe.outputs.root }}
        shell: bash
        run: |
          set -Eeuo pipefail
          output="${RUNNER_TEMP}/netto-parent-unit-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$output"
          result="$(python3 tools/netto_full_page_parent_unit_audit.py \
            --source-evidence "${SAFE_ROOT}/capture/source-evidence.json" \
            --predictions "${SAFE_ROOT}/capture/predictions.json" \
            --truth evidence/netto/heldout/hz33/completed-independent-source-truth-ledger.json.gz.b64 \
            --output "$output/parent-unit-audit.json")"
          printf '%s\n' "$result"
          digest="$(sha256sum "$output/parent-unit-audit.json" | cut -d' ' -f1)"
          printf '%s  parent-unit-audit.json\n' "$digest" > "$output/SHA256SUMS"
          echo "output=$output" >> "$GITHUB_OUTPUT"
          echo "artifact_name=netto-hz33-parent-unit-audit-run-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          RESULT_JSON="$result" OUTPUT_JSON="$output/parent-unit-audit.json" python3 - "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, sys
          summary = json.loads(os.environ["RESULT_JSON"])
          payload = json.loads(pathlib.Path(os.environ["OUTPUT_JSON"]).read_text(encoding="utf-8"))
          evaluation = payload["evaluation"]
          if evaluation.get("promotion_ready") is not False or evaluation.get("review_only") is not True:
              raise SystemExit("parent-unit audit crossed promotion boundary")
          with pathlib.Path(sys.argv[1]).open("a", encoding="utf-8") as handle:
              handle.write(f"audit_sha256={summary['audit_sha256']}\n")
              handle.write(f"candidate_freeze_sha256={summary['candidate_freeze_sha256']}\n")
              handle.write(f"assigned_group_count={summary['assigned_group_count']}\n")
              handle.write(f"assigned_parent_count={summary['assigned_parent_count']}\n")
              handle.write(f"parent_precision={summary['safe_single_parent_precision']}\n")
              handle.write(f"multi_parent_precision={summary['multi_group_safe_single_precision']}\n")
              handle.write(f"decision={summary['decision']}\n")
          PY

      - name: Upload parent-unit audit artifact
        id: upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.run.outputs.artifact_name }}
          path: ${{ steps.run.outputs.output }}
          if-no-files-found: error
          retention-days: 14

  report:
    name: Report hz33 parent-unit baseline
    needs:
      - authorize
      - audit
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment result and clear trigger label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.authorize.outputs.pr_number }}
          ACTOR: ${{ needs.authorize.outputs.actor }}
          REGISTERED_SHA: ${{ needs.authorize.outputs.sha }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          AUDIT_SHA256: ${{ needs.audit.outputs.audit_sha256 }}
          CANDIDATE_SHA256: ${{ needs.audit.outputs.candidate_freeze_sha256 }}
          ASSIGNED_GROUPS: ${{ needs.audit.outputs.assigned_group_count }}
          ASSIGNED_PARENTS: ${{ needs.audit.outputs.assigned_parent_count }}
          PARENT_PRECISION: ${{ needs.audit.outputs.parent_precision }}
          MULTI_PARENT_PRECISION: ${{ needs.audit.outputs.multi_parent_precision }}
          DECISION: ${{ needs.audit.outputs.decision }}
          ARTIFACT_NAME: ${{ needs.audit.outputs.artifact_name }}
          ARTIFACT_ID: ${{ needs.audit.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.audit.outputs.artifact_digest }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          repo, number = os.environ["REPOSITORY"], int(os.environ["PR_NUMBER"])
          label = "audit:netto-parent-unit-v1"
          body = (
              "## Netto hz33 full-page parent-unit baseline\n\n"
              f"- Trigger actor: `{os.environ['ACTOR']}`\n"
              f"- Audit job: **{os.environ['AUDIT_RESULT']}**\n"
              f"- Implementation commit: `{os.environ['REGISTERED_SHA']}`\n"
              f"- Workflow run ID: `{os.environ['RUN_ID']}`\n"
              f"- Artifact: `{os.environ['ARTIFACT_NAME'] or 'not-created'}` (ID `{os.environ['ARTIFACT_ID'] or 'unavailable'}`)\n"
              f"- Artifact digest: `{os.environ['ARTIFACT_DIGEST'] or 'unavailable'}`\n"
              f"- Audit SHA256: `{os.environ['AUDIT_SHA256'] or 'unavailable'}`\n"
              f"- Candidate freeze SHA256: `{os.environ['CANDIDATE_SHA256'] or 'unavailable'}`\n"
              f"- Assigned groups / parents: `{os.environ['ASSIGNED_GROUPS'] or 'unknown'}` / `{os.environ['ASSIGNED_PARENTS'] or 'unknown'}`\n"
              f"- Safe-single parent precision: `{os.environ['PARENT_PRECISION'] or 'unknown'}`\n"
              f"- Multi-group safe-single precision: `{os.environ['MULTI_PARENT_PRECISION'] or 'unknown'}`\n"
              f"- Decision: **{os.environ['DECISION'] or 'unknown'}**\n"
              "- Promotion ready: **false**\n"
              "- Parser behavior changed: **false**\n"
              "- Production deployment: **not authorized**\n"
              "- Database/Review writes: **not authorized**\n"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Content-Type": "application/json",
              "User-Agent": "hermes-deals-netto-parent-unit-reporter",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments",
              data=json.dumps({"body": body}).encode(), method="POST", headers=headers,
          )
          urllib.request.urlopen(request, timeout=20).close()
          remove = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/labels/{urllib.parse.quote(label, safe='')}",
              method="DELETE", headers=headers,
          )
          try:
              urllib.request.urlopen(remove, timeout=20).close()
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          PY
