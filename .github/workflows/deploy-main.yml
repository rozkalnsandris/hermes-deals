name: Deploy current main to production

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: hermes-deals-production
  cancel-in-progress: false

jobs:
  check:
    name: Check exact main and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      ci_run_id: ${{ steps.check.outputs.ci_run_id }}

    steps:
      - name: Verify current main has successful push CI
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["WORKFLOW_SHA"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit("unexpected repository")
          if os.environ["WORKFLOW_REF"] != "refs/heads/main":
              raise SystemExit("deploy workflow must run from main")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("workflow SHA is invalid")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-main-deploy",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          main = get_json(f"https://api.github.com/repos/{repo}/branches/main")
          current_main = str(main.get("commit", {}).get("sha", ""))
          if current_main != sha:
              raise SystemExit("workflow SHA is stale; rerun from current main")

          encoded = urllib.parse.quote(sha, safe="")
          runs = get_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs"
              f"?branch=main&head_sha={encoded}&status=completed&per_page=100"
          ).get("workflow_runs", [])
          successful = [
              run for run in runs
              if run.get("event") == "push"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == sha
              and run.get("conclusion") == "success"
          ]
          if not successful:
              raise SystemExit("current main has no successful push CI run")
          ci_run_id = max(int(run["id"]) for run in successful)

          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"sha={sha}\n")
              handle.write(f"ci_run_id={ci_run_id}\n")
          pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "## Deploy check passed\n\n"
              f"- Exact current main: `{sha}`\n"
              f"- Successful push CI: `{ci_run_id}`\n"
              "- Next step: deploy on the existing RPi5 self-hosted runner\n",
              encoding="utf-8",
          )
          PY

  deploy:
    name: Deploy on RPi5
    needs: check
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-release
    timeout-minutes: 45

    steps:
      - name: Deploy exact current main
        id: deploy
        env:
          TARGET_SHA: ${{ needs.check.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/hermes-deals-main-deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$evidence_dir"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"
          sudo --non-interactive /usr/local/sbin/hermes-deals-deploy-main \
            "$TARGET_SHA" \
            "$evidence_dir"

      - name: Verify public API and UI
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://deals.rozkalns.net/api/health >/dev/null
          ui_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 \
            https://deals.rozkalns.net/ui)"
          [[ "$ui_status" =~ ^(200|302)$ ]]
          printf 'PUBLIC_API_HEALTH=PASS\nPUBLIC_UI=PASS\n'

      - name: Upload deploy evidence
        if: always() && steps.deploy.outputs.evidence_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: production-deploy-${{ needs.check.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.deploy.outputs.evidence_dir }}
          if-no-files-found: warn
          retention-days: 30
