name: Hermes Lidl Gate B #906 frozen visual review pack

on:
  issue_comment:
    types:
      - created

permissions: {}

concurrency:
  group: hermes-lidl-gate-b-frozen-review-pack-906
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify #906 owner authorization and start signal
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 906 &&
      github.event.sender.login == 'rozkalnsandris' &&
      github.event.sender.id == 277435981 &&
      startsWith(github.event.comment.body, '/hermes-lidl-gate-b-frozen-review-pack-906 auth=')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      trigger_comment_id: ${{ steps.authorize.outputs.trigger_comment_id }}
      authorization_comment_id: ${{ steps.authorize.outputs.authorization_comment_id }}

    steps:
      - name: Verify exact one-shot authorization lineage
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          TRIGGER_BODY: ${{ github.event.comment.body }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          if repo != "rozkalnsandris/hermes-deals":
              raise SystemExit("unexpected repository")

          trigger_id = os.environ["TRIGGER_COMMENT_ID"]
          trigger_body = os.environ["TRIGGER_BODY"].strip()
          match = re.fullmatch(
              r"/hermes-lidl-gate-b-frozen-review-pack-906 auth=([1-9][0-9]*)",
              trigger_body,
          )
          if match is None:
              raise SystemExit("start signal does not match exact command contract")
          auth_id = match.group(1)
          if not trigger_id.isdigit() or int(trigger_id) <= 0:
              raise SystemExit("invalid trigger comment id")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "hermes-lidl-gate-b-frozen-review-pack-906-authorizer",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise SystemExit(f"unexpected GitHub status: {response.status}")
                  return json.load(response)

          auth = get_json(f"https://api.github.com/repos/{repo}/issues/comments/{auth_id}")
          if auth.get("id") != int(auth_id):
              raise SystemExit("authorization comment identity mismatch")
          if auth.get("issue_url") != f"https://api.github.com/repos/{repo}/issues/906":
              raise SystemExit("authorization comment issue mismatch")
          user = auth.get("user") or {}
          if user.get("login") != "rozkalnsandris" or user.get("id") != 277435981:
              raise SystemExit("authorization comment owner mismatch")

          body = str(auth.get("body") or "")
          required = (
              "LIDL-GATE-B-FROZEN-REVIEW-PACK-ONCE",
              "aktionsprospekt-26-10-2026-31-10-2026-fef8e1",
              "eb7de20caeb74f86b5a76c808986cb3f88beca0b67e3f01d6f9841e89ba18002",
              "PAGE-COUNT=76",
              "58b4d56eb87dd16ef4f07be77d4c32769993eddd4f5b2e563def532df0308894",
              "ONE_CONTROLLED_RENDER=true",
              "RPI5_EXECUTION_AUTHORIZED=true",
              "SELF_HOSTED_EXECUTION_AUTHORIZED=true",
              "CORPUS_WRITE=false",
              "CORPUS_REPLACEMENT=false",
              "PRODUCTION_DATABASE_WRITE=false",
              "REVIEW_WRITE=false",
              "PRODUCTION_PUBLISH=false",
              "PRODUCTION_DEPLOY=false",
              "SYSTEMD_CHANGE=false",
              "AUTOMATIC_RETRY=false",
              "GATE_C_D_AUTHORIZED=false",
          )
          for marker in required:
              if marker not in body:
                  raise SystemExit(f"authorization evidence mismatch: {marker[:72]}")

          page = 1
          marker = "<!-- hermes-lidl-gate-b-frozen-review-pack-906-status -->"
          consumed = False
          while True:
              params = urllib.parse.urlencode({"per_page": 100, "page": page})
              comments = get_json(
                  f"https://api.github.com/repos/{repo}/issues/906/comments?{params}"
              )
              if not isinstance(comments, list):
                  raise SystemExit("issue comments response is not a list")
              for comment in comments:
                  comment_body = str(comment.get("body") or "")
                  if marker in comment_body and f"authorization comment: \`{auth_id}\`" in comment_body:
                      consumed = True
                      break
              if consumed or len(comments) < 100:
                  break
              page += 1
              if page > 20:
                  raise SystemExit("issue comment pagination exceeded safety bound")
          if consumed:
              raise SystemExit("authorization comment was already consumed by a prior render attempt")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"trigger_comment_id={trigger_id}\n")
              handle.write(f"authorization_comment_id={auth_id}\n")
          PY

  render:
    name: Render exact frozen 76-page pack on RPi5
    needs:
      - authorize
    if: needs.authorize.result == 'success'
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - hermes-deals-audit
    timeout-minutes: 30
    permissions: {}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      source_pdf_sha256: ${{ steps.inspect.outputs.source_pdf_sha256 }}
      page_count: ${{ steps.inspect.outputs.page_count }}
      scan_tree_sha256: ${{ steps.inspect.outputs.scan_tree_sha256 }}
      render_tree_sha256: ${{ steps.inspect.outputs.render_tree_sha256 }}
      manifest_sha256: ${{ steps.inspect.outputs.manifest_sha256 }}
      renderer: ${{ steps.inspect.outputs.renderer }}

    steps:
      - name: Run fixed root-owned frozen review-pack dispatcher
        shell: bash
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          sudo --non-interactive /usr/local/sbin/hermes-deals-lidl-gate-b-frozen-review-pack-906 \
            "$GITHUB_RUN_ID_VALUE" "$GITHUB_RUN_ATTEMPT_VALUE"

      - name: Inspect sanitized frozen review-pack summary
        id: inspect
        shell: bash
        env:
          SUMMARY_PATH: /var/lib/hermes-deals/lidl-gate-b-frozen-review-pack-906/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["SUMMARY_PATH"])
          if not path.is_file() or path.is_symlink():
              raise SystemExit("sanitized summary is missing or unsafe")
          payload = json.loads(path.read_text(encoding="utf-8"))

          expected = {
              "schema_version": 1,
              "audit": "lidl-gate-b-frozen-review-pack-906",
              "result": "PASS",
              "flyer_key": "aktionsprospekt-26-10-2026-31-10-2026-fef8e1",
              "source_pdf_sha256": "eb7de20caeb74f86b5a76c808986cb3f88beca0b67e3f01d6f9841e89ba18002",
              "page_count": 76,
              "staging_scan_tree_sha256": "58b4d56eb87dd16ef4f07be77d4c32769993eddd4f5b2e563def532df0308894",
              "independent_render_replay": "BYTE_IDENTICAL_PASS",
          }
          for key, value in expected.items():
              if payload.get(key) != value:
                  raise SystemExit(f"sanitized summary mismatch: {key}")

          for key in ("render_tree_sha256", "manifest_sha256"):
              if re.fullmatch(r"[0-9a-f]{64}", str(payload.get(key) or "")) is None:
                  raise SystemExit(f"invalid digest: {key}")
          if not str(payload.get("renderer") or "").startswith("pdftoppm version "):
              raise SystemExit("unexpected renderer identity")

          expected_safety = {
              "private_evidence_write": True,
              "artifact_write": True,
              "source_content_exported": False,
              "raw_pdf_uploaded": False,
              "corpus_write": False,
              "corpus_replacement": False,
              "production_database_write": False,
              "review_write": False,
              "production_publish": False,
              "production_deploy": False,
              "systemd_change": False,
              "automatic_retry": False,
              "gate_c_d_authorized": False,
          }
          if payload.get("safety") != expected_safety:
              raise SystemExit("sanitized summary safety mismatch")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"source_pdf_sha256={payload['source_pdf_sha256']}\n")
              handle.write(f"page_count={payload['page_count']}\n")
              handle.write(f"scan_tree_sha256={payload['staging_scan_tree_sha256']}\n")
              handle.write(f"render_tree_sha256={payload['render_tree_sha256']}\n")
              handle.write(f"manifest_sha256={payload['manifest_sha256']}\n")
              handle.write(f"renderer={payload['renderer']}\n")
          PY

      - name: Upload sanitized 76-page review artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lidl-gate-b-frozen-review-pack-906-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/lib/hermes-deals/lidl-gate-b-frozen-review-pack-906/${{ github.run_id }}-${{ github.run_attempt }}/artifact
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

  report:
    name: Record #906 frozen visual review-pack status
    if: always() && needs.authorize.result == 'success'
    needs:
      - authorize
      - render
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Append sanitized one-shot status comment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHORIZATION_COMMENT_ID: ${{ needs.authorize.outputs.authorization_comment_id }}
          TRIGGER_COMMENT_ID: ${{ needs.authorize.outputs.trigger_comment_id }}
          RENDER_JOB_RESULT: ${{ needs.render.result }}
          ARTIFACT_ID: ${{ needs.render.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.render.outputs.artifact_digest }}
          SOURCE_PDF_SHA256: ${{ needs.render.outputs.source_pdf_sha256 }}
          PAGE_COUNT: ${{ needs.render.outputs.page_count }}
          SCAN_TREE_SHA256: ${{ needs.render.outputs.scan_tree_sha256 }}
          RENDER_TREE_SHA256: ${{ needs.render.outputs.render_tree_sha256 }}
          MANIFEST_SHA256: ${{ needs.render.outputs.manifest_sha256 }}
          RENDERER: ${{ needs.render.outputs.renderer }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = (
              os.environ.get("RENDER_JOB_RESULT") == "success"
              and os.environ.get("PAGE_COUNT") == "76"
              and bool(os.environ.get("ARTIFACT_ID"))
              and bool(os.environ.get("ARTIFACT_DIGEST"))
              and bool(os.environ.get("RENDER_TREE_SHA256"))
              and bool(os.environ.get("MANIFEST_SHA256"))
          )
          marker = "<!-- hermes-lidl-gate-b-frozen-review-pack-906-status -->\n"
          if success:
              state = "PASS"
              details = (
                  f"- source PDF SHA-256: \`{os.environ['SOURCE_PDF_SHA256']}\`\n"
                  f"- pages: \`{os.environ['PAGE_COUNT']}/76\`\n"
                  f"- staging scan tree SHA-256: \`{os.environ['SCAN_TREE_SHA256']}\`\n"
                  f"- render tree SHA-256: \`{os.environ['RENDER_TREE_SHA256']}\`\n"
                  f"- manifest SHA-256: \`{os.environ['MANIFEST_SHA256']}\`\n"
                  f"- renderer: \`{os.environ['RENDERER']}\`\n"
                  f"- artifact ID: \`{os.environ['ARTIFACT_ID']}\`\n"
                  f"- artifact digest: \`{os.environ['ARTIFACT_DIGEST']}\`\n"
                  "- independent render replay: \`BYTE_IDENTICAL_PASS\`\n"
              )
          else:
              state = "BLOCKED"
              details = f"- render job: \`{os.environ.get('RENDER_JOB_RESULT') or 'unknown'}\`\n"

          body = (
              marker
              + f"## Lidl Gate B #906 frozen visual review pack — {state}\n\n"
              + f"- authorization comment: \`{os.environ['AUTHORIZATION_COMMENT_ID']}\`\n"
              + f"- start-signal comment: \`{os.environ['TRIGGER_COMMENT_ID']}\`\n"
              + f"- workflow: {os.environ['RUN_URL']}\n"
              + details
              + "\nSafety: exact frozen PDF read + private render evidence + bounded JPEG/manifest artifact only. "
                "No corpus replacement/promotion, production DB/Review write, publication, deploy, systemd/retry or Gate C/D action."
          )

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/906/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "hermes-lidl-gate-b-frozen-review-pack-906-reporter",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 201:
                  raise SystemExit(f"unexpected issue-comment response: {response.status}")
          PY
