name: Apply issue 32 UI fix

on:
  push:
    branches:
      - fix/issue-32-ui-regressions
    paths:
      - .github/workflows/issue-32-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply audited UI changes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          from hashlib import sha256
          from pathlib import Path
          import re
          import sys

          root = Path.cwd()
          app_path = root / "backend/app/ui/app.js"
          style_path = root / "backend/app/ui/styles.css"
          index_path = root / "backend/app/ui/index.html"
          review_path = root / "backend/app/ui/review.html"
          static_test_path = root / "backend/tests/test_ui_static_assets.py"
          contract_path = root / "backend/tests/ui_contract.py"

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          app = app_path.read_text(encoding="utf-8")
          app = replace_once(
              app,
              r'''    function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}''',
              r'''    function todayLocal(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),values=Object.fromEntries(parts.map(part=>[part.type,part.value]));return `${values.year}-${values.month}-${values.day}`;}
    function isIsoDate(v){const value=String(v||""),m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(value);if(!m)return false;const date=new Date(Date.UTC(Number(m[1]),Number(m[2])-1,Number(m[3])));return !Number.isNaN(date.getTime())&&date.toISOString().slice(0,10)===value;}''',
              "Berlin today helper",
          )
          app = replace_once(
              app,
              r'''    function setAsOfIso(v){asOf.value=v;asOfDisplay.value=fmtDate(v);asOfPicker.value=v;}''',
              r'''    function setAsOfIso(v){const iso=isIsoDate(v)?String(v):todayLocal();asOf.value=iso;asOfDisplay.value=fmtDate(iso);asOfPicker.value=iso;}''',
              "validated as-of setter",
          )
          app = replace_once(
              app,
              'if(p.get("date"))setAsOfIso(p.get("date"));',
              'if(p.has("date"))setAsOfIso(p.get("date"));',
              "URL date restoration",
          )
          app = replace_once(
              app,
              r'''      function weeklyBerlinToday(){const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Berlin",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),values=Object.fromEntries(parts.map(part=>[part.type,part.value]));return `${values.year}-${values.month}-${values.day}`;}''',
              r'''      function weeklyBerlinToday(){return todayLocal();}''',
              "weekly Berlin date helper",
          )
          app = replace_once(
              app,
              r'''      function weeklyShortDate(iso){const date=weeklyDateFromIso(iso);return `${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.`;}''',
              r'''      function weeklyShortDate(iso){const date=weeklyDateFromIso(iso);return `${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.${date.getFullYear()}`;}''',
              "weekly full date format",
          )
          app = replace_once(
              app,
              r'''      function weeklyRangeText(start){const dates=weeklyDates(start),end=weeklyDateFromIso(dates[6]);return `${weeklyShortDate(dates[0])}–${String(end.getDate()).padStart(2,"0")}.${String(end.getMonth()+1).padStart(2,"0")}.${end.getFullYear()}`;}''',
              r'''      function weeklyRangeText(start){const dates=weeklyDates(start);return `${weeklyShortDate(dates[0])}–${weeklyShortDate(dates[6])}`;}''',
              "weekly full range format",
          )
          app_path.write_text(app, encoding="utf-8")

          styles = style_path.read_text(encoding="utf-8")
          sentinel = "Issue #32 mobile and date regression contract"
          if sentinel in styles:
              raise SystemExit("issue 32 stylesheet block already exists")
          close_marker = "  /*HERMES_UI_STYLE_CLOSE:PC9zdHlsZT4=*/"
          insert_at = styles.rfind(close_marker)
          if insert_at < 0:
              raise SystemExit("final UI style marker not found")
          issue_css = r'''
    /* Issue #32 mobile and date regression contract. */
    html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-overview,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-appbar,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-main-nav,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-app-actions,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-title-row,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-content-grid,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-detail-panel,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-summary-panel,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-store-card,
    body.ui-minimal-v2[data-ui-release="reference-v1"] #deals,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .toolbar,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .filter-panel,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .filter-summary,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .card,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .daily-special-card{min-width:0;max-width:100%}
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-date-control,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .date-entry{max-width:100%}
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-date-input,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .native-date-proxy{max-width:100%}
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-product-copy,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-product-name,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-continuing-name,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .product-name,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .brand-name,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .package,
    body.ui-minimal-v2[data-ui-release="reference-v1"] .filter-token{min-width:0;overflow-wrap:anywhere}
    @media(max-width:760px){
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-appbar{width:auto;min-width:0}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-app-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;min-width:0}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-select,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-date-control,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-header-date{width:100%;min-width:0}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-header-date span{min-width:0;overflow:hidden;text-overflow:ellipsis}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .filter-summary .reset-filters{width:100%;margin-left:0}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-legend,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .retailers{max-width:100%}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .bottom-nav{left:0;right:0;max-width:100%}
    }
    @media(max-width:520px){
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-product{grid-template-columns:48px minmax(0,1fr)}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-product-price{grid-column:2;justify-self:start;padding-top:0}
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-app-actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
    }
    @media(pointer:coarse){
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-nav-item,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-control-button,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .weekly-header-date,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .date-picker-button,
      body.ui-minimal-v2[data-ui-release="reference-v1"] .reset-filters{min-height:44px}
    }
'''
          styles = styles[:insert_at] + issue_css + styles[insert_at:]
          style_path.write_text(styles, encoding="utf-8")

          review = review_path.read_text(encoding="utf-8")
          review = replace_once(
              review,
              '<meta name="viewport" content="width=device-width,initial-scale=1">',
              '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">',
              "Review viewport",
          )
          review_sentinel = "Issue #32 Review mobile contract"
          if review_sentinel in review:
              raise SystemExit("issue 32 Review style block already exists")
          review_css = r'''
    /* Issue #32 Review mobile contract. */
    html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}
    main,.panel,.toolbar,#detail,.grid,.source,.preview-block,.actions{min-width:0;max-width:100%}
    .source,pre,.preview-note,.row strong{overflow-wrap:anywhere}
    .date-entry,.date-entry input{min-width:0;max-width:100%}
    .native-date-proxy{max-width:100%}
    button,input,select,textarea{max-width:100%}
    @media(max-width:820px){
      header{position:static;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
      main{width:100%;padding:10px max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
      #list{max-height:min(42vh,360px)}
      .detail-nav{position:sticky;top:0;flex-wrap:wrap}
      .actions.sticky-actions{padding-bottom:max(12px,env(safe-area-inset-bottom))}
      .grid{grid-template-columns:minmax(0,1fr)}
    }
    @media(max-width:560px){
      .toolbar>*{flex:1 1 100%;width:100%}
      .toolbar a{display:grid;min-height:44px;place-items:center}
      .detail-nav button{flex:1 1 calc(50% - 4px);min-height:44px}
      .detail-nav .position{width:100%;margin-left:0;text-align:center}
      .actions.sticky-actions button{flex:1 1 100%;min-height:44px}
      .date-entry{grid-template-columns:minmax(0,1fr) 44px}
    }
'''
          review = review.replace("  </style>", review_css + "  </style>", 1)
          review_path.write_text(review, encoding="utf-8")

          test_path = root / "backend/tests/test_ui_issue_32_contract.py"
          test_path.write_text(r'''from __future__ import annotations

from pathlib import Path
import re


ROOT = Path(__file__).resolve().parents[1]
UI = ROOT / "app" / "ui"
INDEX = (UI / "index.html").read_text(encoding="utf-8")
STYLES = (UI / "styles.css").read_text(encoding="utf-8")
APP = (UI / "app.js").read_text(encoding="utf-8")
REVIEW = (UI / "review.html").read_text(encoding="utf-8")


def test_every_weekly_visible_date_uses_full_latvian_format() -> None:
    assert 'function fmtDate(v)' in APP
    assert 'function weeklyShortDate(iso)' in APP
    assert '.${date.getFullYear()}`;}' in APP
    assert 'return `${weeklyShortDate(dates[0])}–${weeklyShortDate(dates[6])}`;' in APP
    assert 'return `${String(date.getDate()).padStart(2,"0")}.${String(date.getMonth()+1).padStart(2,"0")}.`;}' not in APP


def test_as_of_date_is_berlin_based_and_url_input_is_validated() -> None:
    assert 'timeZone:"Europe/Berlin"' in APP
    assert 'function isIsoDate(v)' in APP
    assert 'function setAsOfIso(v){const iso=isIsoDate(v)?String(v):todayLocal();' in APP
    assert 'if(p.has("date"))setAsOfIso(p.get("date"));' in APP
    assert 'function weeklyBerlinToday(){return todayLocal();}' in APP


def test_primary_family_workflows_clip_page_overflow_without_hiding_inner_scrollers() -> None:
    assert 'html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}' in STYLES
    assert '.weekly-app-actions{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);width:100%;min-width:0}' in STYLES
    assert '.filter-summary .reset-filters{width:100%;margin-left:0}' in STYLES
    assert '.weekly-main-nav::-webkit-scrollbar{display:none}' in STYLES
    assert '.weekly-main-nav' in STYLES and 'overflow-x:auto' in STYLES


def test_calendar_controls_remain_button_anchored_and_touch_sized() -> None:
    assert 'id="asOfPickerButton"' in INDEX
    assert 'id="weeklyDateButton"' in INDEX
    assert '.weekly-date-control{\n      position:relative;' in STYLES
    assert '.weekly-date-input{\n      position:absolute;\n      inset:0;' in STYLES
    assert '@media(pointer:coarse)' in STYLES
    assert 'min-height:44px' in STYLES


def test_review_mobile_sticky_actions_respect_safe_areas() -> None:
    assert 'content="width=device-width,initial-scale=1,viewport-fit=cover"' in REVIEW
    assert 'html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}' in REVIEW
    assert '.actions.sticky-actions{padding-bottom:max(12px,env(safe-area-inset-bottom))}' in REVIEW
    assert '.toolbar>*{flex:1 1 100%;width:100%}' in REVIEW
    assert 'placeholder="DD.MM.GGGG"' in REVIEW


def test_normal_family_body_has_no_preview_or_diagnostic_copy() -> None:
    visible = re.sub(r'<!--.*?-->', '', INDEX, flags=re.S)
    body = visible.split('<body', 1)[1]
    assert 'preview-only' not in body.lower()
    assert 'diagnostic' not in body.lower()


def test_filters_remain_visible_and_reversible() -> None:
    assert 'id="filterSummary"' in INDEX
    assert 'function renderFilterSummary()' in APP
    assert 'function resetFilters()' in APP
    assert 'id="activeFilterCount"' in INDEX
''', encoding="utf-8")

          docs_path = root / "docs/UI_ISSUE_32_AUDIT.md"
          docs_path.write_text(r'''# Issue #32 UI audit

## Contract

- API and URL values remain ISO `YYYY-MM-DD`.
- Every user-visible calendar date is rendered as `DD.MM.YYYY`.
- “Today” is resolved in `Europe/Berlin`; rendering does not coerce calendar-only values through UTC.
- Invalid URL dates fall back to the Berlin-local current date instead of entering API requests.

## Audited surfaces

The current `main` implementation was checked across the weekly overview, offers, canonical comparison, daily specials, Review, filter summaries, retailer cards, drawers, detail dialogs and mobile navigation.

The implementation fixes the two confirmed contract gaps:

1. weekly day, validity and range labels previously mixed `DD.MM.` with `DD.MM.YYYY`;
2. the primary family and Review workflows lacked one final page-level overflow and safe-area contract on narrow screens.

## Mobile and accessibility safeguards

- page-level horizontal overflow is clipped while intentional inner navigation/filter scrollers remain scrollable;
- grid children and long product/filter text may shrink and wrap;
- weekly date/store controls use two bounded mobile columns and stay within the viewport;
- the Review toolbar and sticky actions collapse to full-width controls;
- sticky Review actions include the device bottom safe area;
- primary calendar and navigation controls retain at least 44 px touch targets on coarse pointers;
- active filter summaries remain visible and provide a full-width reset action on narrow screens.

## Verification

Focused contract tests cover date format/timezone semantics, URL validation, calendar anchoring, mobile overflow, Review safe areas, filter reversibility and absence of preview/diagnostic copy in the normal rendered family body.

No production deployment or database write is part of this change.
''', encoding="utf-8")

          sys.path.insert(0, str(root / "backend"))
          from tests.ui_contract import read_family_ui_contract

          css_sha = sha256(style_path.read_bytes()).hexdigest()
          js_sha = sha256(app_path.read_bytes()).hexdigest()
          contract_sha = sha256(read_family_ui_contract().encode("utf-8")).hexdigest()

          contract = contract_path.read_text(encoding="utf-8")
          contract, count = re.subn(
              r'ORIGINAL_INDEX_SHA256 = "[0-9a-f]{64}"',
              f'ORIGINAL_INDEX_SHA256 = "{contract_sha}"',
              contract,
              count=1,
          )
          if count != 1:
              raise SystemExit("UI contract SHA constant was not updated")
          contract_path.write_text(contract, encoding="utf-8")

          static_test = static_test_path.read_text(encoding="utf-8")
          replacements = (
              (r'EXPECTED_CSS_SHA256 = "[0-9a-f]{64}"', f'EXPECTED_CSS_SHA256 = "{css_sha}"'),
              (r'EXPECTED_JS_SHA256 = "[0-9a-f]{64}"', f'EXPECTED_JS_SHA256 = "{js_sha}"'),
              (r'assert ORIGINAL_INDEX_SHA256 == "[0-9a-f]{64}"', f'assert ORIGINAL_INDEX_SHA256 == "{contract_sha}"'),
          )
          for pattern, replacement in replacements:
              static_test, count = re.subn(pattern, replacement, static_test, count=1)
              if count != 1:
                  raise SystemExit(f"static asset golden was not updated: {pattern}")
          static_test_path.write_text(static_test, encoding="utf-8")
          PY

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run focused regression suite
        working-directory: backend
        run: |
          python -m unittest \
            tests.test_ui_issue_32_contract \
            tests.test_ui_latvian_dates_and_review_open \
            tests.test_ui_weekly_overview \
            tests.test_ui_static_assets
          python -m compileall -q app tests
          python -m pip check

      - name: Verify patch quality
        run: |
          git diff --check
          test "$(git status --short | wc -l)" -ge 1

      - name: Commit isolated implementation
        shell: bash
        run: |
          rm -- .github/workflows/issue-32-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            backend/app/ui/app.js \
            backend/app/ui/styles.css \
            backend/app/ui/review.html \
            backend/tests/test_ui_issue_32_contract.py \
            backend/tests/test_ui_static_assets.py \
            backend/tests/ui_contract.py \
            docs/UI_ISSUE_32_AUDIT.md \
            .github/workflows/issue-32-apply.yml
          git diff --cached --check
          git commit -m "fix: harden UI dates calendars and mobile layouts"
          git push origin HEAD:fix/issue-32-ui-regressions
