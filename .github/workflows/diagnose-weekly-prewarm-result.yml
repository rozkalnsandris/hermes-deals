name: Diagnose weekly prewarm result

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect-deploy-run:
    name: Inspect #251 deploy workflow run
    if: >-
      github.event.pull_request.head.ref == 'diag/251-verify-weekly-prewarm' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent deploy-main workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 5adbfa189e23055fc0d5b0f3db93e3c0bd082716
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-deploy-run-diagnostic/1",
          }

          def get_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          payload = get_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/deploy-main.yml/runs?per_page=30"
          )
          runs = payload.get("workflow_runs") or []
          print(f"DEPLOY_RUN_COUNT={len(runs)}")
          exact = []
          for row in runs[:20]:
              print(
                  "DEPLOY_RUN "
                  f"id={row.get('id')} run_number={row.get('run_number')} "
                  f"event={row.get('event')} status={row.get('status')} "
                  f"conclusion={row.get('conclusion')} head_sha={row.get('head_sha')} "
                  f"created_at={row.get('created_at')} updated_at={row.get('updated_at')}"
              )
              if row.get("head_sha") == target_sha:
                  exact.append(row)

          if exact:
              selected = max(exact, key=lambda row: int(row.get("id") or 0))
              print(
                  "TARGET_DEPLOY_RUN "
                  f"id={selected.get('id')} status={selected.get('status')} "
                  f"conclusion={selected.get('conclusion')} event={selected.get('event')}"
              )
          else:
              print("TARGET_DEPLOY_RUN=NOT_FOUND")
          PY
