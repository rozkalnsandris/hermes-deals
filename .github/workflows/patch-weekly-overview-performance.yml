name: Apply weekly overview performance patch

on:
  push:
    branches:
      - fix/184-weekly-overview-fast-load

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply guarded source and contract-test patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          app_path = Path("backend/app/ui/app.js")
          app = app_path.read_text(encoding="utf-8")

          app = replace_once(
              app,
              'applyUiPrefs();applyFilterPanel();restoreViewPrefs();restoreUrl();renderFilterSummary();$("currentToggle").style.display=mode==="canonical"?"flex":"none";$("comparisonToggle").style.display=mode==="canonical"?"flex":"none";loadInitialPage();',
              'applyUiPrefs();applyFilterPanel();restoreViewPrefs();restoreUrl();renderFilterSummary();$("currentToggle").style.display=mode==="canonical"?"flex":"none";$("comparisonToggle").style.display=mode==="canonical"?"flex":"none";renderList();',
              "defer hidden legacy boot",
          )
          app = replace_once(
              app,
              'window.addEventListener("popstate",()=>{restoreUrl();saveViewPrefs();reloadAll();});',
              'window.addEventListener("popstate",()=>{restoreUrl();saveViewPrefs();renderFilterSummary();renderList();});',
              "avoid hidden legacy reload on history navigation",
          )
          app = replace_once(
              app,
              'const weeklyState={weekStart:"",selectedDate:"",cache:new Map(),rowsByDate:new Map(),dealById:new Map(),failedDates:new Set(),requestToken:0};',
              'const weeklyState={weekStart:"",selectedDate:"",cache:new Map(),rowsByDate:new Map(),dealById:new Map(),failedDates:new Set(),loadingDates:new Set(),requestToken:0};',
              "weekly loading state",
          )
          app = replace_once(
              app,
              'async function loadWeeklyOverview(targetIso=asOf.value||weeklyBerlinToday(),force=false){const start=weeklyMonday(targetIso),token=++weeklyState.requestToken;weeklyState.weekStart=start;weeklyState.selectedDate=targetIso;weeklyRetailer.value=selectedRetailer;weeklyRenderLoading(start);if(!force&&weeklyState.cache.has(start)){weeklyState.rowsByDate=weeklyState.cache.get(start);renderWeeklyOverview();return;}const dates=weeklyDates(start),settled=await Promise.allSettled(dates.map(weeklyFetchDay));if(token!==weeklyState.requestToken)return;const rowsByDate=new Map();weeklyState.failedDates=new Set();settled.forEach((result,index)=>{rowsByDate.set(dates[index],result.status==="fulfilled"?result.value:[]);if(result.status!=="fulfilled")weeklyState.failedDates.add(dates[index]);});weeklyState.rowsByDate=rowsByDate;weeklyRememberCache(start,rowsByDate);renderWeeklyOverview();}',
              'async function weeklyLoadDate(iso,token){try{const rows=await weeklyFetchDay(iso);if(token!==weeklyState.requestToken)return;weeklyState.rowsByDate.set(iso,rows);}catch{if(token!==weeklyState.requestToken)return;weeklyState.rowsByDate.set(iso,[]);weeklyState.failedDates.add(iso);}finally{if(token===weeklyState.requestToken)weeklyState.loadingDates.delete(iso);}}\n      async function loadWeeklyOverview(targetIso=asOf.value||weeklyBerlinToday(),force=false){const start=weeklyMonday(targetIso),token=++weeklyState.requestToken;weeklyState.weekStart=start;weeklyState.selectedDate=targetIso;weeklyRetailer.value=selectedRetailer;weeklyRenderLoading(start);if(!force&&weeklyState.cache.has(start)){weeklyState.rowsByDate=weeklyState.cache.get(start);weeklyState.failedDates=new Set();weeklyState.loadingDates=new Set();renderWeeklyOverview();return;}const dates=weeklyDates(start),selected=dates.includes(targetIso)?targetIso:dates[0];weeklyState.rowsByDate=new Map();weeklyState.failedDates=new Set();weeklyState.loadingDates=new Set(dates);await weeklyLoadDate(selected,token);if(token!==weeklyState.requestToken)return;renderWeeklyOverview();const remaining=dates.filter(iso=>iso!==selected);await Promise.all(remaining.map(iso=>weeklyLoadDate(iso,token)));if(token!==weeklyState.requestToken)return;weeklyRememberCache(start,weeklyState.rowsByDate);renderWeeklyOverview();}',
              "selected day first weekly loader",
          )
          app = replace_once(
              app,
              'function renderWeeklyDays(){const today=weeklyBerlinToday();weeklyRange.textContent=weeklyRangeText(weeklyState.weekStart);weeklyHeaderRange.textContent=weeklyRangeText(weeklyState.weekStart);weeklyDateInput.value=weeklyState.selectedDate;weeklyDays.innerHTML=weeklyDates(weeklyState.weekStart).map(iso=>{const rows=weeklyStartsFor(iso),counts={};for(const deal of rows)counts[deal.source_chain]=(counts[deal.source_chain]||0)+1;const chips=weeklyStoreOrder(Object.keys(counts)).filter(key=>counts[key]).map(key=>weeklyDayChip(key,counts[key])).join(""),dayBody=weeklyState.failedDates.has(iso)?`<span class="weekly-no-deals">Neizdevās ielādēt</span>`:(chips||`<span class="weekly-no-deals">⊘ Nav jaunu akciju</span>`);return `<button class="weekly-day${iso===weeklyState.selectedDate?" selected":""}${iso===today?" today":""}" data-weekly-date="${iso}" type="button" aria-pressed="${iso===weeklyState.selectedDate}"><span class="weekly-day-name">${esc(weeklyCap(weeklyWeekday(iso)))}</span><span class="weekly-day-date">${esc(weeklyShortDate(iso))}</span><span class="weekly-day-chips">${dayBody}</span></button>`;}).join("");weeklyDays.querySelectorAll("[data-weekly-date]").forEach(button=>button.addEventListener("click",()=>selectWeeklyDate(button.dataset.weeklyDate)));}',
              'function renderWeeklyDays(){const today=weeklyBerlinToday();weeklyRange.textContent=weeklyRangeText(weeklyState.weekStart);weeklyHeaderRange.textContent=weeklyRangeText(weeklyState.weekStart);weeklyDateInput.value=weeklyState.selectedDate;weeklyDays.innerHTML=weeklyDates(weeklyState.weekStart).map(iso=>{const rows=weeklyStartsFor(iso),counts={};for(const deal of rows)counts[deal.source_chain]=(counts[deal.source_chain]||0)+1;const chips=weeklyStoreOrder(Object.keys(counts)).filter(key=>counts[key]).map(key=>weeklyDayChip(key,counts[key])).join(""),pending=weeklyState.loadingDates.has(iso),dayBody=pending?`<span class="weekly-no-deals">Ielādēju…</span>`:weeklyState.failedDates.has(iso)?`<span class="weekly-no-deals">Neizdevās ielādēt</span>`:(chips||`<span class="weekly-no-deals">⊘ Nav jaunu akciju</span>`);return `<button class="weekly-day${iso===weeklyState.selectedDate?" selected":""}${iso===today?" today":""}" data-weekly-date="${iso}" type="button" aria-pressed="${iso===weeklyState.selectedDate}" ${pending?"disabled":""}><span class="weekly-day-name">${esc(weeklyCap(weeklyWeekday(iso)))}</span><span class="weekly-day-date">${esc(weeklyShortDate(iso))}</span><span class="weekly-day-chips">${dayBody}</span></button>`;}).join("");weeklyDays.querySelectorAll("[data-weekly-date]").forEach(button=>button.addEventListener("click",()=>selectWeeklyDate(button.dataset.weeklyDate)));}',
              "per-day progressive loading UI",
          )
          app = replace_once(
              app,
              '        const iso=weeklyState.selectedDate;\n        if(weeklyState.failedDates.has(iso)){',
              '        const iso=weeklyState.selectedDate;\n        if(weeklyState.loadingDates.has(iso)){\n          $("weeklyDetailTitle").textContent=`Ielādēju ${weeklyLongDate(iso)} piedāvājumus…`;\n          weeklyStoreGroups.classList.remove("is-empty");\n          weeklyStoreGroups.innerHTML=`<div class="weekly-loading">Ielādēju izvēlētās dienas piedāvājumus…</div>`;\n          weeklyContinuing.hidden=true;\n          return;\n        }\n        if(weeklyState.failedDates.has(iso)){',
              "selected-day detail loading state",
          )
          app = replace_once(
              app,
              'function renderWeeklySummary(){const dates=weeklyDates(weeklyState.weekStart),counts=dates.map(iso=>[iso,weeklyStartsFor(iso).length]),busiest=counts.slice().sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0],allStarts=dates.flatMap(iso=>weeklyStartsFor(iso).map(deal=>({deal,iso}))),singleCount=allStarts.filter(entry=>weeklyIsSingleDay(entry.deal,entry.iso)).length,retailerCount=new Set(allStarts.map(entry=>entry.deal.source_chain)).size,next=counts.find(([iso,count])=>iso>weeklyState.selectedDate&&count>0);$("weeklyBusiest").textContent=busiest&&busiest[1]?weeklyCap(weeklyWeekday(busiest[0])):"Nav jaunu akciju";$("weeklySingleDay").textContent=String(singleCount);$("weeklyRetailerCount").textContent=String(retailerCount);$("weeklyNextActivity").textContent=next?weeklyCap(weeklyWeekday(next[0])):"Šonedēļ nav";}',
              'function renderWeeklySummary(){if(weeklyState.loadingDates.size){$("weeklyBusiest").textContent="Ielādēju…";$("weeklySingleDay").textContent="—";$("weeklyRetailerCount").textContent="—";$("weeklyNextActivity").textContent="Ielādēju…";return;}const dates=weeklyDates(weeklyState.weekStart),counts=dates.map(iso=>[iso,weeklyStartsFor(iso).length]),busiest=counts.slice().sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0],allStarts=dates.flatMap(iso=>weeklyStartsFor(iso).map(deal=>({deal,iso}))),singleCount=allStarts.filter(entry=>weeklyIsSingleDay(entry.deal,entry.iso)).length,retailerCount=new Set(allStarts.map(entry=>entry.deal.source_chain)).size,next=counts.find(([iso,count])=>iso>weeklyState.selectedDate&&count>0);$("weeklyBusiest").textContent=busiest&&busiest[1]?weeklyCap(weeklyWeekday(busiest[0])):"Nav jaunu akciju";$("weeklySingleDay").textContent=String(singleCount);$("weeklyRetailerCount").textContent=String(retailerCount);$("weeklyNextActivity").textContent=next?weeklyCap(weeklyWeekday(next[0])):"Šonedēļ nav";}',
              "defer summary until week is complete",
          )
          app = replace_once(
              app,
              'function syncWeeklyRetailer(value){selectedRetailer=value||"";weeklyRetailer.value=selectedRetailer;if($("retailerSelect"))$("retailerSelect").value=selectedRetailer;retailers.querySelectorAll(".chip").forEach(chip=>chip.classList.toggle("active",(chip.dataset.retailer||"")===selectedRetailer));saveViewPrefs();syncUrl();renderWeeklyOverview();loadGrid();}\n      function selectWeeklyDate(iso){weeklyState.selectedDate=iso;setAsOfIso(iso);syncUrl();renderWeeklyOverview();reloadAll();}\n      function openWeeklyRetailer(retailer){syncWeeklyRetailer(retailer);document.getElementById("deals")?.scrollIntoView({behavior:"smooth",block:"start"});}\n      function moveWeekly(delta){const target=addDaysIso(weeklyState.weekStart,delta*7);setAsOfIso(target);syncUrl();reloadAll();loadWeeklyOverview(target);}\n      function goWeeklyToday(){const today=weeklyBerlinToday();setAsOfIso(today);syncUrl();reloadAll();loadWeeklyOverview(today);document.getElementById("home")?.scrollIntoView({behavior:"smooth",block:"start"});}',
              'function syncWeeklyRetailer(value){selectedRetailer=value||"";weeklyRetailer.value=selectedRetailer;if($("retailerSelect"))$("retailerSelect").value=selectedRetailer;retailers.querySelectorAll(".chip").forEach(chip=>chip.classList.toggle("active",(chip.dataset.retailer||"")===selectedRetailer));saveViewPrefs();syncUrl();renderWeeklyOverview();}\n      function selectWeeklyDate(iso){weeklyState.selectedDate=iso;setAsOfIso(iso);syncUrl();renderWeeklyOverview();}\n      async function openWeeklyDeals(retailer=""){if(retailer)syncWeeklyRetailer(retailer);grid.innerHTML=`<div class="empty"><span class="loading"></span>Ielādēju piedāvājumus…</div>`;document.getElementById("deals")?.scrollIntoView({behavior:"smooth",block:"start"});await loadGrid();}\n      function openWeeklyRetailer(retailer){void openWeeklyDeals(retailer);}\n      function moveWeekly(delta){const target=addDaysIso(weeklyState.weekStart,delta*7);setAsOfIso(target);syncUrl();loadWeeklyOverview(target);}\n      function goWeeklyToday(){const today=weeklyBerlinToday();setAsOfIso(today);syncUrl();loadWeeklyOverview(today);document.getElementById("home")?.scrollIntoView({behavior:"smooth",block:"start"});}',
              "lazy legacy catalog and lean weekly navigation",
          )
          app = replace_once(
              app,
              '$("weeklyNavDeals").addEventListener("click",()=>document.getElementById("deals")?.scrollIntoView({behavior:"smooth",block:"start"}));\n      $("weeklyShowAll").addEventListener("click",()=>document.getElementById("deals")?.scrollIntoView({behavior:"smooth",block:"start"}));',
              '$("weeklyNavDeals").addEventListener("click",()=>void openWeeklyDeals());\n      $("weeklyShowAll").addEventListener("click",()=>void openWeeklyDeals());',
              "lazy catalog navigation handlers",
          )
          app = replace_once(
              app,
              'weeklyDateInput.addEventListener("change",()=>{if(!weeklyDateInput.value)return;const target=weeklyDateInput.value;setAsOfIso(target);syncUrl();reloadAll();loadWeeklyOverview(target);});',
              'weeklyDateInput.addEventListener("change",()=>{if(!weeklyDateInput.value)return;const target=weeklyDateInput.value;setAsOfIso(target);syncUrl();loadWeeklyOverview(target);});',
              "calendar date without hidden legacy reload",
          )
          app_path.write_text(app, encoding="utf-8")

          test_path = Path("backend/tests/test_ui_weekly_overview.py")
          test = test_path.read_text(encoding="utf-8")
          test = replace_once(
              test,
              '        self.assertIn(\n            "Promise.allSettled(dates.map(weeklyFetchDay))",\n            self.active,\n        )\n',
              '        self.assertIn("await weeklyLoadDate(selected,token)", self.active)\n        self.assertIn(\n            "Promise.all(remaining.map(iso=>weeklyLoadDate(iso,token)))",\n            self.active,\n        )\n',
              "progressive loader contract",
          )
          anchor = '    def test_full_week_catalog_rows_are_excluded(self) -> None:\n'
          insertion = '''    def test_weekly_overview_defers_hidden_legacy_requests(self) -> None:\n        self.assertIn("loadingDates:new Set()", self.active)\n        self.assertIn("pending=weeklyState.loadingDates.has(iso)", self.active)\n        self.assertIn("async function openWeeklyDeals", self.active)\n        self.assertIn('weeklyNavDeals").addEventListener("click",()=>void openWeeklyDeals())', self.active)\n        self.assertNotIn(\n            '$("comparisonToggle").style.display=mode==="canonical"?"flex":"none";loadInitialPage();',\n            self.active,\n        )\n        self.assertNotIn("syncUrl();renderWeeklyOverview();reloadAll();", self.active)\n        self.assertNotIn("syncUrl();reloadAll();loadWeeklyOverview(target);", self.active)\n\n'''
          if test.count(anchor) != 1:
              raise SystemExit("test insertion anchor mismatch")
          test = test.replace(anchor, insertion + anchor, 1)
          test_path.write_text(test, encoding="utf-8")

          workflow = Path(".github/workflows/patch-weekly-overview-performance.yml")
          workflow.unlink()
          PY
      - name: Run focused UI contract tests
        run: |
          cd backend
          python -m unittest tests.test_ui_weekly_overview
      - name: Commit patched branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf: render selected weekly day before background prefetch"
          git push origin HEAD:fix/184-weekly-overview-fast-load
