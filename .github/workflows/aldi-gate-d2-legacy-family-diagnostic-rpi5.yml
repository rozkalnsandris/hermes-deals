name: ALDI Gate D2 legacy family diagnostic RPi5

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR registering Gate D2 diagnostic execution
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: hermes-deals-aldi-gate-d2-legacy-family-diagnostic
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.auth.outputs.sha }}
      pr: ${{ steps.auth.outputs.pr }}
    steps:
      - id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          PR: ${{ inputs.pr_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          if os.environ["ACTOR"] != "rozkalnsandris" or os.environ["ACTOR_ID"] != "277435981":
              raise SystemExit("owner required")
          number = os.environ["PR"]
          if not number.isdigit():
              raise SystemExit("numeric PR required")
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          pr = get(f"https://api.github.com/repos/{os.environ['REPO']}/pulls/{number}")
          if not pr.get("merged") or pr["base"]["ref"] != "main":
              raise SystemExit("merged main PR required")
          sha = pr["merge_commit_sha"]
          compare = get(f"https://api.github.com/repos/{os.environ['REPO']}/compare/{sha}...main")
          if compare.get("merge_base_commit", {}).get("sha") != sha:
              raise SystemExit("registered merge SHA is not ancestor of current main")
          tree = get(f"https://api.github.com/repos/{os.environ['REPO']}/git/trees/{sha}?recursive=1")
          paths = {item["path"] for item in tree["tree"] if item.get("type") == "blob"}
          required = {
              ".github/workflows/aldi-gate-d2-legacy-family-diagnostic-rpi5.yml",
              "tools/aldi_gate_d2_legacy_family_diagnostic.py",
              "tools/runner/aldi_gate_d2_legacy_family_diagnostic_dispatch.py",
              "tools/runner/install-aldi-gate-d2-legacy-family-diagnostic.py",
          }
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f"registered Gate D2 files missing: {missing}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha={sha}\npr={number}\n")
          PY

  rpi5:
    needs: authorize
    runs-on: [self-hosted, Linux, ARM64, hermes-deals-audit]
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      fingerprint: ${{ steps.result.outputs.fingerprint }}
      candidates: ${{ steps.result.outputs.candidates }}
      valid: ${{ steps.result.outputs.valid }}
      failure_type: ${{ steps.result.outputs.failure_type }}
    steps:
      - id: run
        env:
          SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          out="${RUNNER_TEMP}/hermes-deals-aldi-gate-d2-legacy-family-diagnostic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$out"
          echo "artifact_dir=$out" >> "$GITHUB_OUTPUT"
          rc=0
          sudo --non-interactive /usr/local/sbin/hermes-deals-aldi-gate-d2-legacy-family-diagnostic "$SHA" "$out" || rc=$?
          echo "$rc" > "$out/runner-dispatch-exit-code.txt"
          exit "$rc"
      - id: result
        if: always() && steps.run.outputs.artifact_dir != ''
        env:
          OUT: ${{ steps.run.outputs.artifact_dir }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["OUT"])
          result = out / "diagnostic-result.json"
          failure = out / "diagnostic-failure.json"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              if result.is_file():
                  payload = json.loads(result.read_text(encoding="utf-8"))
                  handle.write(f"decision={payload.get('decision', '')}\n")
                  handle.write(f"fingerprint={payload.get('diagnostic_fingerprint', '')}\n")
                  handle.write(f"candidates={payload.get('candidate_count', 0)}\n")
                  handle.write(f"valid={payload.get('valid_candidate_count', 0)}\n")
                  handle.write("failure_type=\n")
              elif failure.is_file():
                  payload = json.loads(failure.read_text(encoding="utf-8"))
                  handle.write("decision=DIAGNOSTIC_EXECUTION_BLOCKED\n")
                  handle.write("fingerprint=\ncandidates=0\nvalid=0\n")
                  handle.write(f"failure_type={payload.get('error_type', '')}\n")
          PY
      - if: always() && steps.run.outputs.artifact_dir != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: aldi-gate-d2-legacy-family-diagnostic-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.run.outputs.artifact_dir }}
          retention-days: 30
          if-no-files-found: error

  report:
    if: always() && needs.authorize.result == 'success'
    needs: [authorize, rpi5]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.authorize.outputs.pr }}
          SHA: ${{ needs.authorize.outputs.sha }}
          JOB_RESULT: ${{ needs.rpi5.result }}
          DECISION: ${{ needs.rpi5.outputs.decision }}
          FINGERPRINT: ${{ needs.rpi5.outputs.fingerprint }}
          CANDIDATES: ${{ needs.rpi5.outputs.candidates }}
          VALID: ${{ needs.rpi5.outputs.valid }}
          FAILURE_TYPE: ${{ needs.rpi5.outputs.failure_type }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              "## ALDI Gate D2 legacy family diagnostic\n\n"
              f"- Runner result: **{os.environ['JOB_RESULT']}**\n"
              f"- Diagnostic decision: **{os.environ.get('DECISION') or 'unavailable'}**\n"
              f"- Registered commit: `{os.environ['SHA']}`\n"
              f"- Diagnostic fingerprint: `{os.environ.get('FINGERPRINT') or 'unavailable'}`\n"
              f"- Manifest candidates: `{os.environ.get('CANDIDATES') or '0'}`\n"
              f"- Valid 49+41 candidates: `{os.environ.get('VALID') or '0'}`\n"
              f"- Sanitized failure type: `{os.environ.get('FAILURE_TYPE') or 'none'}`\n"
              f"- Workflow run: `{os.environ['RUN_ID']}`\n"
              "- Frozen V1 evidence mutated: **false**\n"
              "- Raw page images exported: **false**\n"
              "- Raw exceptions exported: **false**\n"
              "- Gate D review-pack execution: **false / not authorized**\n"
              "- Production DB/deploy: **false / not authorized**\n"
          )
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/{os.environ['PR']}/comments",
              data=json.dumps({"body": body}).encode(),
              headers=headers,
              method="POST",
          )
          urllib.request.urlopen(request, timeout=20).read()
          PY
