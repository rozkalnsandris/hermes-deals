name: Netto missing normal price RPi5 audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/netto-missing-normal-price-rpi5-audit.yml
      - tools/runner/install-netto-missing-normal-price-rpi5-audit.sh
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: hermes-deals-netto-missing-normal-price-rpi5-audit
  cancel-in-progress: false

jobs:
  ensure-label:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Reconcile one-shot label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ['REPOSITORY']
          label = {'name':'audit:netto-missing-normal-price-v1','color':'0e8a16','description':'Run exact read-only Netto missing-normal-price audit on RPi5'}
          headers = {'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','User-Agent':'hermes-deals-netto-missing-normal-price-label','X-GitHub-Api-Version':'2022-11-28'}
          payload = json.dumps(label).encode()
          encoded = urllib.parse.quote(label['name'], safe='')
          try:
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/labels/{encoded}', data=payload, method='PATCH', headers=headers)
              urllib.request.urlopen(req, timeout=20).close()
          except urllib.error.HTTPError as exc:
              if exc.code != 404: raise
              req = urllib.request.Request(f'https://api.github.com/repos/{repo}/labels', data=payload, method='POST', headers=headers)
              urllib.request.urlopen(req, timeout=20).close()
          print(f"LABEL={label['name']} RESULT=PASS")
          PY

  authorize:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'audit:netto-missing-normal-price-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      sha: ${{ steps.gate.outputs.sha }}
      pr_number: ${{ steps.gate.outputs.pr_number }}
      ci_mode: ${{ steps.gate.outputs.ci_mode }}
    steps:
      - name: Validate owner, merged main PR and exact successful CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_OWNER_LOGIN: rozkalnsandris
          EXPECTED_OWNER_ID: '277435981'
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.parse, urllib.request
          repo = os.environ['REPOSITORY']
          if repo != 'rozkalnsandris/hermes-deals': raise SystemExit('unexpected repository')
          if os.environ['WORKFLOW_REF'] != 'refs/heads/main': raise SystemExit('workflow must execute from main')
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          sender = event.get('sender') or {}
          if sender.get('login') != os.environ['EXPECTED_OWNER_LOGIN'] or sender.get('id') != int(os.environ['EXPECTED_OWNER_ID']): raise SystemExit('label actor is not allowlisted owner')
          pr_number = int((event.get('pull_request') or {}).get('number') or 0)
          headers = {'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'User-Agent':'hermes-deals-netto-missing-normal-price-authorizer','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response: return json.load(response)
          pr = get(f'https://api.github.com/repos/{repo}/pulls/{pr_number}')
          if not pr.get('merged') or pr['base']['ref'] != 'main' or pr['base']['repo']['full_name'] != repo: raise SystemExit('audit requires merged PR into repository main')
          if (pr.get('head', {}).get('repo') or {}).get('full_name') != repo: raise SystemExit('audit requires same-repository PR head')
          sha = str(pr.get('merge_commit_sha') or '')
          head_sha = str((pr.get('head') or {}).get('sha') or '')
          if not re.fullmatch(r'[0-9a-f]{40}', sha): raise SystemExit('invalid merge SHA')
          if not re.fullmatch(r'[0-9a-f]{40}', head_sha): raise SystemExit('invalid PR head SHA')
          comparison = get(f'https://api.github.com/repos/{repo}/compare/{sha}...main')
          if comparison.get('status') not in {'ahead','identical'}: raise SystemExit('merged SHA is not reachable from current main')

          merge_query = urllib.parse.urlencode({'head_sha':sha,'event':'push','status':'completed','per_page':20})
          merge_runs = get(f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{merge_query}').get('workflow_runs') or []
          merge_ci_ok = any(
              r.get('head_sha') == sha and
              r.get('head_branch') == 'main' and
              r.get('event') == 'push' and
              r.get('conclusion') == 'success' and
              r.get('name') == 'Hermes Deals CI checks'
              for r in merge_runs
          )
          ci_mode = 'merge_push_ci'
          if not merge_ci_ok:
              head_query = urllib.parse.urlencode({'head_sha':head_sha,'event':'pull_request','status':'completed','per_page':20})
              head_runs = get(f'https://api.github.com/repos/{repo}/actions/workflows/ci.yml/runs?{head_query}').get('workflow_runs') or []
              head_ci_ok = any(
                  r.get('head_sha') == head_sha and
                  r.get('event') == 'pull_request' and
                  r.get('conclusion') == 'success' and
                  r.get('name') == 'Hermes Deals CI checks'
                  for r in head_runs
              )
              if not head_ci_ok: raise SystemExit('neither merge SHA nor exact PR head has successful CI')
              merge_commit = get(f'https://api.github.com/repos/{repo}/git/commits/{sha}')
              head_commit = get(f'https://api.github.com/repos/{repo}/git/commits/{head_sha}')
              merge_tree = str((merge_commit.get('tree') or {}).get('sha') or '')
              head_tree = str((head_commit.get('tree') or {}).get('sha') or '')
              if not re.fullmatch(r'[0-9a-f]{40}', merge_tree) or merge_tree != head_tree:
                  raise SystemExit('tested PR head tree differs from squash merge tree')
              ci_mode = 'tree_equivalent_pr_head_ci'

          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a') as out:
              out.write(f'should_run=true\nsha={sha}\npr_number={pr_number}\nci_mode={ci_mode}\n')
          print(f'AUTHORIZATION_RESULT=PASS CI_MODE={ci_mode} APPROVED_SHA={sha}')
          PY

  rpi5-audit:
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.should_run == 'true'
    runs-on: [self-hosted, Linux, ARM64, hermes-deals-audit]
    timeout-minutes: 30
    permissions: {}
    steps:
      - name: Run root-owned read-only dispatcher
        id: dispatch
        env:
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          export_dir="${RUNNER_TEMP}/hermes-deals-netto-missing-normal-price-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$export_dir"
          echo "artifact_dir=$export_dir" >> "$GITHUB_OUTPUT"
          sudo --non-interactive /usr/local/sbin/hermes-deals-netto-missing-normal-price-audit-dispatch "$APPROVED_SHA" "$export_dir"
      - name: Upload sanitized diagnostic evidence
        if: always() && steps.dispatch.outputs.artifact_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: netto-missing-normal-price-v1-${{ needs.authorize.outputs.sha }}-run-${{ github.run_id }}
          path: ${{ steps.dispatch.outputs.artifact_dir }}
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
      - name: Record safety boundary
        if: always()
        run: |
          {
            echo '## Netto missing normal price audit'
            echo '- Parser behavior changed: **false**'
            echo '- Review-only: **true**'
            echo '- Promotion ready: **false**'
            echo '- Database/Review writes: **not authorized**'
            echo '- Production deploy: **not authorized**'
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [authorize, rpi5-audit]
    if: always() && github.event_name == 'pull_request_target' && github.event.label.name == 'audit:netto-missing-normal-price-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Comment result and clear one-shot label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTH_RESULT: ${{ needs.authorize.result }}
          APPROVED_SHA: ${{ needs.authorize.outputs.sha }}
          CI_MODE: ${{ needs.authorize.outputs.ci_mode }}
          AUDIT_RESULT: ${{ needs.rpi5-audit.result }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 0
          if [[ "$AUTH_RESULT" != success ]]; then
            body="Netto missing-normal-price audit **AUTHORIZATION_FAIL**. No RPi5 audit ran. Read-only control-plane only; no parser behavior change, DB/Review write, approval/publication or production deploy authorized."
          else
            outcome=FAIL
            [[ "$AUDIT_RESULT" == success ]] && outcome=PASS
            body="Netto missing-normal-price RPi5 audit ${outcome}. Exact registered SHA: \`${APPROVED_SHA}\`. CI evidence: \`${CI_MODE}\`. Read-only diagnostic only; no parser behavior change, DB/Review write, approval/publication or production deploy authorized."
          fi
          gh api --method POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
          gh api --method DELETE "repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/$(python3 -c 'import urllib.parse; print(urllib.parse.quote("audit:netto-missing-normal-price-v1", safe=""))')" || true
