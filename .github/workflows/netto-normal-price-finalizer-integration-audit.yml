name: Netto normal-price finalizer integration audit

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: netto-normal-price-finalizer-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  EXPECTED_OWNER_LOGIN: rozkalnsandris
  EXPECTED_OWNER_ID: "277435981"
  EXPECTED_BASE: main
  TRIGGER_LABEL: audit:netto-normal-price-integration-v1

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      implementation_sha: ${{ steps.auth.outputs.implementation_sha }}
    steps:
      - name: Authorize exact owner merged PR
        id: auth
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json, os
          event = json.load(open(os.environ["EVENT_PATH"], encoding="utf-8"))
          pr = event.get("pull_request") or {}
          sender = event.get("sender") or {}
          repo = event.get("repository") or {}
          checks = {
              "label": (event.get("label") or {}).get("name") == os.environ["TRIGGER_LABEL"],
              "actor_login": sender.get("login") == os.environ["EXPECTED_OWNER_LOGIN"],
              "actor_id": str(sender.get("id")) == os.environ["EXPECTED_OWNER_ID"],
              "author_login": (pr.get("user") or {}).get("login") == os.environ["EXPECTED_OWNER_LOGIN"],
              "author_id": str((pr.get("user") or {}).get("id")) == os.environ["EXPECTED_OWNER_ID"],
              "base": (pr.get("base") or {}).get("ref") == os.environ["EXPECTED_BASE"],
              "same_repo": ((pr.get("head") or {}).get("repo") or {}).get("full_name") == repo.get("full_name"),
              "merged": pr.get("merged") is True,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("authorization failed: " + ",".join(failed))
          sha = str(pr.get("merge_commit_sha") or "")
          if len(sha) != 40:
              raise SystemExit("missing exact merged implementation SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"implementation_sha={sha}\n")
          PY

  audit:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      integration_present: ${{ steps.scan.outputs.integration_present }}
    steps:
      - name: Checkout exact merged implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.implementation_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable main ancestry
        env:
          IMPLEMENTATION_SHA: ${{ needs.authorize.outputs.implementation_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$IMPLEMENTATION_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$IMPLEMENTATION_SHA" origin/main
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install exact backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Scan real non-test integration references
        id: scan
        run: |
          python - <<'PY'
          import ast, hashlib, json, os, pathlib

          root = pathlib.Path('.')
          finalizer = pathlib.Path('tools/netto_normal_price_finalizer.py')
          focused_test = pathlib.Path('backend/tests/test_netto_normal_price_finalizer.py')
          if not finalizer.is_file() or not focused_test.is_file():
              raise SystemExit('finalizer or focused test is missing')

          refs = []
          for path in sorted(root.rglob('*.py')):
              if '.git' in path.parts or '__pycache__' in path.parts:
                  continue
              rel = path.as_posix()
              if path == finalizer or '/tests/' in f'/{rel}' or rel.startswith('backend/tests/'):
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
                  tree = ast.parse(source, filename=rel)
              except (OSError, UnicodeError, SyntaxError):
                  continue
              lines = source.splitlines()
              for node in ast.walk(tree):
                  hit = None
                  if isinstance(node, ast.ImportFrom):
                      module = node.module or ''
                      if module.endswith('netto_normal_price_finalizer'):
                          hit = f'import-from:{module}'
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.endswith('netto_normal_price_finalizer'):
                              hit = f'import:{alias.name}'
                  if hit:
                      refs.append({
                          'path': rel,
                          'line': int(getattr(node, 'lineno', 0) or 0),
                          'kind': hit,
                          'source_line': lines[(getattr(node, 'lineno', 1) or 1)-1].strip() if lines else '',
                      })
              # Explicit module-name reference is also relevant for lazy import / importlib paths.
              for lineno, line in enumerate(lines, start=1):
                  if 'netto_normal_price_finalizer' in line and not any(r['path']==rel and r['line']==lineno for r in refs):
                      refs.append({'path': rel, 'line': lineno, 'kind': 'module-reference', 'source_line': line.strip()})

          # Do not count this audit workflow/test tooling; only executable Python integration refs count.
          refs = sorted(refs, key=lambda r: (r['path'], r['line'], r['kind']))
          root_out = pathlib.Path('.netto-normal-price-integration')
          root_out.mkdir(mode=0o700)
          payload = {
              'schema_version': 1,
              'strategy': 'netto_normal_price_finalizer_integration_audit_v1',
              'integration_present': bool(refs),
              'integration_reference_count': len(refs),
              'integration_references': refs,
              'finalizer_sha256': hashlib.sha256(finalizer.read_bytes()).hexdigest(),
              'focused_test_sha256': hashlib.sha256(focused_test.read_bytes()).hexdigest(),
              'repository_write': False,
              'database_write': False,
              'review_write': False,
              'publication': False,
              'deployment': False,
              'review_only': True,
              'promotion_ready': False,
          }
          (root_out / 'integration-scan.json').write_text(
              json.dumps(payload, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"integration_present={str(bool(refs)).lower()}\n")
          PY

      - name: Run focused four-case finalizer regression
        run: |
          python -m pytest -q backend/tests/test_netto_normal_price_finalizer.py \
            --junitxml=.netto-normal-price-integration/junit.xml

      - name: Freeze integration audit receipt
        env:
          IMPLEMENTATION_SHA: ${{ needs.authorize.outputs.implementation_sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.netto-normal-price-integration')
          scan = json.loads((root / 'integration-scan.json').read_text(encoding='utf-8'))
          junit = root / 'junit.xml'
          receipt = {
              'schema_version': 1,
              'strategy': 'netto_normal_price_finalizer_integration_receipt_v1',
              'implementation_sha': os.environ['IMPLEMENTATION_SHA'],
              'integration_present': scan['integration_present'],
              'integration_reference_count': scan['integration_reference_count'],
              'integration_references': scan['integration_references'],
              'finalizer_sha256': scan['finalizer_sha256'],
              'focused_test_sha256': scan['focused_test_sha256'],
              'junit_sha256': hashlib.sha256(junit.read_bytes()).hexdigest(),
              'focused_regression_pass': True,
              'repository_write': False,
              'database_write': False,
              'review_write': False,
              'publication': False,
              'deployment': False,
              'review_only': True,
              'promotion_ready': False,
          }
          (root / 'receipt.json').write_text(
              json.dumps(receipt, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Upload integration evidence before pass/fail gate
        uses: actions/upload-artifact@v4
        with:
          name: netto-normal-price-finalizer-integration-audit-run-${{ github.run_id }}
          path: .netto-normal-price-integration/
          if-no-files-found: error
          retention-days: 14

      - name: Report integration audit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('.netto-normal-price-integration/receipt.json', 'utf8'));
            const refs = r.integration_references.length
              ? r.integration_references.map(x => `  - \`${x.path}:${x.line}\` — ${x.kind}`)
              : ['  - none'];
            const body = [
              '## Netto normal-price finalizer integration audit',
              '',
              `- Workflow run: \`${context.runId}\``,
              `- Implementation: \`${r.implementation_sha}\``,
              `- Finalizer SHA256: \`${r.finalizer_sha256}\``,
              `- Focused-test SHA256: \`${r.focused_test_sha256}\``,
              `- JUnit SHA256: \`${r.junit_sha256}\``,
              `- Focused four-case regression: **PASS**`,
              `- Real non-test integration present: **${r.integration_present ? 'YES' : 'NO'}**`,
              `- Integration reference count: \`${r.integration_reference_count}\``,
              '- Integration references:',
              ...refs,
              '- Repository / DB / Review / publication / deploy writes: **false**',
              '- Review-only / promotion-ready: **true / false**',
            ].join('\n');
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body});

      - name: Fail closed when finalizer is not integrated
        if: steps.scan.outputs.integration_present != 'true'
        run: |
          echo "No real non-test integration reference exists for netto_normal_price_finalizer." >&2
          exit 2
