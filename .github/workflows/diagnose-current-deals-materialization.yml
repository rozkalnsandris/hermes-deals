name: Diagnose current deals materialization

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-readonly:
    name: RPi5 current-deals materialization read-only
    if: >-
      github.event.pull_request.head.ref == 'diag/243-production-materialization' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on: [self-hosted, Linux, ARM64, hermes-deals-release]
    timeout-minutes: 5
    steps:
      - name: Measure cold and warm current-deals stages
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from datetime import datetime
          import ipaddress, json, re, statistics, subprocess
          from time import perf_counter
          from urllib.parse import urlencode
          from urllib.request import Request, ProxyHandler, build_opener
          from zoneinfo import ZoneInfo

          opener = build_opener(ProxyHandler({}))
          as_of = datetime.now(ZoneInfo("Europe/Berlin")).date().isoformat()

          def parse_local(value):
              value = value.strip()
              if value.startswith("[") and "]:" in value:
                  host, port = value[1:].rsplit("]:", 1)
              else:
                  host, port = value.rsplit(":", 1)
              if not port.isdigit(): return None
              if host in {"*", "0.0.0.0", "::", ""}: host = "127.0.0.1"
              if "%" in host: host = host.split("%", 1)[0]
              try: parsed = ipaddress.ip_address(host)
              except ValueError: return None
              return f"http://{'[' + host + ']' if parsed.version == 6 else host}:{int(port)}"

          sockets = subprocess.run(["ss", "-H", "-ltn"], check=True, capture_output=True, text=True).stdout.splitlines()
          candidates=[]
          for line in sockets:
              parts=line.split()
              if len(parts)>=4:
                  candidate=parse_local(parts[3])
                  if candidate and candidate not in candidates: candidates.append(candidate)

          def fetch(base,path,timeout=10):
              req=Request(base+path,headers={"Cache-Control":"no-cache","Pragma":"no-cache","User-Agent":"hermes-materialization-diag/1"})
              started=perf_counter()
              with opener.open(req,timeout=timeout) as response:
                  body=response.read()
                  return response.status,response.headers,body,(perf_counter()-started)*1000

          base=None
          for candidate in candidates:
              try:
                  status,_,body,_=fetch(candidate,"/api/health",0.8)
                  payload=json.loads(body)
              except Exception:
                  continue
              if status==200 and payload.get("service")=="hermes-deals-api":
                  base=candidate
                  print(f"RPI5_ORIGIN base={base} version={payload.get('version')} phase={payload.get('phase')}")
                  break
          if base is None: raise SystemExit("production origin not found")

          metric_re=re.compile(r"(?P<name>[a-z0-9-]+);dur=(?P<dur>[0-9.]+)(?:;desc=(?P<desc>[a-z]+))?")
          def parse(value):
              return {m.group("name"):(float(m.group("dur")),m.group("desc")) for m in metric_re.finditer(value)}
          def path(sort,limit):
              return "/api/v1/deals/current?"+urlencode({"as_of":as_of,"view":"current","sort":sort,"offset":0,"limit":limit})
          def dur(t,key): return t.get(key,(None,None))[0]

          materialize=[]; winner=[]; totals=[]; walls=[]
          sorts=("name","price_asc","price_desc","newest","discount_desc","name","newest")
          for i,sort in enumerate(sorts):
              limit=61+i
              status,headers,body,wall=fetch(base,path(sort,limit))
              payload=json.loads(body); t=parse(headers.get("Server-Timing",""))
              assert status==200
              assert t.get("current-deals-cache",(None,None))[1]=="miss"
              assert dur(t,"current-deals-materialize") is not None
              materialize.append(dur(t,"current-deals-materialize"))
              winner.append(dur(t,"current-deals-winner"))
              totals.append(dur(t,"current-deals-sql"))
              walls.append(wall)
              print(
                  f"RPI5_MATERIALIZE sort={sort} limit={limit} wall_ms={wall:.2f} "
                  f"total={dur(t,'current-deals-sql')} winner={dur(t,'current-deals-winner')} "
                  f"rescue={dur(t,'current-deals-rescue')} materialize={dur(t,'current-deals-materialize')} "
                  f"filter={dur(t,'current-deals-filter')} canonical={dur(t,'current-deals-canonical')} "
                  f"available={payload.get('available_count')} returned={payload.get('count')}"
              )

          status,headers,_,warm_wall=fetch(base,path("name",61))
          warm=parse(headers.get("Server-Timing",""))
          print(
              "RPI5_MATERIALIZE_SUMMARY "
              f"samples={len(materialize)} "
              f"materialize_median_ms={statistics.median(materialize):.2f} "
              f"materialize_min_ms={min(materialize):.2f} materialize_max_ms={max(materialize):.2f} "
              f"winner_median_ms={statistics.median(winner):.2f} "
              f"total_median_ms={statistics.median(totals):.2f} "
              f"wall_median_ms={statistics.median(walls):.2f} "
              f"warm_wall_ms={warm_wall:.2f} "
              f"warm_cache_state={warm.get('current-deals-cache',(None,None))[1]}"
          )
          assert status==200
          assert warm.get("current-deals-cache",(None,None))[1]=="hit"
          PY
