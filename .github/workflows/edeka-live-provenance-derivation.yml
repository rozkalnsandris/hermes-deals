name: EDEKA live Gate C provenance derivation

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful EDEKA shadow-cycle workflow run to derive
        required: true
        default: "31157650948"
        type: string

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: hermes-deals-edeka-live-provenance-derivation
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.auth.outputs.artifact_id }}
      artifact_name: ${{ steps.auth.outputs.artifact_name }}
      artifact_digest: ${{ steps.auth.outputs.artifact_digest }}
      source_run_attempt: ${{ steps.auth.outputs.source_run_attempt }}
      source_commit: ${{ steps.auth.outputs.source_commit }}
    steps:
      - id: auth
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          REF: ${{ github.ref }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          if os.environ["ACTOR"] != "rozkalnsandris" or os.environ["ACTOR_ID"] != "277435981":
              raise SystemExit("owner required")
          if os.environ["REF"] != "refs/heads/main":
              raise SystemExit("workflow must be dispatched from main")
          run_id = os.environ["SOURCE_RUN_ID"]
          if not run_id.isdigit() or int(run_id) < 1:
              raise SystemExit("numeric source_run_id required")

          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          run = get(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run_id}"
          )
          if run.get("name") != "EDEKA shadow cycle RPi5 audit":
              raise SystemExit("source run is not the EDEKA shadow-cycle workflow")
          if run.get("event") != "workflow_dispatch" or run.get("conclusion") != "success":
              raise SystemExit("source EDEKA shadow run must be a successful manual run")
          if run.get("head_branch") != "main":
              raise SystemExit("source EDEKA shadow run must target main")
          head_repo = (run.get("head_repository") or {}).get("full_name")
          if head_repo != os.environ["REPO"]:
              raise SystemExit("source run repository mismatch")
          actor = run.get("actor") or {}
          if actor.get("login") != "rozkalnsandris" or str(actor.get("id")) != "277435981":
              raise SystemExit("source EDEKA shadow run was not owner-triggered")

          artifacts = get(
              f"https://api.github.com/repos/{os.environ['REPO']}/actions/runs/{run_id}/artifacts?per_page=100"
          ).get("artifacts") or []
          pattern = re.compile(
              rf"^edeka-shadow-cycle-([0-9a-f]{{40}})-run-{re.escape(run_id)}$"
          )
          matches = [
              artifact
              for artifact in artifacts
              if not artifact.get("expired") and pattern.fullmatch(artifact.get("name") or "")
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one live EDEKA shadow artifact, found={len(matches)}")
          artifact = matches[0]
          match = pattern.fullmatch(artifact["name"])
          assert match is not None
          digest = artifact.get("digest")
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("source artifact has no trusted SHA256 metadata digest")
          artifact_id = artifact.get("id")
          if not isinstance(artifact_id, int) or artifact_id < 1:
              raise SystemExit("source artifact id is invalid")
          run_attempt = run.get("run_attempt")
          if not isinstance(run_attempt, int) or run_attempt < 1:
              raise SystemExit("source run attempt is invalid")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"artifact_id={artifact_id}\n")
              handle.write(f"artifact_name={artifact['name']}\n")
              handle.write(f"artifact_digest={digest}\n")
              handle.write(f"source_run_attempt={run_attempt}\n")
              handle.write(f"source_commit={match.group(1)}\n")
          PY

  derive:
    needs: authorize
    runs-on: ubuntu-latest
    outputs:
      candidate_count: ${{ steps.result.outputs.candidate_count }}
      automatic_candidate_count: ${{ steps.result.outputs.automatic_candidate_count }}
      review_required_count: ${{ steps.result.outputs.review_required_count }}
      provenance_sha256: ${{ steps.result.outputs.provenance_sha256 }}
      attestation_sha256: ${{ steps.result.outputs.attestation_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify exact derivation commit contains merged bridge
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 71ce804f9b9e2a0e7810fa1f035cb6e27592f45f HEAD
          test -f tools/edeka_live_provenance_bridge.py
          test -f tools/edeka_live_provenance_derivation.py
          test -f tools/edeka_candidate_provenance.py

      - name: Download exact successful shadow artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: ${{ needs.authorize.outputs.artifact_name }}
          path: ${{ runner.temp }}/edeka-source-artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - id: derive
        name: Derive sanitized Gate C provenance
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.authorize.outputs.source_run_attempt }}
          ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
          ARTIFACT_NAME: ${{ needs.authorize.outputs.artifact_name }}
          ARTIFACT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
        run: |
          out="${RUNNER_TEMP}/edeka-live-provenance-output"
          mkdir -p "$out"
          python3 tools/edeka_live_provenance_derivation.py \
            --artifact-dir "${RUNNER_TEMP}/edeka-source-artifact" \
            --output-dir "$out" \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-run-attempt "$SOURCE_RUN_ATTEMPT" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --derivation-commit "$GITHUB_SHA" \
            > "${RUNNER_TEMP}/edeka-live-provenance-result.json"
          echo "output_dir=$out" >> "$GITHUB_OUTPUT"
          echo "result_file=${RUNNER_TEMP}/edeka-live-provenance-result.json" >> "$GITHUB_OUTPUT"

      - id: result
        name: Read sanitized derivation result
        env:
          RESULT_FILE: ${{ steps.derive.outputs.result_file }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["RESULT_FILE"], encoding="utf-8") as handle:
              result = json.load(handle)
          if result.get("result") != "pass":
              raise SystemExit("derivation did not return pass")
          keys = (
              "candidate_count",
              "automatic_candidate_count",
              "review_required_count",
              "provenance_sha256",
              "attestation_sha256",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key in keys:
                  handle.write(f"{key}={result[key]}\n")
          PY

      - name: Upload sanitized provenance only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: edeka-live-gate-c-provenance-source-${{ inputs.source_run_id }}-derive-${{ github.run_id }}
          path: |
            ${{ steps.derive.outputs.output_dir }}/edeka-live-candidate-provenance.json
            ${{ steps.derive.outputs.output_dir }}/derivation-attestation.json
            ${{ steps.derive.outputs.output_dir }}/SHA256SUMS
            ${{ steps.derive.outputs.result_file }}
          retention-days: 90
          if-no-files-found: error

  report:
    if: always() && needs.authorize.result == 'success'
    needs: [authorize, derive]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DERIVE_RESULT: ${{ needs.derive.result }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_COMMIT: ${{ needs.authorize.outputs.source_commit }}
          ARTIFACT_ID: ${{ needs.authorize.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.authorize.outputs.artifact_digest }}
          CANDIDATE_COUNT: ${{ needs.derive.outputs.candidate_count }}
          AUTO_COUNT: ${{ needs.derive.outputs.automatic_candidate_count }}
          REVIEW_COUNT: ${{ needs.derive.outputs.review_required_count }}
          PROVENANCE_SHA: ${{ needs.derive.outputs.provenance_sha256 }}
          ATTESTATION_SHA: ${{ needs.derive.outputs.attestation_sha256 }}
          DERIVATION_RUN_ID: ${{ github.run_id }}
          DERIVATION_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          success = os.environ["DERIVE_RESULT"] == "success"
          if success:
              detail = (
                  f"- Candidate provenance: **{os.environ['CANDIDATE_COUNT']} rows** "
                  f"({os.environ['AUTO_COUNT']} automatic / {os.environ['REVIEW_COUNT']} review)\n"
                  f"- Provenance SHA256: `{os.environ['PROVENANCE_SHA']}`\n"
                  f"- Derivation attestation SHA256: `{os.environ['ATTESTATION_SHA']}`\n"
              )
          else:
              detail = "- Sanitized Gate C provenance: **not produced; derivation failed closed**\n"
          body = (
              "## EDEKA live Gate C provenance derivation\n\n"
              f"- Derivation result: **{os.environ['DERIVE_RESULT']}**\n"
              f"- Source shadow run: `{os.environ['SOURCE_RUN_ID']}`\n"
              f"- Source registered commit: `{os.environ['SOURCE_COMMIT']}`\n"
              f"- Source artifact ID: `{os.environ['ARTIFACT_ID']}`\n"
              f"- Source artifact digest: `{os.environ['ARTIFACT_DIGEST']}`\n"
              f"- Derivation commit: `{os.environ['DERIVATION_COMMIT']}`\n"
              f"- Derivation workflow run: `{os.environ['DERIVATION_RUN_ID']}`\n"
              + detail
              + "- Source refetch: **false**\n"
              + "- Raw HTML / SQLite uploaded in derived artifact: **false**\n"
              + "- Production DB/Review/publication/deploy/scheduler/apply: **false / not authorized**\n"
          )
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/issues/26/comments",
              data=json.dumps({"body": body}).encode(),
              headers=headers,
              method="POST",
          )
          urllib.request.urlopen(request, timeout=20).read()
          PY
