name: Diagnose #256 production deploy

on:
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    name: Inspect target deploy run
    if: >-
      github.event.pull_request.head.ref == 'diag/256-inspect-weekly-prewarm-deploy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for #256 deploy completion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: 0b0eae46cf269d697d85698e5f3abc540a635c45
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          target = os.environ["TARGET_SHA"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "hermes-deals-deploy-inspector/1",
          }

          def get_json(url: str):
              with urllib.request.urlopen(
                  urllib.request.Request(url, headers=headers),
                  timeout=20,
              ) as response:
                  return json.load(response)

          selected = None
          for attempt in range(61):
              payload = get_json(
                  f"https://api.github.com/repos/{repo}/actions/workflows/deploy-main.yml/runs?per_page=50"
              )
              matches = [
                  row for row in (payload.get("workflow_runs") or [])
                  if row.get("head_sha") == target
                  and row.get("event") == "workflow_run"
              ]
              if matches:
                  selected = max(matches, key=lambda row: int(row.get("id") or 0))
                  print(
                      "TARGET_DEPLOY "
                      f"attempt={attempt + 1} id={selected.get('id')} "
                      f"run_number={selected.get('run_number')} "
                      f"status={selected.get('status')} "
                      f"conclusion={selected.get('conclusion')}"
                  )
                  if selected.get("status") == "completed":
                      break
              else:
                  print(f"TARGET_DEPLOY attempt={attempt + 1} status=NOT_FOUND")
              time.sleep(10)

          if not selected:
              raise SystemExit("target deploy run not found")
          if selected.get("status") != "completed":
              raise SystemExit("target deploy did not complete within wait budget")

          run_id = int(selected["id"])
          jobs = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"
          ).get("jobs") or []
          for job in jobs:
              print(
                  "TARGET_DEPLOY_JOB "
                  f"id={job.get('id')} name={job.get('name')} "
                  f"status={job.get('status')} conclusion={job.get('conclusion')}"
              )
              for step in job.get("steps") or []:
                  print(
                      "TARGET_DEPLOY_STEP "
                      f"job_id={job.get('id')} number={step.get('number')} "
                      f"name={step.get('name')} conclusion={step.get('conclusion')}"
                  )

          artifacts = get_json(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
          ).get("artifacts") or []
          for artifact in artifacts:
              print(
                  "TARGET_DEPLOY_ARTIFACT "
                  f"id={artifact.get('id')} name={artifact.get('name')} "
                  f"size={artifact.get('size_in_bytes')} expired={artifact.get('expired')}"
              )

          print(
              "TARGET_DEPLOY_RESULT "
              f"id={run_id} conclusion={selected.get('conclusion')}"
          )
          if selected.get("conclusion") != "success":
              raise SystemExit("target deploy failed")
          PY
