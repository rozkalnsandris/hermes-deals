name: Diagnose #256 weekly post-prewarm latency

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify parser-warm weekly MISS
    if: >-
      github.event.pull_request.head.ref == 'diag/256-inspect-weekly-prewarm-deploy' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'rozkalnsandris'
    runs-on: [self-hosted, Linux, ARM64, hermes-deals-release]
    timeout-minutes: 5
    steps:
      - name: Wait for natural weekly cache MISS and measure
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from datetime import datetime, timedelta
          import ipaddress
          import json
          import re
          import subprocess
          from time import perf_counter, sleep
          from urllib.parse import urlencode
          from urllib.request import ProxyHandler, Request, build_opener
          from zoneinfo import ZoneInfo

          opener = build_opener(ProxyHandler({}))

          def parse_local(value: str):
              value = value.strip()
              if value.startswith("[") and "]:" in value:
                  host, port = value[1:].rsplit("]:", 1)
              else:
                  host, port = value.rsplit(":", 1)
              if not port.isdigit():
                  return None
              if host in {"*", "0.0.0.0", "::", ""}:
                  host = "127.0.0.1"
              if "%" in host:
                  host = host.split("%", 1)[0]
              try:
                  parsed = ipaddress.ip_address(host)
              except ValueError:
                  return None
              url_host = f"[{parsed.compressed}]" if parsed.version == 6 else parsed.compressed
              return f"http://{url_host}:{int(port)}"

          def fetch(base: str, path: str, timeout: float = 10.0):
              request = Request(
                  base + path,
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                      "User-Agent": "hermes-deals-post-prewarm-diagnostic/1",
                  },
              )
              started = perf_counter()
              with opener.open(request, timeout=timeout) as response:
                  body = response.read()
                  wall_ms = (perf_counter() - started) * 1000
                  return response.status, response.headers, body, wall_ms

          sockets = subprocess.run(
              ["ss", "-H", "-ltn"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.splitlines()
          candidates = []
          for line in sockets:
              parts = line.split()
              if len(parts) < 4:
                  continue
              candidate = parse_local(parts[3])
              if candidate and candidate not in candidates:
                  candidates.append(candidate)

          base = None
          health = None
          for candidate in candidates:
              try:
                  status, _, body, _ = fetch(candidate, "/api/health", 0.8)
                  payload = json.loads(body)
              except Exception:
                  continue
              if (
                  status == 200
                  and payload.get("status") == "ok"
                  and payload.get("service") == "hermes-deals-api"
              ):
                  base = candidate
                  health = payload
                  break
          if base is None or health is None:
              raise SystemExit("production origin not found")

          today = datetime.now(ZoneInfo("Europe/Berlin")).date()
          week_start = today - timedelta(days=today.weekday())
          path = "/api/v1/deals/weekly-specials?" + urlencode(
              {"week_start": week_start.isoformat()}
          )
          timing_re = re.compile(r"weekly;dur=([0-9.]+)")

          miss = None
          for attempt in range(21):
              status, headers, body, wall_ms = fetch(base, path)
              cache = str(headers.get("X-Hermes-Weekly-Cache") or "")
              timing_match = timing_re.search(str(headers.get("Server-Timing") or ""))
              server_ms = float(timing_match.group(1)) if timing_match else None
              print(
                  "POST_PREWARM_WAIT "
                  f"attempt={attempt + 1} status={status} cache={cache or '(missing)'} "
                  f"wall_ms={wall_ms:.2f} server_ms={server_ms}"
              )
              assert status == 200
              if cache == "MISS":
                  miss = (headers, body, wall_ms, server_ms)
                  break
              sleep(2)

          if miss is None:
              raise AssertionError("weekly response cache did not naturally expire within 40 seconds")

          miss_headers, miss_body, miss_wall_ms, miss_server_ms = miss
          payload = json.loads(miss_body)
          status, warm_headers, warm_body, warm_wall_ms = fetch(base, path)
          warm_cache = str(warm_headers.get("X-Hermes-Weekly-Cache") or "")
          warm_match = timing_re.search(str(warm_headers.get("Server-Timing") or ""))
          warm_server_ms = float(warm_match.group(1)) if warm_match else None

          print(
              "POST_PREWARM_SUMMARY "
              f"week_start={week_start.isoformat()} count={payload.get('count')} "
              f"miss_wall_ms={miss_wall_ms:.2f} miss_server_ms={miss_server_ms} "
              f"warm_wall_ms={warm_wall_ms:.2f} warm_server_ms={warm_server_ms} "
              f"warm_cache={warm_cache} version={health.get('version')} phase={health.get('phase')}"
          )

          assert payload.get("week_start") == week_start.isoformat()
          assert payload.get("source_contract") == "single_week_query_short_periods_plus_explicit_immutable_daily_evidence"
          assert miss_server_ms is not None
          assert miss_wall_ms < 1000.0
          assert status == 200
          assert warm_cache == "HIT"
          assert warm_wall_ms < 250.0
          assert warm_body == miss_body
          PY
