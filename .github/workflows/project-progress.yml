name: Update project progress

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/project-progress.yml"
      - "docs/project-progress.json"
      - "tools/update_project_progress.py"
  schedule:
    - cron: "17 6 * * *"
      timezone: "Europe/Berlin"
    - cron: "17 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: hermes-deals-project-progress
  cancel-in-progress: false

jobs:
  update-project-progress:
    name: Update auditable project progress
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify default-branch execution
        env:
          EXPECTED_REF: refs/heads/main
        run: |
          test "${GITHUB_REF}" = "${EXPECTED_REF}"

      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check scheduled freshness
        id: freshness
        env:
          PROGRESS_TIMEZONE: Europe/Berlin
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          refresh = True
          reason = "non-scheduled trigger"

          if os.environ["GITHUB_EVENT_NAME"] == "schedule":
              reason = "snapshot missing, invalid, or stale"
              try:
                  snapshot = json.loads(
                      Path("docs/project-progress-latest.json").read_text(encoding="utf-8")
                  )
                  zone = ZoneInfo(os.environ["PROGRESS_TIMEZONE"])
                  generated = datetime.fromisoformat(str(snapshot["generated_at_local"]))
                  generated_day = generated.astimezone(zone).date()
                  current_day = datetime.now(zone).date()
                  if generated_day == current_day:
                      refresh = False
                      reason = "snapshot already generated today"
              except (OSError, KeyError, TypeError, ValueError, json.JSONDecodeError):
                  refresh = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"refresh={'true' if refresh else 'false'}\n")

          print(f"PROJECT_PROGRESS_REFRESH={'yes' if refresh else 'no'}")
          print(f"PROJECT_PROGRESS_REASON={reason}")
          PY

      - name: Generate progress snapshot and README block
        if: steps.freshness.outputs.refresh == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python tools/update_project_progress.py

      - name: Commit changed generated files
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          if git diff --quiet -- README.md docs/project-progress-latest.json; then
            echo "Project progress is already current."
            exit 0
          fi

          git diff --check -- README.md docs/project-progress-latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/project-progress-latest.json
          git commit -m "docs: update project progress [skip ci]"
          git push origin HEAD:main
