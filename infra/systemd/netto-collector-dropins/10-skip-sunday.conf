# The production collector selects a prospect whose validity includes "today".
# Netto has a Sunday gap between the Saturday-ending period and the next
# Monday-starting period. The separate new-week workflow is unaffected; this
# current-only daily collector skips Sunday instead of leaving a failed unit.
[Service]
ExecCondition=/bin/sh -c 'test "$(/usr/bin/date +%%u)" -ne 7'
