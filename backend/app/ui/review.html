<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hermes Deals — Pārskatīšana</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#f6f7f8;color:#17191c}
    header{padding:18px 20px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:4}
    h1{font-size:22px;margin:0 0 4px}.muted{color:#686d74}
    main{max-width:1280px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
    .panel{background:white;border:1px solid #ddd;border-radius:14px;overflow:hidden}
    .toolbar{padding:14px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #eee}
    select,button,input,textarea{font:inherit}
    select,input,textarea{width:100%;padding:10px;border:1px solid #c9cdd2;border-radius:9px;background:white}
    button{padding:10px 13px;border:1px solid #bbb;border-radius:9px;background:white;cursor:pointer}
    button.primary,.danger{font-weight:700}
    #list{max-height:calc(100vh - 175px);overflow:auto}
    .row{padding:12px 14px;border-bottom:1px solid #eee;cursor:pointer}
    .row:hover,.row.active{background:#f0f2f4}.row strong{display:block}
    .badge{display:inline-block;font-size:12px;border:1px solid #bbb;border-radius:999px;padding:2px 7px;margin-right:5px}
    #detail{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}
    .full{grid-column:1/-1}
    .source{padding:12px;background:#f4f5f6;border-radius:10px;margin-bottom:14px;word-break:break-word}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f5f5;padding:10px;border-radius:8px}
    img.crop{max-width:100%;border-radius:10px;border:1px solid #ddd;margin-top:10px}
    @media(max-width:820px){main{grid-template-columns:1fr}#list{max-height:42vh}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header>
  <h1>Lidl — Pārskatīšanas rinda</h1>
  <div class="muted">Neskaidrie piedāvājumi paliek ārpus production līdz manuālai apstiprināšanai.</div>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <select id="status">
        <option value="">Visi statusi</option>
        <option value="pending" selected>Gaida pārbaudi</option>
        <option value="draft">Labots</option>
        <option value="needs_followup">Jāpārbauda vēl</option>
        <option value="approved">Publicēts</option>
        <option value="rejected">Noraidīts</option>
      </select>
      <button id="reload">Atjaunot</button>
      <a href="/ui">Atpakaļ uz Deals</a>
    </div>
    <div id="list"><div class="row muted">Ielādē…</div></div>
  </section>

  <section class="panel">
    <div id="detail">
      <div class="muted">Izvēlies produktu kreisajā pusē.</div>
    </div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let selected=null;
function val(o,...keys){for(const k of keys){if(o?.[k]!==undefined&&o[k]!==null)return o[k]}return""}
async function load(){
  const status=$("status").value;
  const q=new URLSearchParams({source_chain:"lidl",limit:"500"});
  if(status)q.set("status",status);
  const r=await fetch("/api/v1/review-items?"+q);
  const d=await r.json();
  const items=d.items||[];
  $("list").innerHTML=items.length?items.map(x=>`<div class="row" data-id="${esc(x.id)}"><strong>${esc(val(x.effective_payload,"product_name","product_name_raw")||"Bez nosaukuma")}</strong><span class="badge">${esc(x.status)}</span><span class="badge">lapa ${esc(x.page_number??"—")}</span><span class="muted">${esc(val(x.effective_payload,"price_eur"))} € · ${esc(val(x.effective_payload,"package_text","package_text_raw"))}</span></div>`).join(""):'<div class="row muted">Rinda ir tukša.</div>';
  document.querySelectorAll(".row[data-id]").forEach(n=>n.onclick=()=>openItem(n.dataset.id));
}
function field(id,label,value,type="text"){const step=type==="number"?' step="0.01"':"";return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}"${step} value="${esc(value)}"></div>`}
async function openItem(id){
  const r=await fetch("/api/v1/review-items/"+id);
  if(!r.ok)return;
  selected=await r.json();
  document.querySelectorAll(".row").forEach(n=>n.classList.toggle("active",n.dataset.id===id));
  const e=selected.effective_payload||{},p=selected.provenance||{};
  const crop=p.crop_url?`<img class="crop" src="${esc(p.crop_url)}" alt="Bukleta fragments">`:"";
  $("detail").innerHTML=`
    <h2>${esc(val(e,"product_name","product_name_raw")||"Piedāvājums")}</h2>
    <div class="source"><strong>${esc(selected.source_flyer_key)}</strong><br>Lapa ${esc(selected.page_number??"—")} · ${esc(selected.parser_version)}<br>${selected.reason_codes.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}${crop}</div>
    <div class="grid">
      ${field("f_name","Produkta nosaukums",val(e,"product_name","product_name_raw"))}
      ${field("f_brand","Zīmols",val(e,"brand","brand_raw"))}
      ${field("f_package","Iepakojums",val(e,"package_text","package_text_raw"))}
      ${field("f_price","Cena €",val(e,"price_eur"),"number")}
      ${field("f_regular","Parastā cena €",val(e,"regular_price_eur"),"number")}
      ${field("f_app","Lidl Plus cena €",val(e,"app_price_eur"),"number")}
      ${field("f_from","Spēkā no",val(e,"valid_from"),"date")}
      ${field("f_until","Spēkā līdz",val(e,"valid_until"),"date")}
      <div><label>Scope</label><select id="f_scope"><option value="review">review</option><option value="in_scope">in_scope</option><option value="excluded">excluded</option></select></div>
      <div><label>Kanāls</label><select id="f_channel"><option value="physical_store">physical_store</option><option value="online_only">online_only</option></select></div>
      <div class="full"><label>Piezīme</label><textarea id="f_note" rows="3">${esc(selected.reviewer_note??"")}</textarea></div>
    </div>
    <div class="actions">
      <button class="primary" id="save">Saglabāt labojumu</button>
      <button id="follow">Jāpārbauda vēl</button>
      <button class="primary" id="approve">Apstiprināt un publicēt</button>
      <button class="danger" id="reject">Noraidīt</button>
      <button id="reopen">Atgriezt gaidīšanā</button>
    </div>
    <details><summary>Oriģinālais parsera ieraksts</summary><pre>${esc(JSON.stringify(selected.original_payload,null,2))}</pre></details>
    <details><summary>Audit trail</summary><pre>${esc(JSON.stringify(selected.revisions||[],null,2))}</pre></details>`;
  $("f_scope").value=val(e,"scope")||"review";
  $("f_channel").value=val(e,"channel")||"physical_store";
  $("save").onclick=()=>save(false);
  $("follow").onclick=()=>save(true);
  $("approve").onclick=approve;
  $("reject").onclick=reject;
  $("reopen").onclick=reopen;
}
function corrections(){
  const g=id=>$(id).value.trim();
  return {
    product_name:g("f_name"),
    brand:g("f_brand")||null,
    package_text:g("f_package")||null,
    price_eur:g("f_price")||null,
    regular_price_eur:g("f_regular")||null,
    app_price_eur:g("f_app")||null,
    valid_from:g("f_from")||null,
    valid_until:g("f_until")||null,
    scope:$("f_scope").value,
    channel:$("f_channel").value
  };
}
async function call(url,opt){
  const r=await fetch(url,opt);
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    alert(d.detail||"Darbība neizdevās");
    throw new Error(d.detail||"request failed");
  }
  await load();
  await openItem(selected.id);
}
async function save(needs){
  await call("/api/v1/review-items/"+selected.id,{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      corrections:corrections(),
      note:$("f_note").value,
      needs_followup:needs
    })
  });
}
async function approve(){
  await save(false);
  await call("/api/v1/review-items/"+selected.id+"/approve",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note").value})
  });
}
async function reject(){
  await call("/api/v1/review-items/"+selected.id+"/reject",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note").value})
  });
}
async function reopen(){
  await call("/api/v1/review-items/"+selected.id+"/reopen",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note").value})
  });
}
$("reload").onclick=load;
$("status").onchange=load;
load();
</script>
</body>
</html>
