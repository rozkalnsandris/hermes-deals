<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23171914'/%3E%3Ctext x='32' y='44' font-size='38' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E">
  <title>Hermes Deals — Pārskatīšana</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:#f6f7f8;color:#17191c}
    header{padding:18px 20px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:4}
    h1{font-size:22px;margin:0 0 4px}.muted{color:#686d74}
    main{max-width:1280px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
    .panel{background:white;border:1px solid #ddd;border-radius:14px;overflow:hidden}
    .toolbar{padding:14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #eee}.toolbar #status{flex:1 1 260px}.toolbar #reviewSearch{flex:2 1 320px}.status-counts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #eee;background:#fafbfc}.status-chip{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:700}.status-chip.active{background:#17191c;color:white;border-color:#17191c}.detail-nav{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #eee;background:#fafbfc;position:sticky;top:0;z-index:2}.detail-nav .position{margin-left:auto;color:#686d74;font-size:13px;font-weight:700}.dirty-state{display:inline-flex;margin-left:8px;padding:3px 8px;border-radius:999px;background:#fff3c4;border:1px solid #d7b94c;color:#5c4b00;font-size:12px;font-weight:800;vertical-align:middle}.actions.sticky-actions{position:sticky;bottom:0;padding:12px;background:rgba(255,255,255,.96);border-top:1px solid #ddd;box-shadow:0 -8px 20px rgba(0,0,0,.06);z-index:3}.shortcut-note{font-size:12px;color:#686d74;margin-left:auto;align-self:center}
    select,button,input,textarea{font:inherit}
    select,input,textarea{width:100%;padding:10px;border:1px solid #c9cdd2;border-radius:9px;background:white}
    button{padding:10px 13px;border:1px solid #bbb;border-radius:9px;background:white;cursor:pointer}
    button.primary,.danger{font-weight:700}button:disabled{cursor:wait;opacity:.58}
    #list{max-height:calc(100vh - 175px);overflow:auto}
    .row{display:block;width:100%;padding:12px 14px;border:0;border-bottom:1px solid #eee;border-radius:0;background:white;color:inherit;text-align:left;cursor:pointer}
    .row:hover,.row.active{background:#f0f2f4}.row.active{box-shadow:inset 4px 0 #17191c}.row:focus-visible{outline:3px solid #8ab4f8;outline-offset:-3px}.row strong{display:block}.row .match{background:#fff0a8;border-radius:3px;padding:0 1px}
    .badge{display:inline-block;font-size:12px;border:1px solid #bbb;border-radius:999px;padding:2px 7px;margin-right:5px}.badge.pending{background:#fff6d8;border-color:#e0bd4f}.badge.draft{background:#e8f0ff;border-color:#82a9eb}.badge.needs_followup{background:#fff0e5;border-color:#e0a16e}.badge.approved{background:#e5f5e9;border-color:#79b888}.badge.rejected{background:#f4e8e8;border-color:#c79292}.queue-count{align-self:center;font-size:13px;font-weight:700;color:#686d74;margin-left:auto}.toast{position:fixed;right:18px;bottom:18px;z-index:20;max-width:min(420px,calc(100vw - 36px));padding:12px 14px;border-radius:11px;background:#17191c;color:white;box-shadow:0 14px 32px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease}.toast.show{opacity:1;transform:none}.toast.error{background:#8f2525}.readonly-form input:disabled,.readonly-form select:disabled,.readonly-form textarea:disabled,.readonly-form button:disabled{opacity:.72;cursor:not-allowed;background:#f3f4f5;color:#555}
    #detail{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    label{display:block;font-size:12px;font-weight:700;margin:0 0 5px}.date-entry{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:7px;align-items:center}.date-picker-button{width:44px;height:42px;border:1px solid #bbb;border-radius:9px;background:white;display:grid;place-items:center;font-size:16px}.native-date-proxy{position:absolute;right:0;top:0;width:44px;height:42px;opacity:.01;border:0;padding:0;pointer-events:none}
    .full{grid-column:1/-1}
    .source{padding:12px;background:#f4f5f6;border-radius:10px;margin-bottom:14px;word-break:break-word}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:#f5f5f5;padding:10px;border-radius:8px}
    img.crop,img.preview{display:block;max-width:100%;border-radius:10px;border:1px solid #ddd;margin-top:10px;background:#f3f4f5}
    .preview-block{padding:12px;background:#f4f5f6;border-radius:10px;margin:12px 0}.preview-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.preview-note{padding:10px;border:1px dashed #bbb;border-radius:9px;margin-top:10px}.hint-preview{margin-top:10px}
    @media(max-width:820px){main{grid-template-columns:1fr;padding:10px}.toolbar{padding:10px}.toolbar #status,.toolbar #reviewSearch{flex:1 1 100%}#list{max-height:38vh}.grid{grid-template-columns:1fr}.detail-nav{top:0}.actions.sticky-actions{bottom:0}.shortcut-note{display:none}}

    /* Issue #32 Review mobile contract. */
    html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}
    main,.panel,.toolbar,#detail,.grid,.source,.preview-block,.actions{min-width:0;max-width:100%}
    .source,pre,.preview-note,.row strong{overflow-wrap:anywhere}
    .date-entry,.date-entry input{min-width:0;max-width:100%}
    .native-date-proxy{max-width:100%}
    button,input,select,textarea{max-width:100%}
    @media(max-width:820px){
      header{position:static;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
      main{width:100%;padding:10px max(10px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
      #list{max-height:min(42vh,360px)}
      .detail-nav{position:sticky;top:0;flex-wrap:wrap}
      .actions.sticky-actions{padding-bottom:max(12px,env(safe-area-inset-bottom))}
      .grid{grid-template-columns:minmax(0,1fr)}
    }
    @media(max-width:560px){
      .toolbar>*{flex:1 1 100%;width:100%}
      .toolbar a{display:grid;min-height:44px;place-items:center}
      .detail-nav button{flex:1 1 calc(50% - 4px);min-height:44px}
      .detail-nav .position{width:100%;margin-left:0;text-align:center}
      .actions.sticky-actions button{flex:1 1 100%;min-height:44px}
      .date-entry{grid-template-columns:minmax(0,1fr) 44px}
    }
  </style>
</head>
<body>
<header>
  <h1>Lidl — Pārskatīšanas rinda</h1>
  <div class="muted">Neskaidrie piedāvājumi paliek ārpus production līdz manuālai apstiprināšanai.</div>
</header>
<main>
  <section class="panel">
    <div class="toolbar">
      <input id="reviewSearch" type="search" placeholder="Meklēt nosaukumu, cenu, iepakojumu vai lapu…" autocomplete="off" aria-label="Meklēt pārskatīšanas rindā">
      <select id="status">
        <option value="open" selected>Atvērtie (gaida + laboti + jāpārbauda)</option>
        <option value="">Visi statusi</option>
        <option value="pending">Gaida pārbaudi</option>
        <option value="draft">Labots</option>
        <option value="needs_followup">Jāpārbauda vēl</option>
        <option value="approved">Publicēts</option>
        <option value="rejected">Noraidīts</option>
      </select>
      <button id="reload" type="button">Atjaunot</button>
      <a href="/ui">Atpakaļ uz Deals</a>
      <span id="queueCount" class="queue-count" aria-live="polite"></span>
    </div>
    <div id="statusCounts" class="status-counts" aria-label="Statusu kopsavilkums"></div>
    <div id="list"><div class="row muted">Ielādē…</div></div>
  </section>

  <section class="panel">
    <div class="detail-nav" aria-label="Pārskatīšanas navigācija"><button id="prevItem" type="button">← Iepriekšējais</button><button id="nextItem" type="button">Nākamais →</button><span id="detailPosition" class="position">—</span></div>
    <div id="detail">
      <div class="muted">Izvēlies produktu kreisajā pusē.</div>
    </div>
  </section>
</main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const OPEN_STATUSES=new Set(["pending","draft","needs_followup"]);
const TERMINAL_STATUSES=new Set(["approved","rejected"]);
const REVIEW_REFRESH_KEY="hermesDealsReviewRefresh";
const dealsRefreshChannel="BroadcastChannel" in window?new BroadcastChannel("hermes-deals-review"):null;
let selected=null,busy=false,toastTimer=null,allItems=[],dirty=false,initialFormState="",searchTimer=null,lastStatus="open";
function val(o,...keys){for(const k of keys){if(o?.[k]!==undefined&&o[k]!==null)return o[k]}return""}
function statusLabel(status){return {pending:"Gaida pārbaudi",draft:"Labots",needs_followup:"Jāpārbauda vēl",approved:"Publicēts",rejected:"Noraidīts"}[status]||status;}
function canReopenStatus(status){return ["draft","needs_followup","rejected"].includes(status);}
function pageAlertChildParentId(item){return String(item?.provenance?.parent_page_alert_id||item?.original_payload?.weekly_page_alert_parent_id||"");}
function pageAlertAggregate(alert){
  const payload=alert?.original_payload||{},hints=Array.isArray(payload.hints)?payload.hints:[];
  const declared=Number(payload.hint_count);
  const hintCount=Math.max(Number.isInteger(declared)&&declared>=0?declared:0,hints.length);
  const childGroups=new Map();
  for(const item of allItems){
    if(item?.review_kind==="page_alert"||pageAlertChildParentId(item)!==String(alert?.id||""))continue;
    const hintIndex=Number(item?.provenance?.hint_index);
    if(!Number.isInteger(hintIndex)||hintIndex<0||hintIndex>=hintCount)continue;
    if(!childGroups.has(hintIndex))childGroups.set(hintIndex,[]);
    childGroups.get(hintIndex).push(item);
  }
  const children=[...childGroups.values()].flat();
  const linkedCount=childGroups.size;
  const openCount=children.filter(item=>OPEN_STATUSES.has(item.status)).length;
  const terminalCount=children.filter(item=>TERMINAL_STATUSES.has(item.status)).length;
  const unresolvedChildCount=children.length-terminalCount;
  const allHintsLinked=hintCount>0&&linkedCount===hintCount;
  const resolvedByChildren=allHintsLinked&&unresolvedChildCount===0;
  const manuallyResolved=alert?.status==="rejected"&&unresolvedChildCount===0;
  return {hintCount,linkedCount,openCount,terminalCount,unresolvedChildCount,allHintsLinked,resolvedByChildren,manuallyResolved,resolved:resolvedByChildren||manuallyResolved,childGroups};
}
function effectiveReviewStatus(item){
  if(item?.review_kind!=="page_alert")return item?.status;
  const aggregate=pageAlertAggregate(item);
  if(aggregate.resolved)return "rejected";
  return item?.status==="rejected"?"pending":item?.status;
}
function reviewStatusLabel(item,status=effectiveReviewStatus(item)){return item?.review_kind==="page_alert"&&status==="rejected"?"Pārbaudīts":statusLabel(status);}
function detailMessage(detail,fallback){if(typeof detail==="string"&&detail.trim())return detail;if(Array.isArray(detail)){const text=detail.map(item=>item?.msg||item?.message||"").filter(Boolean).join("; ");if(text)return text;}if(detail&&typeof detail==="object"){if(typeof detail.message==="string")return detail.message;try{return JSON.stringify(detail);}catch{}}return fallback;}
function showToast(message,error=false){const node=$("toast");node.textContent=message;node.classList.toggle("error",error);node.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove("show"),3200);}
function updateProductActionAvailability(){
  const approveButton=$("approve");
  if(!approveButton)return;
  const scope=$("f_scope")?.value;
  const channel=$("f_channel")?.value;
  const excluded=scope==="excluded";
  const wrongChannel=channel!=="physical_store";
  approveButton.disabled=busy||excluded||wrongChannel;
  approveButton.title=excluded
    ?"Izslēgtu piedāvājumu nevar publicēt."
    :(wrongChannel?"Publicēt drīkst tikai physical_store piedāvājumu.":"");
}
function setBusy(next){busy=Boolean(next);document.querySelectorAll("#detail button,#reload,#status,#reviewSearch,#statusCounts button").forEach(node=>node.disabled=busy);updateProductActionAvailability();updateDetailNav();}
function searchNeedle(){return $("reviewSearch").value.trim().toLocaleLowerCase("de-DE");}
function statusFilteredItems(){const status=$("status").value;return status==="open"?allItems.filter(item=>OPEN_STATUSES.has(effectiveReviewStatus(item))):status?allItems.filter(item=>effectiveReviewStatus(item)===status):allItems.slice();}
function itemSearchText(item){const p=item.effective_payload||{},o=item.original_payload||{};return [p.product_name,p.product_name_raw,p.brand,p.brand_raw,p.package_text,p.package_text_raw,p.price_eur,item.page_number,reviewStatusLabel(item),...(item.reason_codes||[]),o.hint_count].filter(v=>v!==null&&v!==undefined).join(" ").toLocaleLowerCase("de-DE");}
function filteredItems(){const base=statusFilteredItems(),needle=searchNeedle();return needle?base.filter(item=>itemSearchText(item).includes(needle)):base;}
function renderStatusCounts(){const counts={pending:0,draft:0,needs_followup:0,approved:0,rejected:0};for(const item of allItems){const status=effectiveReviewStatus(item);if(status in counts)counts[status]++;}const open=counts.pending+counts.draft+counts.needs_followup,current=$("status").value;const chips=[["open",`Atvērtie ${open}`],["pending",`Gaida ${counts.pending}`],["draft",`Laboti ${counts.draft}`],["needs_followup",`Jāpārbauda ${counts.needs_followup}`],["approved",`Publicēti ${counts.approved}`],["rejected",`Noraidīti ${counts.rejected}`],["",`Visi ${allItems.length}`]];$("statusCounts").innerHTML=chips.map(([value,label])=>`<button type="button" class="status-chip${value===current?" active":""}" data-status-value="${esc(value)}" ${busy?"disabled":""}>${esc(label)}</button>`).join("");$("statusCounts").querySelectorAll("[data-status-value]").forEach(button=>button.onclick=()=>changeStatus(button.dataset.statusValue));}
function editableFormState(){return JSON.stringify([...document.querySelectorAll("#detail .grid input,#detail .grid select,#detail .grid textarea")].filter(node=>!node.disabled).map(node=>[node.id,node.value]));}
function setDirty(next){dirty=Boolean(next);const node=$("dirtyState");if(node)node.hidden=!dirty;}
function captureFormState(){initialFormState=editableFormState();setDirty(false);document.querySelectorAll("#detail .grid input,#detail .grid select,#detail .grid textarea").forEach(node=>{node.addEventListener("input",()=>setDirty(editableFormState()!==initialFormState));node.addEventListener("change",()=>setDirty(editableFormState()!==initialFormState));});}
function confirmDiscard(){return !dirty||window.confirm("Ir nesaglabātas izmaiņas. Turpināt un tās atmest?");}
function visibleRowIds(){return [...document.querySelectorAll(".row[data-id]")].map(node=>node.dataset.id);}
function updateDetailNav(){const ids=visibleRowIds(),index=selected?ids.indexOf(selected.id):-1;$("prevItem").disabled=busy||index<=0;$("nextItem").disabled=busy||index<0||index>=ids.length-1;$("detailPosition").textContent=index>=0?`${index+1} no ${ids.length}`:`${ids.length} rindas`;}
function syncReviewUrl(itemId=selected?.id||""){const p=new URLSearchParams();if($("status").value!=="open")p.set("status",$("status").value);if($("reviewSearch").value.trim())p.set("q",$("reviewSearch").value.trim());if(itemId)p.set("item",itemId);history.replaceState(null,"",`${location.pathname}${p.toString()?`?${p}`:""}`);}
function notifyDealsRefresh(item){const message={type:"review-published",item_id:item?.id||null,at:Date.now()};dealsRefreshChannel?.postMessage(message);try{localStorage.setItem(REVIEW_REFRESH_KEY,JSON.stringify(message));}catch{}}
function preferredNextRowId(itemId){const ids=[...document.querySelectorAll(".row[data-id]")].map(node=>node.dataset.id),i=ids.indexOf(itemId);return i>=0?(ids[i+1]||ids[i-1]||null):null;}
function replaceAuthoritativeItem(item){
  if(!item?.id)return;
  const index=allItems.findIndex(current=>current.id===item.id);
  if(index>=0)allItems[index]=item;
  else allItems.push(item);
  if(selected?.id===item.id)selected=item;
}
function renderEmptyDetail(message="Izvēlies produktu kreisajā pusē."){selected=null;setDirty(false);$("detail").innerHTML=`<div class="muted">${esc(message)}</div>`;updateDetailNav();syncReviewUrl("");}
function previewUrl(id,mode="page",hintIndex=null){const q=new URLSearchParams({mode});if(hintIndex!==null)q.set("hint_index",String(hintIndex));return `/api/v1/review-items/${encodeURIComponent(id)}/page-preview?${q}`;}
function wirePreviewErrors(){document.querySelectorAll("img[data-preview]").forEach(img=>{img.addEventListener("error",()=>{img.hidden=true;const note=img.parentElement?.querySelector("[data-preview-error]");if(note)note.hidden=false;},{once:true});});}
async function renderList(preferredId=null){
  const statusItems=statusFilteredItems(),items=filteredItems(),needle=searchNeedle();
  $("queueCount").textContent=needle?`${items.length} no ${statusItems.length}`:`${items.length} ${items.length===1?"ieraksts":"ieraksti"}`;
  $("list").innerHTML=items.length?items.map(x=>{
    const status=effectiveReviewStatus(x);
    const statusBadge=`<span class="badge ${esc(status)}">${esc(reviewStatusLabel(x,status))}</span>`;
    if(x.review_kind==="page_alert"){
      const aggregate=pageAlertAggregate(x);
      const progress=aggregate.resolvedByChildren
        ?`Visi ${aggregate.hintCount} hinti ir pabeigti`
        :(aggregate.manuallyResolved
          ?"Lapa ir manuāli pārbaudīta"
          :`${aggregate.linkedCount}/${aggregate.hintCount} hinti izveidoti · ${aggregate.terminalCount} pabeigti`);
      return `<button type="button" class="row" data-id="${esc(x.id)}"><strong>⚠ Lidl lapa ${esc(x.page_number??"—")}</strong>${statusBadge}<span class="badge">lapas pārbaude</span><span class="muted">${esc(progress)}</span></button>`;
    }
    return `<button type="button" class="row" data-id="${esc(x.id)}"><strong>${esc(val(x.effective_payload,"product_name","product_name_raw")||"Bez nosaukuma")}</strong>${statusBadge}<span class="badge">lapa ${esc(x.page_number??"—")}</span><span class="muted">${esc(val(x.effective_payload,"price_eur"))} € · ${esc(val(x.effective_payload,"package_text","package_text_raw"))}</span></button>`;
  }).join(""):'<div class="row muted">Šim filtram nekas nav atrasts.</div>';
  document.querySelectorAll(".row[data-id]").forEach(node=>node.onclick=()=>{if(confirmDiscard())openItem(node.dataset.id);});
  renderStatusCounts();
  if(preferredId&&items.some(item=>item.id===preferredId))await openItem(preferredId);
  else if(selected&&items.some(item=>item.id===selected.id)){document.querySelector(`.row[data-id="${CSS.escape(selected.id)}"]`)?.classList.add("active");updateDetailNav();}
  else if(preferredId&&items.length)await openItem(items[0].id);
  else if(preferredId&&!items.length)renderEmptyDetail("Šajā filtrā vairs nav rindu pārbaudei.");
  else updateDetailNav();
  syncReviewUrl();
  return items;
}
async function load(preferredId=null,{preserveOnError=false}={}){
  try{
    const r=await fetch("/api/v1/review-items?source_chain=lidl&limit=500",{headers:{Accept:"application/json"}});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(detailMessage(d.detail,`HTTP ${r.status}`));
    allItems=d.items||[];
    await renderList(preferredId);
    return true;
  }catch(error){
    if(!preserveOnError){
      $("queueCount").textContent="";
      $("statusCounts").innerHTML="";
      $("list").innerHTML=`<div class="row muted">Neizdevās ielādēt: ${esc(error?.message||String(error))}</div>`;
      showToast("Pārskatīšanas rindu neizdevās ielādēt.",true);
    }else{
      showToast("Darbība pabeigta, bet sarakstu neizdevās pilnībā atjaunot.",true);
    }
    return false;
  }
}
function fmtDate(v){if(!v)return"";const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v));return m?`${m[3]}.${m[2]}.${m[1]}`:String(v);}
function parseLvDate(v){const m=/^(\d{2})\.(\d{2})\.(\d{4})$/.exec(String(v).trim());if(!m)return null;const iso=`${m[3]}-${m[2]}-${m[1]}`,d=new Date(`${iso}T00:00:00Z`);return Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==iso?null:iso;}
function field(id,label,value,type="text"){if(type==="date")return `<div><label for="${id}">${label}</label><div class="date-entry"><input id="${id}" type="text" inputmode="numeric" autocomplete="off" placeholder="DD.MM.GGGG" value="${esc(fmtDate(value))}"><button type="button" class="date-picker-button" data-date-target="${id}" aria-label="${esc(label)}: atvērt kalendāru" title="Atvērt kalendāru">📅</button><input id="${id}_picker" class="native-date-proxy" type="date" tabindex="-1" aria-label="${esc(label)} kalendārs" value="${esc(value||"")}"></div></div>`;const step=type==="number"?' step="0.01"':"";return `<div><label for="${id}">${label}</label><input id="${id}" type="${type}"${step} value="${esc(value)}"></div>`}
async function createReviewFromHint(index){
  const parentId=selected.id;
  const r=await fetch(
    "/api/v1/review-items/"+encodeURIComponent(parentId)+
    "/page-alert/hints/"+encodeURIComponent(index)+"/create",
    {method:"POST"}
  );
  const d=await r.json().catch(()=>({}));
  if(!r.ok){showToast(detailMessage(d.detail,"Neizdevās izveidot Review produktu"),true);return;}
  replaceAuthoritativeItem(d);
  await renderList(d.id);
  const refreshed=await load(d.id,{preserveOnError:true});
  if(refreshed)showToast("Review produkts izveidots.");
}
async function markPageAlertChecked(){
  await call(
    "/api/v1/review-items/"+encodeURIComponent(selected.id)+"/reject",
    {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({note:"Lapas pārbaude pabeigta."})
    },
    {advance:true,successMessage:"Lapas pārbaude pabeigta."}
  );
}
function renderPageAlert(){
  const p=selected.original_payload||{},hints=Array.isArray(p.hints)?p.hints:[];
  const aggregate=pageAlertAggregate(selected);
  const effectiveStatus=effectiveReviewStatus(selected);
  const backendOpen=OPEN_STATUSES.has(selected.status);
  const hintHtml=hints.map((hint,index)=>{
    const bandUrl=previewUrl(selected.id,"band",index);
    const children=aggregate.childGroups.get(index)||[];
    const child=children[0]||null;
    const childStatus=child?effectiveReviewStatus(child):null;
    const childAction=child
      ?`<div class="actions"><span class="badge ${esc(childStatus)}">${esc(reviewStatusLabel(child,childStatus))}</span><button type="button" data-open-child="${esc(child.id)}">Atvērt Review produktu</button></div>`
      :(backendOpen?`<div class="actions"><button type="button" data-create-hint="${index}">Izveidot Review produktu</button></div>`:"");
    return `<div class="source">
      <strong>${esc(hint.product_name_hint||hint.native_title||"Iespējams produkts")}</strong><br>
      <span class="muted">Native: ${esc(hint.native_title||"—")}</span><br>
      <span class="muted">Scope: ${esc(hint.scope||"review")} · bbox ${esc(JSON.stringify(hint.title_bbox||[]))}</span>
      <div class="hint-preview"><a href="${esc(bandUrl)}" target="_blank" rel="noopener">Atvērt produkta apkārtni</a><img class="preview" data-preview loading="lazy" src="${esc(bandUrl)}" alt="Bukleta fragments ap ${esc(hint.product_name_hint||hint.native_title||"produktu")}"><div class="preview-note muted" data-preview-error hidden>Produkta apkārtnes priekšskatījums nav pieejams.</div></div>
      ${childAction}
    </div>`;}).join("");
  const pageUrl=previewUrl(selected.id,"page");
  const aggregateMessage=aggregate.resolvedByChildren
    ?`Visi ${aggregate.hintCount} hinti ir izveidoti, un visi saistītie Review produkti ir pabeigti. Lapas marķieris ir automātiski pārbaudīts.`
    :(aggregate.manuallyResolved
      ?"Šī lapa ir manuāli atzīmēta kā pārbaudīta."
      :`${aggregate.linkedCount}/${aggregate.hintCount} hinti ir izveidoti; ${aggregate.terminalCount} saistītie Review produkti ir pabeigti.`);
  $("detail").innerHTML=`
    <h2>⚠ Lidl bukleta lapa ${esc(selected.page_number??"—")}</h2>
    <div class="source"><strong>${esc(selected.source_flyer_key)}</strong><br>${esc(selected.parser_version)}<br><span class="badge">lapas pārbaude</span><span class="badge ${esc(effectiveStatus)}">${esc(reviewStatusLabel(selected,effectiveStatus))}</span></div>
    <p>Šeit parseris nav droši rekonstruējis visus produktus. Zemāk ir tikai nosaukuma/pozīcijas hinti — cena un produkta dati netiek izdomāti automātiski.</p>
    <div class="source"><strong>Lapas progress</strong><br><span class="muted">${esc(aggregateMessage)}</span></div>
    <div class="preview-block"><div class="preview-head"><strong>Bukleta lapas priekšskatījums</strong><a href="${esc(pageUrl)}" target="_blank" rel="noopener">Atvērt pilnā izmērā</a></div><img class="preview" data-preview src="${esc(pageUrl)}" alt="Lidl bukleta lapa ${esc(selected.page_number??"—")}"><div class="preview-note muted" data-preview-error hidden>PDF lapas priekšskatījums nav pieejams. Produktu nepublicē, kamēr avota lapa nav apskatāma.</div></div>
    ${hintHtml||'<div class="muted">Hintu nav.</div>'}
    ${backendOpen&&!aggregate.resolved?'<div class="actions"><button class="primary" id="page_checked" type="button">Atzīmēt lapu pārbaudītu</button></div>':""}
    ${selected.status==="rejected"?'<div class="actions"><button id="page_reopen" type="button">Atgriezt lapu pārbaudei</button></div>':""}
    <details><summary>Page alert evidence</summary><pre>${esc(JSON.stringify(selected.original_payload,null,2))}</pre></details>
    <details><summary>Audit trail</summary><pre>${esc(JSON.stringify(selected.revisions||[],null,2))}</pre></details>`;
  document.querySelectorAll("[data-create-hint]").forEach(button=>{
    button.onclick=()=>createReviewFromHint(Number(button.dataset.createHint));
  });
  document.querySelectorAll("[data-open-child]").forEach(button=>{
    button.onclick=()=>openItem(button.dataset.openChild);
  });
  const checked=$("page_checked");
  if(checked)checked.onclick=markPageAlertChecked;
  const pageReopen=$("page_reopen");
  if(pageReopen)pageReopen.onclick=reopen;
  wirePreviewErrors();
}
async function openItem(id){
  const r=await fetch("/api/v1/review-items/"+encodeURIComponent(id),{headers:{Accept:"application/json"}});
  const body=await r.json().catch(()=>({}));
  if(!r.ok){showToast(detailMessage(body.detail,"Ierakstu neizdevās atvērt."),true);return;}
  selected=body;
  replaceAuthoritativeItem(body);
  document.querySelectorAll(".row").forEach(n=>n.classList.toggle("active",n.dataset.id===id));
  if(selected.review_kind==="page_alert"){setDirty(false);renderPageAlert();updateDetailNav();syncReviewUrl(id);return;}
  const e=selected.effective_payload||{},p=selected.provenance||{},open=OPEN_STATUSES.has(selected.status),reopenAllowed=canReopenStatus(selected.status);
  const generatedBand=previewUrl(selected.id,"band");
  const generatedPage=previewUrl(selected.id,"page");
  const hasGeneratedPreview=selected.source_chain==="lidl"&&Boolean(p.source_pdf_sha256||p.pdf_sha256);
  const crop=p.crop_url?`<img class="crop" src="${esc(p.crop_url)}" alt="Bukleta fragments">`:(hasGeneratedPreview?`<div class="preview-block"><div class="preview-head"><strong>Avota fragments</strong><a href="${esc(generatedPage)}" target="_blank" rel="noopener">Atvērt visu lapu</a></div><img class="preview" data-preview src="${esc(generatedBand)}" alt="Bukleta fragments"><div class="preview-note muted" data-preview-error hidden>Avota priekšskatījums nav pieejams. Produktu nepublicē, kamēr avota lapa nav apskatāma.</div></div>`:"");
  $("detail").innerHTML=`
    <h2>${esc(val(e,"product_name","product_name_raw")||"Piedāvājums")}<span id="dirtyState" class="dirty-state" hidden>Nesaglabāts</span></h2>
    <div class="source"><strong>${esc(selected.source_flyer_key)}</strong><br>Lapa ${esc(selected.page_number??"—")} · ${esc(selected.parser_version)}<br><span class="badge ${esc(selected.status)}">${esc(statusLabel(selected.status))}</span>${selected.reason_codes.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}${crop}</div>
    <div class="grid">
      ${field("f_name","Produkta nosaukums",val(e,"product_name","product_name_raw"))}
      ${field("f_brand","Zīmols",val(e,"brand","brand_raw"))}
      ${field("f_package","Iepakojums",val(e,"package_text","package_text_raw"))}
      ${field("f_price","Cena €",val(e,"price_eur"),"number")}
      ${field("f_regular","Parastā cena €",val(e,"regular_price_eur"),"number")}
      ${field("f_unit","Vienības cena €",val(e,"unit_price_eur"),"number")}
      ${field("f_unit_label","Vienība",val(e,"unit_label")||"kg")}
      ${field("f_regular_unit","Parastā vienības cena €",val(e,"regular_unit_price_eur"),"number")}
      ${field("f_example_weight","Piemēra svars g",val(e,"example_weight_g"),"number")}
      <div><label>Cenas režīms</label><select id="f_pricing_mode"><option value="">—</option><option value="fixed_package">fixed_package</option><option value="unit_price_only">unit_price_only</option><option value="example_total_plus_unit">example_total_plus_unit</option><option value="app_example_total_plus_unit">app_example_total_plus_unit</option></select></div>
      <div><label>Nepieciešams Lidl Plus</label><select id="f_requires_app"><option value="false">Nē</option><option value="true">Jā</option></select></div>
      ${field("f_app","Lidl Plus cena €",val(e,"app_price_eur"),"number")}
      ${field("f_from","Spēkā no",val(e,"valid_from"),"date")}
      ${field("f_until","Spēkā līdz",val(e,"valid_until"),"date")}
      <div><label>Scope</label><select id="f_scope"><option value="review">review</option><option value="in_scope">in_scope</option><option value="excluded">excluded</option></select></div>
      <div><label>Kanāls</label><select id="f_channel"><option value="physical_store">physical_store</option><option value="online_only">online_only</option></select></div>
      <div class="full"><label>Piezīme</label><textarea id="f_note" rows="3">${esc(selected.reviewer_note??"")}</textarea></div>
    </div>
    <div class="actions sticky-actions">
      ${open?`<button class="primary" id="save">Saglabāt labojumu</button>
      <button id="follow">Jāpārbauda vēl</button>
      <button id="fast_scope_approve" type="button" hidden title="Tikai pilnām scope-only rindām; variable-weight ir bloķēts.">✓ In scope + apstiprināt</button> <button class="primary" id="approve">Apstiprināt un publicēt</button>
      <button class="danger" id="reject">Noraidīt</button>`:`<span class="muted">Ieraksts ir ${esc(statusLabel(selected.status).toLocaleLowerCase("lv-LV"))}.</span>`}
      ${reopenAllowed?'<button id="reopen" type="button">Atgriezt gaidīšanā</button>':""}<span class="shortcut-note">Ctrl+S saglabāt · ↑/↓ pārvietoties · / meklēt</span>
    </div>
    <details><summary>Oriģinālais parsera ieraksts</summary><pre>${esc(JSON.stringify(selected.original_payload,null,2))}</pre></details>
    <details><summary>Audit trail</summary><pre>${esc(JSON.stringify(selected.revisions||[],null,2))}</pre></details>`;
  $("f_scope").value=val(e,"scope")||"review";
  $("f_channel").value=val(e,"channel")||"physical_store";
  $("f_pricing_mode").value=val(e,"pricing_mode")||"";
  $("f_requires_app").value=val(e,"requires_app")?"true":"false";
  document.querySelectorAll("[data-date-target]").forEach(button=>{const id=button.dataset.dateTarget,textInput=$(id),picker=$(id+"_picker");button.onclick=()=>{const iso=parseLvDate(textInput.value);if(iso)picker.value=iso;try{picker.showPicker();}catch(error){picker.focus();picker.click();}};picker.onchange=()=>{if(picker.value){textInput.value=fmtDate(picker.value);textInput.dispatchEvent(new Event("input",{bubbles:true}));}};});
  if(!open){const form=$("detail").querySelector(".grid");form?.classList.add("readonly-form");form?.querySelectorAll("input,select,textarea,button").forEach(node=>node.disabled=true);}
  captureFormState();
  if($("save"))$("save").onclick=()=>save(false);
  if($("follow"))$("follow").onclick=()=>save(true);
  if($("approve"))$("approve").onclick=approve;
  if($("reject"))$("reject").onclick=reject;
  if($("reopen"))$("reopen").onclick=reopen;
  if($("fast_scope_approve"))$("fast_scope_approve").onclick=approveScopeOnlyFast;
  ["f_scope","f_channel"].forEach(id=>$(id)?.addEventListener("change",()=>{updateProductActionAvailability();updateScopeFastReviewButton();}));
  updateScopeFastReviewButton();
  updateProductActionAvailability();
  wirePreviewErrors();
  updateDetailNav();
  syncReviewUrl(id);
}
function corrections(){
  const g=id=>$(id).value.trim();
  const dateValue=id=>{const raw=g(id);if(!raw)return null;const iso=parseLvDate(raw);if(!iso)throw new Error("Datums jāievada formātā DD.MM.GGGG");return iso;};
  return {
    product_name:g("f_name"),
    brand:g("f_brand")||null,
    package_text:g("f_package")||null,
    price_eur:g("f_price")||null,
    regular_price_eur:g("f_regular")||null,
    unit_price_eur:g("f_unit")||null,
    unit_label:g("f_unit_label")||null,
    pricing_mode:g("f_pricing_mode")||null,
    regular_unit_price_eur:g("f_regular_unit")||null,
    example_weight_g:g("f_example_weight")||null,
    requires_app:g("f_requires_app")==="true",
    app_price_eur:g("f_app")||null,
    valid_from:dateValue("f_from"),
    valid_until:dateValue("f_until"),
    scope:$("f_scope").value,
    channel:$("f_channel").value
  };
}
async function call(url,opt,options={}){
  const itemId=selected?.id;
  const nextId=options.advance?preferredNextRowId(itemId):itemId;
  setBusy(true);
  try{
    const r=await fetch(url,opt);
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(detailMessage(d.detail,`HTTP ${r.status}`));
    replaceAuthoritativeItem(d);
    const preferredId=options.advance?nextId:itemId;
    await renderList(preferredId);
    const refreshed=await load(preferredId,{preserveOnError:true});
    if(refreshed&&options.successMessage)showToast(options.successMessage);
    return d;
  }catch(error){
    showToast(error?.message||"Darbība neizdevās",true);
    return null;
  }finally{
    setBusy(false);
  }
}
async function save(needs){
  let c;
  try{c=corrections();}catch(error){showToast(error?.message||String(error),true);return false;}
  const result=await call("/api/v1/review-items/"+selected.id,{
    method:"PATCH",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      corrections:c,
      note:$("f_note").value,
      needs_followup:needs
    })
  },{successMessage:needs?"Atzīmēts turpmākai pārbaudei.":"Labojums saglabāts."});
  return Boolean(result);
}
async function approve(){
  const scope=$("f_scope").value;
  const channel=$("f_channel").value;
  if(scope==="excluded"){showToast("Izslēgtu piedāvājumu nevar publicēt.",true);return;}
  if(channel!=="physical_store"){showToast("Publicēt drīkst tikai physical_store piedāvājumu.",true);return;}
  if(scope==="review")$("f_scope").value="in_scope";
  if(await save(false)===false)return;
  const published=await call("/api/v1/review-items/"+selected.id+"/approve",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note").value})
  },{advance:true,successMessage:"Piedāvājums publicēts."});
  if(published)notifyDealsRefresh(published);
}
async function reject(){
  if(dirty&&!window.confirm("Noraidot, nesaglabātie labojumi tiks atmesti. Turpināt?"))return;
  await call("/api/v1/review-items/"+selected.id+"/reject",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note").value})
  },{advance:true,successMessage:"Ieraksts noraidīts."});
}
async function reopen(){
  await call("/api/v1/review-items/"+selected.id+"/reopen",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({note:$("f_note")?.value||selected?.reviewer_note||null})
  },{advance:$("status").value!=="open",successMessage:"Ieraksts atgriezts gaidīšanā."});
}
async function changeStatus(value){if(!confirmDiscard()){$("status").value=lastStatus;return;}$("status").value=value;lastStatus=value;renderEmptyDetail();await renderList();}
async function moveSelection(delta){if(!confirmDiscard())return;const ids=visibleRowIds();if(!ids.length)return;const index=selected?ids.indexOf(selected.id):-1,target=index<0?0:Math.max(0,Math.min(ids.length-1,index+delta));if(target===index)return;await openItem(ids[target]);document.querySelector(`.row[data-id="${CSS.escape(ids[target])}"]`)?.scrollIntoView({block:"nearest"});}
$("reload").onclick=()=>{if(confirmDiscard())load(selected?.id||null);};
$("status").onchange=()=>changeStatus($("status").value);
$("reviewSearch").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>renderList(),160);});
$("prevItem").onclick=()=>moveSelection(-1);$("nextItem").onclick=()=>moveSelection(1);
document.addEventListener("keydown",event=>{const tag=event.target?.tagName;if((event.ctrlKey||event.metaKey)&&event.key.toLocaleLowerCase()==="s"){if($("save")&&!busy){event.preventDefault();save(false);}return;}if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;if(event.key==="/"){event.preventDefault();$("reviewSearch").focus();return;}if(event.key==="ArrowDown"){event.preventDefault();moveSelection(1);}if(event.key==="ArrowUp"){event.preventDefault();moveSelection(-1);}});
window.addEventListener("beforeunload",event=>{if(!dirty)return;event.preventDefault();event.returnValue="";});
const initialParams=new URLSearchParams(location.search);if(initialParams.has("status"))$("status").value=initialParams.get("status");lastStatus=$("status").value;if(initialParams.has("q"))$("reviewSearch").value=initialParams.get("q");load(initialParams.get("item"));


function scopeFastReviewEligible(item){
  if(!item || !["pending","draft","needs_followup"].includes(item.status)) return false;
  const reasons=new Set(item.reason_codes||[]);
  if(!reasons.has("scope_requires_review")) return false;
  if(reasons.has("variable_weight_requires_review")) return false;
  const p={...(item.original_payload||{}),...(item.corrected_payload||{})};
  if((p.price_basis||"")==="variable_weight_example") return false;
  if((p.channel||"")!=="physical_store") return false;
  const product=p.product_name||p.product_name_raw;
  return [product,p.price_eur,p.valid_from,p.valid_until]
    .every(v=>v!==null&&v!==undefined&&String(v).trim()!=="");
}
function updateScopeFastReviewButton(){
  const button=document.getElementById("fast_scope_approve");
  if(!button) return;
  button.hidden=!scopeFastReviewEligible(selected);
}
async function approveScopeOnlyFast(){
  if(!scopeFastReviewEligible(selected)) return;
  const itemId=selected.id;
  if(await save(false)===false)return;
  const body=await call(
    "/api/v1/review-items/"+encodeURIComponent(itemId)+"/approve-scope-only",
    {method:"POST"},
    {advance:true,successMessage:"Piedāvājums publicēts."}
  );
  if(body)notifyDealsRefresh(body);
}
// fast_scope_approve is created dynamically inside openItem(),
// so its handler is bound there after every render.

</script>
